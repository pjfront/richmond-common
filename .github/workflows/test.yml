name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Defense-in-depth: GitHub Actions defaults the bash shell to
        # `bash --noprofile --norc -eo pipefail {0}` on Linux runners, so
        # pytest's non-zero exit already fails the step. Setting `set -eo
        # pipefail` explicitly makes the intent visible at the call site and
        # keeps the workflow correct if a future shell override drops the
        # default. Split `cd src` onto its own line so a (vanishingly
        # unlikely) cd failure also fails the step rather than getting
        # short-circuited by `&&`.
        run: |
          set -eo pipefail
          cd src
          python -m pytest ../tests/ -v --tb=short
        env:
          # Tests use mocks, no real API keys needed
          DEEPSEEK_API_KEY: "sk-test-key"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
