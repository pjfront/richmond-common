name: Cloud Pipeline

on:
  # Crons restored 2026-07 (P0.4) with budget rails threaded (P0.0).
  # repository_dispatch stays disabled — n8n orchestration is retired.
  schedule:
    - cron: '0 6 * * 1'          # Monday pre-meeting scan
    - cron: '0 8 1 1,4,7,10 *'   # quarterly retrospective
  workflow_dispatch:
    inputs:
      meeting_date:
        description: 'Meeting date (YYYY-MM-DD). Leave empty to auto-detect next Tuesday.'
        required: false
        type: string
      scan_mode:
        description: 'prospective or retrospective'
        required: false
        default: 'prospective'
        type: choice
        options:
          - prospective
          - retrospective
      trigger_source:
        description: 'What triggered this run'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read

jobs:
  pipeline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Resolve inputs
        id: inputs
        env:
          INPUT_MEETING_DATE: ${{ github.event.inputs.meeting_date || github.event.client_payload.meeting_date || '' }}
          INPUT_SCAN_MODE: ${{ github.event.inputs.scan_mode || github.event.client_payload.scan_mode || 'prospective' }}
          INPUT_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || github.event.client_payload.trigger_source || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Resolve from workflow_dispatch inputs, repository_dispatch payload, or auto-detect for cron
          MEETING_DATE="$INPUT_MEETING_DATE"
          SCAN_MODE="$INPUT_SCAN_MODE"
          TRIGGER="$INPUT_TRIGGER_SOURCE"

          # Auto-detect next Tuesday for scheduled (cron) runs or empty manual runs
          if [ -z "$MEETING_DATE" ]; then
            MEETING_DATE=$(python3 -c "
          from datetime import date, timedelta
          today = date.today()
          days_ahead = (1 - today.weekday()) % 7  # Tuesday = 1
          if days_ahead == 0:
              days_ahead = 7
          print((today + timedelta(days=days_ahead)).isoformat())
          ")
            echo "Auto-detected next Tuesday: $MEETING_DATE"
          fi

          # Detect quarterly retrospective trigger (1st of month = retrospective sweep)
          if [ "$EVENT_NAME" = "schedule" ]; then
            CURRENT_DAY=$(date +%d)
            if [ "$CURRENT_DAY" = "01" ]; then
              SCAN_MODE="retrospective"
              TRIGGER="quarterly-retrospective"
              echo "Quarterly retrospective sweep triggered"
            fi
          fi

          # Default trigger source based on event type
          if [ -z "$TRIGGER" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              TRIGGER="scheduled"
            else
              TRIGGER="manual"
            fi
          fi

          if ! [[ "$MEETING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
             [ "$(date -u -d "$MEETING_DATE" +%F 2>/dev/null || true)" != "$MEETING_DATE" ]; then
            echo "::error::meeting_date must be a real date in YYYY-MM-DD form"
            exit 1
          fi
          case "$SCAN_MODE" in
            prospective|retrospective) ;;
            *) echo "::error::scan_mode must be prospective or retrospective"; exit 1 ;;
          esac
          if ! [[ "$TRIGGER" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::trigger_source must use 1-64 safe identifier characters"
            exit 1
          fi

          echo "meeting_date=$MEETING_DATE" >> "$GITHUB_OUTPUT"
          echo "scan_mode=$SCAN_MODE" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "Meeting: $MEETING_DATE | Mode: $SCAN_MODE | Trigger: $TRIGGER"

      - name: Run cloud pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIPELINE_MEETING_DATE: ${{ steps.inputs.outputs.meeting_date }}
          PIPELINE_SCAN_MODE: ${{ steps.inputs.outputs.scan_mode }}
          PIPELINE_TRIGGER_SOURCE: ${{ steps.inputs.outputs.trigger_source }}
          PIPELINE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd src
          python cloud_pipeline.py \
            --date "$PIPELINE_MEETING_DATE" \
            --scan-mode "$PIPELINE_SCAN_MODE" \
            --triggered-by "$PIPELINE_TRIGGER_SOURCE" \
            --pipeline-run-id "$PIPELINE_RUN_ID"

      - name: Data quality checks
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd src
          python data_quality_checks.py --create-decisions || true

      - name: Self-assessment
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd src
          python self_assessment.py --days 1 --create-decisions

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-${{ steps.inputs.outputs.meeting_date }}-${{ github.run_id }}
          path: src/data/audit_runs/
          retention-days: 90
