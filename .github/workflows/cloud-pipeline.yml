name: Cloud Pipeline

run-name: >-
  Cloud Pipeline — ${{ github.event.schedule || github.event.action ||
  github.event_name }}

on:
  # Crons restored 2026-07 (P0.4) with budget rails threaded (P0.0).
  # n8n orchestration remains retired. The typed operator event below always
  # executes the trusted default-branch workflow and is prospective-only.
  schedule:
    - cron: '0 6 * * 1'          # Monday pre-meeting scan
    - cron: '0 8 1 1,4,7,10 *'   # quarterly retrospective
  repository_dispatch:
    types: [operator-cloud-pipeline]

permissions:
  contents: read

jobs:
  pipeline:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'operator-cloud-pipeline' &&
        github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}

    steps:
      - name: Resolve inputs
        id: inputs
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_MEETING_DATE: ${{ github.event.client_payload.meeting_date || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if ! jq -e '
              type == "object" and
              ((keys - ["meeting_date"]) | length == 0) and
              (.meeting_date == null or (.meeting_date | type == "string"))
            ' <<<"$CLIENT_PAYLOAD" > /dev/null; then
              echo "::error::ACTION: Do not retry or request a retrospective scan. Give this run URL to a coding assistant and ask it to send only one optional meeting_date in a new operator-cloud-pipeline event."
              exit 1
            fi
          elif [ "$EVENT_NAME" != "schedule" ]; then
            echo "::error::ACTION: Do not retry this run. Give this run URL to a coding assistant and ask it to use only the trusted schedule or operator-cloud-pipeline event."
            exit 1
          fi

          MEETING_DATE="$INPUT_MEETING_DATE"
          SCAN_MODE="prospective"
          TRIGGER="operator"

          # Auto-detect next Tuesday for scheduled runs or an empty typed request.
          if [ -z "$MEETING_DATE" ]; then
            MEETING_DATE=$(python3 -c "
          from datetime import date, timedelta
          today = date.today()
          days_ahead = (1 - today.weekday()) % 7  # Tuesday = 1
          if days_ahead == 0:
              days_ahead = 7
          print((today + timedelta(days=days_ahead)).isoformat())
          ")
            echo "Auto-detected next Tuesday: $MEETING_DATE"
          fi

          # Only the trusted quarterly schedule may select retrospective mode.
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "0 8 1 1,4,7,10 *" ]; then
              SCAN_MODE="retrospective"
              TRIGGER="quarterly-retrospective"
              echo "Quarterly retrospective sweep triggered"
            elif [ "$EVENT_SCHEDULE" = "0 6 * * 1" ]; then
              TRIGGER="scheduled"
            else
              echo "::error::ACTION: Do not retry this run. Give this run URL to a coding assistant and ask it to verify the Cloud Pipeline schedule allowlist."
              exit 1
            fi
          fi

          if ! [[ "$MEETING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
             [ "$(date -u -d "$MEETING_DATE" +%F 2>/dev/null || true)" != "$MEETING_DATE" ]; then
            echo "::error::ACTION: Do not retry this pipeline. Send one real meeting_date in YYYY-MM-DD form, or omit it to use the next Tuesday."
            exit 1
          fi
          case "$SCAN_MODE" in
            prospective|retrospective) ;;
            *) echo "::error::ACTION: Do not retry this pipeline. Give this run URL to a coding assistant and ask it to restore the prospective/quarterly-retrospective mode allowlist."; exit 1 ;;
          esac
          if ! [[ "$TRIGGER" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::ACTION: Do not retry this pipeline. Give this run URL to a coding assistant and ask it to restore the fixed trigger-source identifier."
            exit 1
          fi

          echo "meeting_date=$MEETING_DATE" >> "$GITHUB_OUTPUT"
          echo "scan_mode=$SCAN_MODE" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "Meeting: $MEETING_DATE | Mode: $SCAN_MODE | Trigger: $TRIGGER"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Run cloud pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIPELINE_MEETING_DATE: ${{ steps.inputs.outputs.meeting_date }}
          PIPELINE_SCAN_MODE: ${{ steps.inputs.outputs.scan_mode }}
          PIPELINE_TRIGGER_SOURCE: ${{ steps.inputs.outputs.trigger_source }}
          PIPELINE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd src
          python cloud_pipeline.py \
            --date "$PIPELINE_MEETING_DATE" \
            --scan-mode "$PIPELINE_SCAN_MODE" \
            --triggered-by "$PIPELINE_TRIGGER_SOURCE" \
            --pipeline-run-id "$PIPELINE_RUN_ID"

      - name: Data quality checks
        if: always() && steps.inputs.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          cd src
          python data_quality_checks.py --create-decisions

      - name: Self-assessment
        if: always() && steps.inputs.outcome == 'success'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd src
          python self_assessment.py --days 1 --create-decisions

      - name: Upload audit artifacts
        if: always() && steps.inputs.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-${{ steps.inputs.outputs.meeting_date }}-${{ github.run_id }}
          path: src/data/audit_runs/
          retention-days: 90
