name: Subscriber Email Retry

on:
  schedule:
    - cron: '17 */4 * * *'
  # Typed repository_dispatch executes the trusted default-branch workflow.
  repository_dispatch:
    types: [subscriber-email-retry]

permissions:
  contents: read

concurrency:
  group: subscriber-email-retry
  cancel-in-progress: false

jobs:
  retry-deliveries:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'subscriber-email-retry' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retry due subscriber emails
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$API_SECRET" ]; then
            echo "::error::ACTION: Do not retry or resend subscriber email. Give this run URL to a coding assistant and ask it to verify the Richmond Commons API_SECRET Actions configuration without displaying its value, then return novice-safe repair steps."
            exit 1
          fi
          curl -sS --fail-with-body -X POST "https://richmondcommons.org/api/email/retry-deliveries" \
            -H "Authorization: Bearer $API_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
