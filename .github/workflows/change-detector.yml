name: Source Change Detector

on:
  schedule:
    - cron: '3,18,33,48 * * * *'  # every 15 min; no API itself, dispatches with per-event budget
  # Manual checks use a typed default-branch event so a branch copy can never
  # receive production Supabase access or dispatch authority.
  repository_dispatch:
    types: [operator-source-change-check]

permissions:
  # Same-repository repository_dispatch requires contents:write. Use the
  # short-lived, run-scoped GITHUB_TOKEN instead of the stale DISPATCH_TOKEN
  # PAT; repository_dispatch is an explicit GitHub exception that can start a
  # downstream workflow when authenticated with GITHUB_TOKEN.
  contents: write

concurrency:
  group: source-change-detector
  # The detector dispatches before acknowledging state. Never cancel it in
  # that side-effect window. GitHub Actions permits one running and one pending
  # run per concurrency group; the durable database outbox, not an unsupported
  # workflow key, retains every source-change obligation.
  cancel-in-progress: false

jobs:
  detect-changes:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'operator-source-change-check'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate trusted trigger payload before credentials
        id: inputs
        env:
          INPUT_SOURCE: ${{ github.event.client_payload.source || '' }}
          INPUT_DRY_RUN: ${{ github.event.client_payload.dry_run || 'false' }}
        run: |
          set -euo pipefail
          SOURCE="$INPUT_SOURCE"
          DRY_RUN="$INPUT_DRY_RUN"

          if [ -n "$SOURCE" ]; then
            case "$SOURCE" in
              escribemeetings|netfile|socrata|nextrequest|calaccess) ;;
              *)
                echo "::error::ACTION: Do not retry this run. Copy this run URL and error into Codex or ChatGPT with: In Richmond Commons, diagnose this bounded default-branch source-change-check validation failure without changing secrets, dispatching a sync, or correcting production data. Detail: source is not allowlisted."
                exit 1
                ;;
            esac
          fi
          case "$DRY_RUN" in
            true|false|'') ;;
            *)
              echo "::error::ACTION: Do not retry this run. Copy this run URL and error into Codex or ChatGPT with: In Richmond Commons, diagnose this bounded default-branch source-change-check validation failure without changing secrets, dispatching a sync, or correcting production data. Detail: dry_run must be true or false."
              exit 1
              ;;
          esac

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Sparse checkout (stdlib detector modules only)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            src/change_detector.py
            src/source_fingerprints.py
          sparse-checkout-cone-mode: false

      - name: Check for source changes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SOURCE: ${{ steps.inputs.outputs.source }}
          CHECK_DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$CHECK_SOURCE" ]; then
            ARGS+=(--source "$CHECK_SOURCE")
          fi
          case "$CHECK_DRY_RUN" in
            true) ARGS+=(--dry-run) ;;
            false|'') ;;
          esac
          python src/change_detector.py "${ARGS[@]}"
