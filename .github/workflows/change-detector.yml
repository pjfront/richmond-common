name: Source Change Detector

on:
  # KILL SWITCH (2026-05-12): scheduled trigger disabled. The change-detector
  # itself uses no Claude API, but every fingerprint change DISPATCHES to
  # data-sync.yml with `enrich: "true"`, which fans out to ~20 enrichment
  # functions, several of which call Claude unconditionally. Disabling the
  # 15-min cron eliminates that fan-out until the enrichment audit lands.
  # Re-enable by un-commenting the schedule: block below.
  # See branch claude/fix-api-billing-gFC3C.
  #
  # schedule:
  #   - cron: '3,18,33,48 * * * *'   # Every 15 min, offset from :00
  workflow_dispatch:
    inputs:
      source:
        description: 'Check a single source (or leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - escribemeetings
          - netfile
          - socrata
          - nextrequest
          - calaccess
      dry_run:
        description: 'Check without triggering dispatches'
        required: false
        default: false
        type: boolean

permissions:
  contents: write          # required for repository_dispatch to data-sync.yml

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Sparse checkout (change_detector.py only)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            src/change_detector.py
          sparse-checkout-cone-mode: false

      - name: Check for source changes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          SOURCE_ARG=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            SOURCE_ARG="--source ${{ github.event.inputs.source }}"
          fi

          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          python src/change_detector.py $SOURCE_ARG $DRY_RUN_ARG
