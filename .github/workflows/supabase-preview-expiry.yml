name: Supabase Preview Expiry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-preview-expiry
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted expiry controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Remove exact stale Preview branches
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: >-
          python src/supabase_preview.py sweep-expired
          --parent-ref ahrwvmizzykyyfavdvfv
          --max-age-seconds 5400
          --max-branches 10

      - name: Explain operator action on failure
        if: failure()
        run: |
          echo "::error::ACTION: rerun 'Supabase Preview Expiry'. If it fails again, give an LLM the failed run URL and ask it to clean only exact non-persistent pr-<N>-preview branches and their exact Vercel Preview deployment/environment state."
