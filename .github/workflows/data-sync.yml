name: Data Sync

run-name: >-
  Data Sync — ${{ github.event.client_payload.source || github.event.schedule ||
  github.event.inputs.source || github.event_name }}

on:
  # Schedules restored 2026-07 (P0.2/P0.3) with the budget lock threaded
  # into every Anthropic-calling job (P0.0). Division of labor:
  #   - change-detector (15-min cron) dispatches event-driven sources via
  #     repository_dispatch with per-event budgets: escribemeetings,
  #     netfile, nextrequest, calaccess, socrata_*.
  #   - The crons below also cover what calendar fingerprints cannot prove:
  #     the daily eSCRIBE agenda/attachment reconciliation, archive_center
  #     chain, and NextRequest catch-up, plus the
  #     weekly/monthly/quarterly completeness sweeps.
  # Each schedule-gated job string-matches its exact cron expression, so
  # adding/removing a cron here requires updating the matching job gates.
  schedule:
    - cron: '30 7 * * *'        # daily API-free tier (archive_center → written_comments, nextrequest)
    - cron: '0 8 * * 1'         # weekly pipeline (Mondays)
    - cron: '0 9 15 * *'        # monthly pipeline (15th)
    - cron: '0 10 1 1,4,7,10 *' # quarterly pipeline (1st of Jan/Apr/Jul/Oct)
  repository_dispatch:
    types: [sync-data]
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source to sync (ignored when job != none)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - netfile
          - calaccess
          - escribemeetings
          - escribemeetings_minutes
          - nextrequest
          - archive_center
          - refresh_stale_minutes
          - minutes_extraction
          - written_comments
          - meeting_summaries
          - form700
          - form803_behested
          - lobbyist_registrations
          - propublica
          - socrata_payroll
          - socrata_expenditures
          - socrata_permits
          - socrata_licenses
          - socrata_code_cases
          - socrata_service_requests
          - socrata_projects
      sync_type:
        description: 'full or incremental'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      limit:
        description: 'Max docs per run (minutes_extraction only). Re-run to continue backfill.'
        required: false
        default: ''
        type: string
      enrich:
        description: 'Run downstream enrichments after sync'
        required: false
        default: false
        type: boolean

# Concurrency control — only ONE write-path workflow runs at a time. The
# 2026-04-29 outage: three concurrent netfile syncs (triggered by repeat
# repository_dispatch events from a fingerprint-format upgrade) collided
# on the donors table. One sync's merge_donor_employers deleted donor
# rows that another sync was about to FK-reference, producing
# `contributions_donor_id_fkey` violations. Group by job kind, not by
# branch/run-id, so manual + dispatch + scheduled all fall into the same
# queue. cancel-in-progress is FALSE — we want the in-flight sync to
# finish, then the queued one to run; cancellation mid-write would leave
# a partial transaction state.
concurrency:
  group: data-sync-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Manual or change-detector-triggered single-source sync
  sync:
    # repository_dispatch always targets the default branch. workflow_dispatch
    # can target any ref, so explicitly reject branch copies before production
    # credentials are materialized. Only the change detector may use the
    # repository_dispatch path; operators use workflow_dispatch.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'sync-data' &&
          github.event.client_payload.trigger_source == 'change_detector'
        )
      )
    runs-on: ubuntu-latest
    # minutes_extraction makes sequential Claude API calls and can run for hours.
    # calaccess full sync downloads 1.5GB ZIP. All other sources are fast.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Resolve inputs
        id: inputs
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source || github.event.client_payload.source }}
          INPUT_SYNC_TYPE: ${{ github.event.inputs.sync_type || github.event.client_payload.sync_type || 'incremental' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '' }}
          INPUT_ENRICH: ${{ github.event.inputs.enrich || '' }}
          INPUT_CHANGE_ID: ${{ github.event.client_payload.change_id || '' }}
          INPUT_DISPATCH_GENERATION: ${{ github.event.client_payload.dispatch_generation || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SOURCE="$INPUT_SOURCE"
          SYNC_TYPE="$INPUT_SYNC_TYPE"
          LIMIT="$INPUT_LIMIT"
          TRIGGER="manual"
          ENRICH="$INPUT_ENRICH"
          CHANGE_ID=""
          DISPATCH_GENERATION=""
          EVENT_BUDGET=""

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TRIGGER="change_detector"
            SYNC_TYPE="incremental"
            ENRICH="true"
            LIMIT=""
            CHANGE_ID="$INPUT_CHANGE_ID"
            DISPATCH_GENERATION="$INPUT_DISPATCH_GENERATION"

            if ! [[ "$CHANGE_ID" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::repository_dispatch change_id must be 64 lowercase hex characters"
              exit 1
            fi
            if ! [[ "$DISPATCH_GENERATION" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::repository_dispatch dispatch_generation must be a positive integer"
              exit 1
            fi

            # Derive the per-event cap here rather than trusting caller input.
            # A compromised or malformed dispatcher cannot raise its own budget.
            case "$SOURCE" in
              netfile) EVENT_BUDGET="0.50" ;;
              escribemeetings) EVENT_BUDGET="0.30" ;;
              nextrequest|calaccess|socrata_expenditures|socrata_payroll|socrata_permits|socrata_licenses|socrata_code_cases|socrata_service_requests|socrata_projects)
                EVENT_BUDGET="0.10"
                ;;
              *)
                echo "::error::repository_dispatch source is not allowlisted: $SOURCE"
                exit 1
                ;;
            esac
          else
            case "$SOURCE" in
              netfile|calaccess|escribemeetings|escribemeetings_minutes|nextrequest|archive_center|refresh_stale_minutes|minutes_extraction|written_comments|meeting_summaries|form700|form803_behested|lobbyist_registrations|propublica|socrata_payroll|socrata_expenditures|socrata_permits|socrata_licenses|socrata_code_cases|socrata_service_requests|socrata_projects) ;;
              *)
                echo "::error::workflow_dispatch source is required and must be allowlisted (got: ${SOURCE:-empty})"
                exit 1
                ;;
            esac
            case "$SYNC_TYPE" in
              incremental|full) ;;
              *)
                echo "::error::sync_type must be incremental or full"
                exit 1
                ;;
            esac
          fi

          if [ -n "$LIMIT" ] && ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::limit must be a non-negative integer"
            exit 1
          fi

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "sync_type=$SYNC_TYPE" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "enrich=$ENRICH" >> "$GITHUB_OUTPUT"
          echo "change_id=$CHANGE_ID" >> "$GITHUB_OUTPUT"
          echo "dispatch_generation=$DISPATCH_GENERATION" >> "$GITHUB_OUTPUT"
          echo "event_budget_usd=$EVENT_BUDGET" >> "$GITHUB_OUTPUT"
          echo "Source: $SOURCE | Type: $SYNC_TYPE | Trigger: $TRIGGER | Limit: ${LIMIT:-none} | Enrich: ${ENRICH:-no} | EventBudget: ${EVENT_BUDGET:-none}"

      - name: Run data sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://richmondcommons.org' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
          RICHMOND_EVENT_BUDGET_USD: ${{ steps.inputs.outputs.event_budget_usd }}
          RICHMOND_EVENT_TYPE: ${{ steps.inputs.outputs.source }}
          RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}
          SYNC_SOURCE: ${{ steps.inputs.outputs.source }}
          SYNC_TYPE: ${{ steps.inputs.outputs.sync_type }}
          SYNC_TRIGGER: ${{ steps.inputs.outputs.trigger_source }}
          SYNC_LIMIT: ${{ steps.inputs.outputs.limit }}
          SYNC_ENRICH: ${{ steps.inputs.outputs.enrich }}
          SYNC_CHANGE_ID: ${{ steps.inputs.outputs.change_id }}
          SYNC_DISPATCH_GENERATION: ${{ steps.inputs.outputs.dispatch_generation }}
        run: |
          cd src
          ARGS=(
            --source "$SYNC_SOURCE"
            --sync-type "$SYNC_TYPE"
            --triggered-by "$SYNC_TRIGGER"
            --pipeline-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          )
          if [ -n "$SYNC_LIMIT" ]; then
            ARGS+=(--limit "$SYNC_LIMIT")
          fi
          if [ -n "$SYNC_CHANGE_ID" ]; then
            ARGS+=(--change-id "$SYNC_CHANGE_ID")
            ARGS+=(--dispatch-generation "$SYNC_DISPATCH_GENERATION")
          fi
          if [ "$SYNC_ENRICH" = "true" ]; then
            ARGS+=(--enrich)
          fi
          python data_sync.py "${ARGS[@]}"

      # Broadcast newly-generated agenda previews. Endpoint is idempotent
      # (skips meetings already emailed) and filters to upcoming regular
      # meetings, so it's safe to call after any sync/enrichment.
      - name: Send agenda preview emails
        if: always() && (steps.inputs.outputs.source == 'escribemeetings' || steps.inputs.outputs.enrich == 'true')
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://richmondcommons.org' }}
        run: |
          set -euo pipefail
          if [ -z "$API_SECRET" ]; then
            echo "::error::API_SECRET is missing; agenda preview delivery cannot run."
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$SITE_URL/api/email/send-orientation" \
            -H "Authorization: Bearer $API_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Self-assessment intentionally removed from the per-source sync job
      # on 2026-05-22. The dispatch path fires many times per day (change_detector
      # ticks + workflow_dispatch + per-source schedules), and running Haiku
      # self-assessment on every dispatch was burning the entire monthly cap
      # before the operator could see the value. Self-assessment now runs only
      # in weekly-pipeline / monthly-pipeline / quarterly-pipeline (~6 calls/month
      # total) — which matches its actual signal cadence: slow-moving pattern
      # detection across the journal, not per-event triage. Per-event anomaly
      # detection lives in T0.4's check_anomalies hold gate inside run_sync,
      # which doesn't call any API.

  # ── Daily: time-sensitive sources ────────────────────────────
  # NextRequest: 10-day CPRA response deadline.
  # eSCRIBE: agendas posted 1-3 days before meetings — daily scan
  # ensures new agendas appear same-day, not up to a week later.
  daily-nextrequest:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '30 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Sync NextRequest CPRA requests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd src
          python data_sync.py \
            --source nextrequest \
            --sync-type incremental \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

  # P0.2 rewire (2026-07): renamed scope — agenda sync (step 1 of the old
  # daily-escribemeetings) is covered by change-detector dispatch and was
  # REMOVED to avoid double-running. What remains is the minutes chain,
  # which change-detection can't see: minutes PDFs appear on already-known
  # meetings without changing the calendar fingerprint (that's how minutes
  # went 7+ weeks stale in June 2026). Runs on the daily cron; when the
  # budget lock/cap is active, the Claude extraction step exits 0 as a
  # graceful skip (P0.0/P0.9) while PDF discovery still completes.
  daily-escribemeetings:
    needs: daily-nextrequest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '30 7 * * *'
    runs-on: ubuntu-latest
    # Minutes extraction (~$0.06/meeting) + enrichment cascade (summaries, themes, recaps).
    timeout-minutes: 45
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      # Agenda catch-up for known-but-empty meetings. The change-detector
      # fingerprints the meeting CALENDAR (count + keys), so agenda content
      # posted onto an already-discovered meeting never trips a dispatch —
      # the 2026-07-07 meeting sat empty for days with its agenda live on
      # eSCRIBE. sync_escribemeetings incremental covers upcoming 14d +
      # past 60d and skips any meeting that already has items, so this is
      # near-free on the happy path and only spends (rails above) when an
      # agenda is genuinely missing.
      - name: Agenda catch-up (meetings without items) + enrichments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://richmondcommons.org' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          cd src
          python data_sync.py \
            --source escribemeetings \
            --sync-type incremental \
            --enrich \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      - name: Discover Post-Meeting Minutes + downstream enrichments
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://richmondcommons.org' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          cd src
          python data_sync.py \
            --source escribemeetings_minutes \
            --sync-type incremental \
            --enrich \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      - name: Extract newly discovered minutes + downstream enrichments
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://richmondcommons.org' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          cd src
          python data_sync.py \
            --source minutes_extraction \
            --enrich \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      # Broadcast pre-meeting orientation previews to subscribers.
      # Idempotent: only sends for upcoming regular meetings whose
      # orientation_preview is set and orientation_emailed_at is NULL.
      - name: Send agenda preview emails
        if: always()
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://richmondcommons.org' }}
        run: |
          set -euo pipefail
          if [ -z "$API_SECRET" ]; then
            echo "::error::API_SECRET is missing; agenda preview delivery cannot run."
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$SITE_URL/api/email/send-orientation" \
            -H "Authorization: Bearer $API_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

  # ── Daily: Archive Center + written comments ──────────────────
  # S24.24 change (2026-04-26): Archive Center previously synced
  # weekly (Mondays). The 4/21 Leisa-recap finding showed the gap —
  # the city posts written-comments PDFs to Archive Center mid-week
  # but our weekly didn't catch them until the following Monday. By
  # 4/26 (5 days post-meeting) we still had zero written comments
  # for 4/21 even though the city had posted them. Daily incremental
  # sync is cheap (~30 sec, no API cost — written_comments is
  # text-extraction only). Chains: archive_center -> written_comments
  # so newly-discovered comment PDFs get extracted same day.
  daily-archive-center:
    needs: daily-escribemeetings
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '30 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Download new Archive Center documents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd src
          python data_sync.py \
            --source archive_center \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      - name: Extract written comments from new PDFs
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd src
          python data_sync.py \
            --source written_comments \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

  # ── Daily: NetFile (campaign finance) ─────────────────────────
  # Election-season change (S24.17a, 2026-04-25): NetFile previously
  # synced weekly. The 4/24 460 filing deadline showed the gap — late
  # filings (F497 type-20) appear within hours of submission, and
  # voters during election season expect same-week visibility into
  # who's funding candidates. Daily incremental sync is cheap (~1 min,
  # API-only) and keeps the candidate finance data current.
  # P0.2 rewire (2026-07): netfile is covered by change-detector dispatch
  # (fingerprint-triggered, per-event budget). A daily cron here would
  # double-run it and multiply the D61 cross-filing churn (~3,400 writes
  # per run). Gate is `false` rather than deleted so the job can be
  # re-enabled after the D61 keeper-selection fix lands — flip the gate
  # back to a cron match if that ever happens.
  daily-netfile:
    if: false
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      - name: Sync NetFile campaign finance + downstream enrichments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://richmondcommons.org' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          cd src
          python data_sync.py \
            --source netfile \
            --sync-type incremental \
            --enrich \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

  # ── Weekly scheduled pipeline ──────────────────────────────────
  # Runs every Monday: minutes pipeline + all data sources.
  # Each source is a separate step so failures are isolated.
  # NextRequest also runs here (in addition to daily) to catch
  # any daily failures and ensure weekly completeness.
  weekly-pipeline:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

      # ── Minutes pipeline (existing) ──
      - name: Download new Archive Center documents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd src
          python data_sync.py \
            --source archive_center \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      # ── Refresh stale minutes (re-download PDFs the city may have updated in-place) ──
      - name: Refresh stale minutes documents
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd src
          python data_sync.py \
            --source refresh_stale_minutes \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      - name: Extract minutes to structured data
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd src
          python data_sync.py \
            --source minutes_extraction \
            --triggered-by scheduled \
            --pipeline-run-id "${{ github.run_id }}"

      # ── Written comment extraction (runs after minutes_extraction, no API cost) ──
