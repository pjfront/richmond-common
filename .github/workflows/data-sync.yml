  # ── Monthly sources ───────────────────────────────────────────
  # Runs 15th of month: CAL-ACCESS (1.5GB) + Socrata regulatory datasets.
  # 15th avoids collision with quarterly (1st of quarter months).
  monthly-pipeline:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '0 9 15 * *'
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system CA certificates
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Install dependencies
        run: pip install -r requirements.txt certifi

