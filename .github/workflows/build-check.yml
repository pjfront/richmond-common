name: Build Check

# Catch Vercel build failures before merge, not after.
#
# Why this exists:
#   The Vercel deploy is the only thing that actually exercises `next
#   build` against the real Supabase database. Local `next build`
#   typically can't (missing env, different network path), and tsc alone
#   misses runtime failures — most notably the `select('*')` -> anon
#   `statement_timeout` (Postgres error 57014) pattern we hit on
#   /financial-connections and /influence in the Phase 2.6 deploy (see
#   docs/AI-PARKING-LOT.md D8).
#
# What it does:
#   On every PR that touches web/** and every push to main, run `next build`.
#   Every main SHA needs this exact required check because production deploys
#   are bound to current main; a docs/backend-only merge must not strand the
#   next release without deployable CI evidence. PR builds use a syntactically
#   valid loopback Supabase configuration so preview code cannot read production
#   or spend production egress. The main-branch check retains the production
#   anon-role integration build.
#
# Secrets required:
#   NEXT_PUBLIC_SUPABASE_URL       — Supabase project URL (falls back to
#                                    SUPABASE_URL if unset)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  — Supabase anon JWT (NOT the service
#                                    role key — anon is what the public
#                                    sees, which is what we want to
#                                    validate against)
#
# Phase 2.10 (embeddings sidecar) will reduce list-query row size enough
# that prerender no longer needs `force-dynamic` for the heavy pages.
# Until then, this workflow is the safety net.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-check.yml'
  push:
    branches: [main]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values for vars only consulted at runtime (not prerender).
      # No privileged production secret is exposed to pull_request jobs.
      REVALIDATION_SECRET: ci-build-only-not-a-real-secret
      IRON_SESSION_PASSWORD: ci-build-only-32-char-padding-xxxx
      OPERATOR_PASSWORD: ci-build-only

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          # Never let isolated PR builds restore production-connected cache
          # entries. Bust within each namespace when deps or source change.
          key: nextjs-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'isolated-pr' || 'prod-integration' }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'isolated-pr' || 'prod-integration' }}-${{ hashFiles('web/package-lock.json') }}-
            nextjs-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'isolated-pr' || 'prod-integration' }}-

      - name: Configure isolated PR build environment
        if: github.event_name == 'pull_request'
        run: |
          # Supabase JS requires a URL and non-empty key. Port 9 is inert and
          # fails immediately if prerender code attempts a network query.
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:9" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=preview-build-inert-anon-key" >> "$GITHUB_ENV"
          echo "RICHMOND_BUILD_USES_PRODUCTION_DATA=false" >> "$GITHUB_ENV"

      - name: Configure main production integration build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # If either secret is missing, the build CANNOT prerender ISR
          # pages against live Supabase — and that's the whole point of
          # this workflow. Fail with a one-copy-paste fix message rather
          # than a generic "next build crashed" diagnostic.
          if [ -z "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::ACTION: Do not retry this build or paste a secret. Give this run URL to a coding assistant and ask it to verify the Richmond Commons NEXT_PUBLIC_SUPABASE_URL/SUPABASE_URL Actions configuration without displaying either value, then return novice-safe repair steps."
            exit 1
          fi
          if [ -z "$PRODUCTION_SUPABASE_ANON_KEY" ]; then
            echo "::error::ACTION: Do not retry this build or use SUPABASE_SERVICE_KEY. Give this run URL to a coding assistant and ask it to verify the Richmond Commons NEXT_PUBLIC_SUPABASE_ANON_KEY Actions configuration without displaying the value, then return novice-safe repair steps."
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PRODUCTION_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "RICHMOND_BUILD_USES_PRODUCTION_DATA=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (with retry-once for transient Supabase timeouts)
        working-directory: web
        run: |
          if [ "$RICHMOND_BUILD_USES_PRODUCTION_DATA" != "true" ]; then
            npm run build
            exit $?
          fi

          # First attempt. If it succeeds, we're done.
          if npm run build; then
            echo "::notice::ACTION: None — the build passed on its first attempt."
            exit 0
          fi

          echo "::warning::ACTION: None yet — the first build attempt failed and one bounded retry will run automatically after 30 seconds."
          echo "::warning::ACTION: None yet — wait for the bounded retry; if this warning recurs across runs, give those run URLs to a coding assistant and ask for a read-only /api/health and query-load diagnosis."
          sleep 30

          # Second (and final) attempt.
          if npm run build; then
            echo "::warning::ACTION: None today — the build passed on its bounded retry. If this warning recurs across runs, give the run URLs to a coding assistant and reference docs/AI-PARKING-LOT.md D8."
            exit 0
          fi

          echo "::error::ACTION: Do not retry this build. Give this run URL to a coding assistant and ask it to diagnose both failed build attempts without changing secrets, deploying, or editing production data."
          exit 1
