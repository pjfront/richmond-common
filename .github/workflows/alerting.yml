# Push alerting + external watcher (P1.1a / P1.1b).
#
# The keystone of the self-sustaining plan: converts "operator must notice"
# into "system notifies operator." Daily: public site/API health + liveness +
# LLM API cost + bounded provider configuration + civic calendar → alert
# email (Resend REST, direct from CI —
# deliberately NOT through the
# Vercel app, so alerts still work when the site is down) + deduplicated
# GitHub issues as the audit trail. Weekly (Mon): all-clear digest proves the
# channel is alive. Monthly (1st): summary + DB maintenance.
#
# P1.1b, the watcher outside the walls:
#   (a) at most one heartbeat commit per UTC day — repo activity never
#       lapses, so GitHub's 60-day scheduled-workflow auto-disable (public
#       repos) cannot fire. The branch follows main with ordinary fast-forward
#       pushes; it is never force-pushed and Vercel ignores it.
#   (b) healthchecks.io ping ONLY after a fully successful run — when this
#       workflow breaks (or its email step fails), pings stop and the
#       external service emails the operator. That converts "the alerting
#       died" from silence into signal.
#
# FAIL-LOUD CONTRACT: no step in this file may use the `|| echo non-fatal`
# swallow pattern (data-sync.yml's email step fails green — do not copy it).
# If an alert email is due and cannot be sent, this job FAILS, the ping is
# skipped, and the dead-man's switch eventually fires.
#
# No LLM anywhere in this workflow — no budget-lock env needed.

name: Alerting

on:
  schedule:
    - cron: '23 14 * * *'   # daily, 14:23 UTC (~6:23am Pacific, before the day starts)
  # Manual runs use repository_dispatch so GitHub always loads this workflow
  # from the protected default branch. The job below accepts only this exact
  # type and validates the requested mode before any provider secret is bound.
  repository_dispatch:
    types: [alerting-run]

permissions:
  contents: write   # heartbeat branch push
  issues: write     # alert audit trail

concurrency:
  group: alerting
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'alerting-run' &&
        github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate trusted trigger payload before credentials
        id: trigger
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ github.event.client_payload.mode || 'auto' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            REQUESTED_MODE="auto"
          elif [ "$EVENT_NAME" != "repository_dispatch" ]; then
            echo "::error::ACTION: Do not retry this run. Give this run URL to a coding assistant and ask it to diagnose why Alerting received neither its schedule nor the owner-only alerting-run event."
            exit 1
          elif ! jq -e '
            type == "object" and
            (keys == ["mode"]) and
            (.mode == "auto" or .mode == "daily" or
             .mode == "weekly" or .mode == "monthly")
          ' <<<"$CLIENT_PAYLOAD" > /dev/null; then
            echo "::error::ACTION: Do not retry this run. Give this run URL to a coding assistant and ask it to send exactly one mode—auto, daily, weekly, or monthly—in a new owner-only alerting-run event."
            exit 1
          fi
          case "$REQUESTED_MODE" in
            auto|daily|weekly|monthly) ;;
            *)
              echo "::error::ACTION: Do not retry this run. Give this run URL to a coding assistant and ask it to diagnose the validated alerting mode mismatch without changing secrets or dispatching another event."
              exit 1
              ;;
          esac
          echo "mode=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          # The heartbeat branch has its own daily commits. A real merge base
          # is required when bringing main forward; checkout's depth-1 default
          # can make the two fetched tips appear unrelated.
          fetch-depth: 0

      # FIRST OPERATIONAL STEP, after no-secret trigger validation: the
      # keepalive must depend on nothing but checkout and a trusted mode
      # (adversarial-review finding, 2026-07-05: placed after DB-dependent
      # checks, a persistent Supabase outage would skip it daily and quietly
      # re-open the 60-day auto-disable window it exists to close). Needs only
      # git — not python, gh, provider credentials, or the database.
      - name: Heartbeat commit (P1.1b-a keepalive)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Continue from the remote heartbeat branch instead of rebuilding it
          # from main and force-pushing every run. Merge the triggering main
          # revision first so branch-local controls (especially vercel.json)
          # cannot go stale. Concurrency above serializes scheduled/manual runs.
          git fetch --no-tags origin main
          if git fetch --no-tags origin heartbeat; then
            git checkout -B heartbeat origin/heartbeat
            git merge --no-edit origin/main
          else
            echo "Heartbeat branch does not exist yet; creating it from main."
            git checkout -B heartbeat origin/main
          fi
          HEARTBEAT_DAY="$(date -u +%F)"
          if [ -f .heartbeat ] && [ "$(cat .heartbeat)" = "$HEARTBEAT_DAY" ]; then
            echo "Heartbeat already recorded for $HEARTBEAT_DAY; no commit needed."
            # A main merge may still need publishing. An up-to-date push is a
            # true no-op and does not create a GitHub push event.
            git push origin heartbeat
            exit 0
          fi

          printf '%s\n' "$HEARTBEAT_DAY" > .heartbeat
          git add .heartbeat
          if git diff --cached --quiet; then
            echo "Heartbeat content is unchanged; no commit needed."
            exit 0
          fi
          git commit -m "heartbeat: alerting keepalive $HEARTBEAT_DAY [skip ci]"
          git push origin heartbeat

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies (slim — site probe uses Python stdlib)
        run: pip install --quiet psycopg2-binary pyyaml python-dotenv

      - name: Read open alert state (best-effort context and reminder cadence)
        id: issues
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE_STATE_FILE="$RUNNER_TEMP/open-alert-issues.json"
          gh issue list --repo "$GITHUB_REPOSITORY" --label alerting \
            --state open --limit 1000 \
            --json number,createdAt,title,body > "$ISSUE_STATE_FILE"
          COUNT=$(jq 'length' "$ISSUE_STATE_FILE")
          OLDEST=$(jq -r 'sort_by(.createdAt) | (.[0].createdAt // "")' \
            "$ISSUE_STATE_FILE")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "oldest=$OLDEST" >> "$GITHUB_OUTPUT"
          echo "file=$ISSUE_STATE_FILE" >> "$GITHUB_OUTPUT"

      - name: Run alerting checks
        id: checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          DEAD_MAN_ARMED: ${{ secrets.HEALTHCHECKS_PING_URL != '' }}
          ALERT_MODE: ${{ steps.trigger.outputs.mode }}
          OPEN_ALERT_ISSUES: ${{ steps.issues.outputs.count || '0' }}
          OLDEST_ALERT_ISSUE: ${{ steps.issues.outputs.oldest || '' }}
          OPEN_ALERT_ISSUES_FILE: ${{ steps.issues.outputs.file || '' }}
          PUBLIC_SITE_URL: https://richmondcommons.org/
          PUBLIC_HEALTH_URL: https://richmondcommons.org/api/health
        run: |
          set -euo pipefail
          ISSUE_ARGS=()
          if [ -n "$OPEN_ALERT_ISSUES_FILE" ] && [ -s "$OPEN_ALERT_ISSUES_FILE" ]; then
            ISSUE_ARGS=(--open-alert-issues-file "$OPEN_ALERT_ISSUES_FILE")
          fi
          python src/alerting.py \
            --mode "$ALERT_MODE" \
            --open-alert-issues "$OPEN_ALERT_ISSUES" \
            --oldest-alert-issue "$OLDEST_ALERT_ISSUE" \
            "${ISSUE_ARGS[@]}" \
            --out-dir alert_out
          cat alert_out/outputs.env >> "$GITHUB_OUTPUT"

      # Send before all issue mutations. GitHub Issues are the best-effort
      # audit/dedup layer and must never suppress the primary operator email.
      - name: Send alert email (Resend REST, fail-loud)
        if: steps.checks.outputs.send_email == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          SUBJECT: ${{ steps.checks.outputs.subject }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${OPERATOR_EMAIL:-}" ]; then
            echo "::error::ACTION: Do not rerun this workflow. Copy this run's browser URL and give it to a coding assistant with this message: Verify the Richmond Commons RESEND_API_KEY secret and OPERATOR_EMAIL variable without exposing their values, then tell me the exact novice-safe fix. The operator is not receiving this due alert. Do not dispatch another run."
            exit 1
          fi
          jq -n \
            --arg from "Richmond Commons Alerts <updates@richmondcommons.org>" \
            --arg to "$OPERATOR_EMAIL" \
            --arg subject "$SUBJECT" \
            --rawfile text alert_out/email_body.txt \
            '{from: $from, to: [$to], subject: $subject, text: $text}' \
          | curl --fail -sS --connect-timeout 10 --max-time 30 \
              -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
          echo "Alert email sent to operator."

      - name: Ensure 'alerting' label exists
        id: ensure_label
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create alerting \
            --repo "$GITHUB_REPOSITORY" \
            --description "Automated alert audit trail (P1.1a)" \
            --color D93F0B --force

      - name: File alert issues (audit trail — a record, not the alert)
        id: file_alert_issues
        if: steps.checks.outputs.issue_count != '0'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ID=$(jq -r .id <<<"$line")
            TITLE=$(jq -r .title <<<"$line")
            MARKER="<!-- richmond-alert-key:$ID -->"
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                        --label alerting --state open \
                        --limit 1000 --json number,title,body \
                      | jq -r --arg marker "$MARKER" --arg id "$ID" \
                          '[.[] | select(
                            (((.body // "") | contains($marker)) or
                             (.title | startswith("[liveness] " + $id + " (")) or
                             (.title | startswith("[suppression expired] " + $id + " is")))
                          )] | .[0].number // empty')
            if [ -z "$EXISTING" ]; then
              jq -r .body <<<"$line" | gh issue create \
                --repo "$GITHUB_REPOSITORY" --label alerting \
                --title "$TITLE" --body-file -
              echo "Filed: $TITLE"
            else
              jq -r .body <<<"$line" | gh issue edit "$EXISTING" \
                --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file -
              echo "Refreshed alert audit body for open alert: $ID"
            fi
          done < alert_out/issues.jsonl

      - name: Close recovered alert issues
        id: close_alerts
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --label alerting \
            --state open --limit 1000 --json number,title,body \
            > alert_out/open_alert_issues.json
          while IFS= read -r ID; do
            [ -z "$ID" ] && continue
            MARKER="<!-- richmond-alert-key:$ID -->"
            jq -r --arg marker "$MARKER" --arg id "$ID" \
              '.[] | select(
                (((.body // "") | contains($marker)) or
                 (.title | startswith("[liveness] " + $id + " (")) or
                 (.title | startswith("[suppression expired] " + $id + " is")))
              ) | .number' \
              alert_out/open_alert_issues.json \
            | while IFS= read -r NUMBER; do
                [ -z "$NUMBER" ] && continue
                gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                  --comment "ACTION: None — this check recovered automatically."
              done
          done < alert_out/recovered_alert_ids.txt

      - name: Monthly DB maintenance (superseded-flag prune + VACUUM)
        if: >-
          steps.checks.outputs.mode == 'monthly' &&
          github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/db_maintenance.py

      # The email above is the primary notification path. Audit failures are
      # reported only after that path has had its chance to run; failing here
      # also withholds the external heartbeat so the independent monitor sees
      # a persistent audit-channel outage.
      - name: Fail after email if the GitHub audit trail was unavailable
        if: >-
          always() &&
          (steps.ensure_label.outcome == 'failure' ||
           steps.issues.outcome == 'failure' ||
           steps.file_alert_issues.outcome == 'failure' ||
           steps.close_alerts.outcome == 'failure')
        run: |
          echo "::error::ACTION: Do not repeat the alert's requested action or manually resend its email; the primary email step may already have sent it. Copy this run's browser URL and give it to a coding assistant with this message: Diagnose why the Richmond Commons GitHub alert audit trail failed after the primary email step. Do not dispatch another run or change production data."
          exit 1

      # LAST step, only on full success: the external dead-man's switch.
      # healthchecks.io emails the operator when pings stop — the one
      # component outside the GitHub/Vercel/Supabase failure domain.
      - name: Dead-man's switch ping (P1.1b-b)
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTHCHECKS_PING_URL:-}" ]; then
            echo "::warning::ACTION: Open https://github.com/pjfront/richmond-common/blob/main/docs/operator-alert-playbook.md#alerting-stopped and complete the numbered Healthchecks.io setup steps. Until then the external dead-man's switch is not protecting this workflow."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL" > /dev/null
          echo "Dead-man's switch pinged."
