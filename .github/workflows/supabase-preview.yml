name: Supabase Preview

# Cost-aware by design: bootstrap is an explicit workflow_dispatch for a
# specific PR. Closing/merging that PR always runs cleanup, even if its Git
# branch has already been deleted. The controller and credentials always come
# from trusted main; PR code is checked out separately and only its SQL files
# are read as data.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Create a clean branch or clean an existing one
        required: true
        type: choice
        options:
          - bootstrap
          - cleanup
      pr_number:
        description: Pull request number
        required: true
        type: number
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: supabase-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  # Never cancel a mutation mid-flight. A close event queues behind an active
  # bootstrap and then removes the final immutable branch ref.
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_OPERATION: ${{ github.event_name == 'pull_request_target' && 'cleanup' || inputs.action }}
      REQUESTED_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      SUPABASE_PARENT_PROJECT_REF: ahrwvmizzykyyfavdvfv
      SCHEMA_TYPE_STATUS_CONTEXT: Schema Type Gate

    steps:
      # pull_request_target can read repository secrets, so the executable
      # controller MUST come from trusted main rather than the PR head.
      - name: Check out trusted lifecycle controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Resolve and validate pull request identity
        id: pr
        uses: actions/github-script@v8
        env:
          PREVIEW_OPERATION: ${{ env.PREVIEW_OPERATION }}
          REQUESTED_PR_NUMBER: ${{ env.REQUESTED_PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.REQUESTED_PR_NUMBER)
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed('PR number must be a positive integer')
              return
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })
            if (pr.base.ref !== 'main') {
              core.setFailed(`PR #${prNumber} does not target main`)
              return
            }
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PRs cannot receive Richmond control-plane credentials')
              return
            }
            if (process.env.PREVIEW_OPERATION === 'bootstrap' && pr.state !== 'open') {
              core.setFailed(`Cannot bootstrap closed PR #${prNumber}`)
              return
            }
            core.setOutput('number', String(prNumber))
            core.setOutput('head_ref', pr.head.ref)
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('head_repo', pr.head.repo.full_name)

      # This checkout contains untrusted PR files. No secret-bearing command is
      # executed from it; the trusted controller reads only timestamped SQL.
      - name: Check out PR migrations as inert input
        if: env.PREVIEW_OPERATION == 'bootstrap'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: preview-head
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate trusted baseline and migration integrity
        id: validate
        if: env.PREVIEW_OPERATION == 'bootstrap'
        run: >-
          python src/supabase_preview.py validate
          --migrations-dir preview-head/supabase/migrations
          --migrations-root preview-head
          --baseline-dir supabase/preview-baseline

      - name: Bootstrap clean-room Preview branch
        id: bootstrap
        if: env.PREVIEW_OPERATION == 'bootstrap'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py bootstrap
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
          --migrations-dir preview-head/supabase/migrations
          --migrations-root preview-head
          --baseline-dir supabase/preview-baseline
          --replace

      - name: Install pinned Supabase CLI for exact-head typegen
        if: env.PREVIEW_OPERATION == 'bootstrap' && steps.bootstrap.outcome == 'success'
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      - name: Compare Preview-generated public types with exact PR head
        id: preview_types
        if: env.PREVIEW_OPERATION == 'bootstrap' && steps.bootstrap.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_BRANCH_REF: ${{ steps.bootstrap.outputs.supabase_branch_ref }}
        shell: bash
        run: |
          generated="$RUNNER_TEMP/database.types.preview.ts"
          pr_root="$(realpath preview-head)"
          pr_types="preview-head/web/src/lib/database.types.ts"
          if [ -L "$pr_types" ] || [ ! -f "$pr_types" ]; then
            echo "::error::database.types.ts must be a regular non-symlink file."
            exit 1
          fi
          resolved_types="$(realpath "$pr_types")"
          case "$resolved_types" in
            "$pr_root"/*) ;;
            *) echo "::error::database.types.ts escapes the inert PR checkout."; exit 1 ;;
          esac
          if [ "$(stat -c%s "$pr_types")" -gt 2000000 ]; then
            echo "::error::database.types.ts exceeds the 2 MB gate limit."
            exit 1
          fi
          supabase gen types typescript \
            --project-id "$PREVIEW_BRANCH_REF" \
            --schema public > "$generated"
          if ! cmp -s "$generated" "$pr_types"; then
            echo "::error::database.types.ts differs from the exact PR Preview schema."
            diff -u "$pr_types" "$generated" | head -80 || true
            exit 1
          fi

      - name: Remove failed Preview type environment
        if: failure() && env.PREVIEW_OPERATION == 'bootstrap' && steps.bootstrap.outputs.supabase_branch_ref != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Bind Preview type result to exact PR head
        if: always() && env.PREVIEW_OPERATION == 'bootstrap'
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          STATUS_CONTEXT: ${{ env.SCHEMA_TYPE_STATUS_CONTEXT }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          TYPE_OUTCOME: ${{ steps.preview_types.outcome }}
        with:
          script: |
            const passed = (
              process.env.VALIDATE_OUTCOME === 'success' &&
              process.env.BOOTSTRAP_OUTCOME === 'success' &&
              process.env.TYPE_OUTCOME === 'success'
            )
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: passed
                ? 'Exact PR types match its clean-room Preview schema'
                : 'Clean-room Preview schema/type comparison failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Clean Preview branch and exact Vercel targets
        if: env.PREVIEW_OPERATION == 'cleanup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
