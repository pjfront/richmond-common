name: Supabase Preview
run-name: Supabase Preview | action=${{ github.event_name == 'pull_request_target' && 'cleanup' || github.event.client_payload.action }} | pr=${{ github.event.pull_request.number || github.event.client_payload.pr_number }}

# One explicit, non-replacing bootstrap may retain its exact branch only for a
# SHA-bound type-only follow-up. Independent trusted 90- and 110-minute
# hard-delete workflows enforce the normal-operation two-hour ceiling.
on:
  # repository_dispatch always executes the default-branch workflow SHA/ref.
  # workflow_dispatch is intentionally absent because its selected ref can
  # supply an older or edited privileged workflow before an in-file guard runs.
  repository_dispatch:
    types: [supabase-preview-lifecycle]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: supabase-preview-control-plane
  queue: max
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'supabase-preview-lifecycle' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREVIEW_OPERATION: ${{ github.event_name == 'pull_request_target' && 'cleanup' || github.event.client_payload.action }}
      REQUESTED_PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
      REQUESTED_SOURCE_HEAD_SHA: ${{ github.event.client_payload.source_head_sha || '' }}
      SUPABASE_PARENT_PROJECT_REF: ahrwvmizzykyyfavdvfv
      SCHEMA_TYPE_STATUS_CONTEXT: Schema Type Gate

    steps:
      # Secrets are reachable here, so all executable code comes from trusted main.
      - name: Check out trusted lifecycle controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Resolve and validate pull request identity
        id: pr
        uses: actions/github-script@v8
        env:
          PREVIEW_OPERATION: ${{ env.PREVIEW_OPERATION }}
          REQUESTED_PR_NUMBER: ${{ env.REQUESTED_PR_NUMBER }}
          REQUESTED_SOURCE_HEAD_SHA: ${{ env.REQUESTED_SOURCE_HEAD_SHA }}
        with:
          script: |
            const operation = process.env.PREVIEW_OPERATION
            if (!['bootstrap', 'verify-types', 'cleanup'].includes(operation)) {
              core.setFailed(`Unsupported Preview operation: ${operation}`)
              return
            }
            const prNumber = Number(process.env.REQUESTED_PR_NUMBER)
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed('PR number must be a positive integer')
              return
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })
            if (pr.base.ref !== 'main') {
              core.setFailed(`PR #${prNumber} does not target main`)
              return
            }
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PRs cannot receive Richmond control-plane credentials')
              return
            }
            if (operation !== 'cleanup' && pr.state !== 'open') {
              core.setFailed(`Cannot ${operation} closed PR #${prNumber}`)
              return
            }
            // Emit the validated same-repo PR identity before checking H0 so an
            // always() verify cleanup can still target an existing retained
            // Preview when a malformed source SHA makes this step fail.
            core.setOutput('number', String(prNumber))
            core.setOutput('head_ref', pr.head.ref)
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('head_repo', pr.head.repo.full_name)
            const sourceSha = process.env.REQUESTED_SOURCE_HEAD_SHA.trim().toLowerCase()
            if (operation !== 'cleanup' && !/^[a-f0-9]{40}$/.test(sourceSha)) {
              core.setFailed('bootstrap and verify-types require a full lowercase H0 SHA')
              return
            }
            if (operation === 'bootstrap' && sourceSha !== pr.head.sha) {
              core.setFailed('Bootstrap H0 must equal the exact current PR head')
              return
            }
            core.setOutput('source_head_sha', sourceSha)

      # These checkouts remain inert; no PR-owned executable receives secrets.
      - name: Check out exact current PR head as inert input
        if: env.PREVIEW_OPERATION == 'bootstrap' || env.PREVIEW_OPERATION == 'verify-types'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: preview-head
          persist-credentials: false

      - name: Check out retained source head as inert input
        if: env.PREVIEW_OPERATION == 'verify-types'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.source_head_sha }}
          path: preview-source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate trusted baseline and migration integrity
        id: validate
        if: env.PREVIEW_OPERATION == 'bootstrap'
        run: >-
          python src/supabase_preview.py validate
          --migrations-dir preview-head/supabase/migrations
          --migrations-root preview-head
          --baseline-dir supabase/preview-baseline

      - name: Bootstrap one clean-room Preview branch without replacement
        id: bootstrap
        if: env.PREVIEW_OPERATION == 'bootstrap'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
          SOURCE_HEAD_SHA: ${{ steps.pr.outputs.source_head_sha }}
        run: >-
          python src/supabase_preview.py bootstrap
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
          --source-head-sha "$SOURCE_HEAD_SHA"
          --migrations-dir preview-head/supabase/migrations
          --migrations-root preview-head
          --baseline-dir supabase/preview-baseline

      - name: Record trusted H0-to-H1 commit metadata
        id: commit_metadata
        if: env.PREVIEW_OPERATION == 'verify-types'
        uses: actions/github-script@v8
        env:
          SOURCE_HEAD_SHA: ${{ steps.pr.outputs.source_head_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs')
            const source = process.env.SOURCE_HEAD_SHA
            const head = process.env.HEAD_SHA
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner, repo: context.repo.repo, ref: head,
            })
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo,
              basehead: `${source}...${head}`,
            })
            const metadata = {
              head_sha: commit.sha,
              parent_shas: commit.parents.map(parent => parent.sha),
              files: (comparison.files || []).map(file => ({
                path: file.filename,
                status: file.status,
                previous_path: file.previous_filename || null,
              })),
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/type-update-metadata.json`, JSON.stringify(metadata))

      - name: Verify direct-child type-only update and immutable inventories
        id: verify_input
        if: env.PREVIEW_OPERATION == 'verify-types'
        env:
          SOURCE_HEAD_SHA: ${{ steps.pr.outputs.source_head_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: >-
          python src/supabase_preview.py verify-type-update
          --metadata-json "$RUNNER_TEMP/type-update-metadata.json"
          --source-root preview-source
          --head-root preview-head
          --source-head-sha "$SOURCE_HEAD_SHA"
          --head-sha "$HEAD_SHA"

      - name: Verify exact retained branch and H0-bound Vercel identity read-only
        id: retained
        if: env.PREVIEW_OPERATION == 'verify-types' && steps.verify_input.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
          SOURCE_HEAD_SHA: ${{ steps.pr.outputs.source_head_sha }}
        run: >-
          python src/supabase_preview.py verify-retained
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
          --source-head-sha "$SOURCE_HEAD_SHA"
          --max-age-seconds 7200

      - name: Install pinned Supabase CLI for exact-head typegen
        if: >-
          (env.PREVIEW_OPERATION == 'bootstrap' && steps.bootstrap.outcome == 'success') ||
          (env.PREVIEW_OPERATION == 'verify-types' && steps.retained.outcome == 'success')
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      - name: Compare Preview-generated public types with bootstrap H0
        id: preview_types
        if: env.PREVIEW_OPERATION == 'bootstrap' && steps.bootstrap.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_BRANCH_REF: ${{ steps.bootstrap.outputs.supabase_branch_ref }}
        shell: bash
        run: |
          generated="$RUNNER_TEMP/database.types.preview.ts"
          pr_root="$(realpath preview-head)"
          pr_types="preview-head/web/src/lib/database.types.ts"
          if [ -L "$pr_types" ] || [ ! -f "$pr_types" ]; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose why database.types.ts is invalid; it must be a regular non-symlink file in the PR."
            exit 1
          fi
          resolved_types="$(realpath "$pr_types")"
          case "$resolved_types" in
            "$pr_root"/*) ;;
            *) echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then contain why database.types.ts resolves outside the inert PR checkout."; exit 1 ;;
          esac
          if [ "$(stat -c%s "$pr_types")" -gt 2000000 ]; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose why database.types.ts exceeds the 2 MB gate."
            exit 1
          fi
          if ! python src/supabase_preview.py generate-types \
            --project-ref "$PREVIEW_BRANCH_REF" \
            --output "$generated" \
            --max-wait-seconds 120; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose the bounded Preview type-generation failure."
            exit 1
          fi
          if [ -L "$generated" ] || [ ! -f "$generated" ] || [ "$(stat -c%s "$generated")" -gt 2000000 ]; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose the missing, linked, or oversized generated types artifact."
            exit 1
          fi
          if ! cmp -s "$generated" "$pr_types"; then
            echo "type_mismatch=true" >> "$GITHUB_OUTPUT"
            echo "::error::ACTION: Do not deploy or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, reconcile database.types.ts with the exact bootstrap H0 Preview schema after verifying exact Preview cleanup."
            diff -u "$pr_types" "$generated" | head -80 || true
            exit 1
          fi

      - name: Upload SHA-bound generated types
        id: preview_types_artifact
        if: >-
          always() && env.PREVIEW_OPERATION == 'bootstrap' &&
          steps.bootstrap.outcome == 'success' &&
          (steps.preview_types.outcome == 'success' ||
           steps.preview_types.outputs.type_mismatch == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: database-types-pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.source_head_sha }}
          path: ${{ runner.temp }}/database.types.preview.ts
          if-no-files-found: error
          retention-days: 7

      - name: Remove failed bootstrap except retained type mismatch
        if: >-
          always() && env.PREVIEW_OPERATION == 'bootstrap' &&
          steps.bootstrap.outputs.supabase_branch_ref != '' &&
          (steps.preview_types_artifact.outcome != 'success' ||
           (steps.preview_types.outcome != 'success' &&
            steps.preview_types.outputs.type_mismatch != 'true'))
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Bind bootstrap type result to exact H0
        id: bootstrap_status
        if: always() && env.PREVIEW_OPERATION == 'bootstrap' && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          STATUS_CONTEXT: ${{ env.SCHEMA_TYPE_STATUS_CONTEXT }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          TYPE_OUTCOME: ${{ steps.preview_types.outcome }}
        with:
          script: |
            const passed = process.env.VALIDATE_OUTCOME === 'success' &&
              process.env.BOOTSTRAP_OUTCOME === 'success' &&
              process.env.TYPE_OUTCOME === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: passed
                ? 'Exact H0 types match its clean-room Preview schema'
                : 'Clean-room H0 Preview schema/type comparison failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Remove otherwise-retainable bootstrap if H0 status binding fails
        if: >-
          always() && env.PREVIEW_OPERATION == 'bootstrap' &&
          steps.bootstrap.outputs.supabase_branch_ref != '' &&
          steps.preview_types_artifact.outcome == 'success' &&
          (steps.preview_types.outcome == 'success' ||
           steps.preview_types.outputs.type_mismatch == 'true') &&
          steps.bootstrap_status.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Request trusted exact H0 Vercel Preview deployment
        id: h0_deployment
        if: >-
          env.PREVIEW_OPERATION == 'bootstrap' &&
          steps.preview_types.outcome == 'success' &&
          steps.bootstrap_status.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
          SOURCE_HEAD_SHA: ${{ steps.pr.outputs.source_head_sha }}
          APPROVED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          GIT_OWNER: ${{ github.repository_owner }}
          GIT_REPO: ${{ github.event.repository.name }}
        run: >-
          python src/supabase_preview.py authorize-deployment
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
          --source-head-sha "$SOURCE_HEAD_SHA"
          --approved-head-sha "$APPROVED_HEAD_SHA"
          --git-owner "$GIT_OWNER"
          --git-repo "$GIT_REPO"
          --max-age-seconds 7200

      - name: Remove H0 Preview after trusted deployment request failure
        if: >-
          always() && env.PREVIEW_OPERATION == 'bootstrap' &&
          steps.bootstrap.outputs.supabase_branch_ref != '' &&
          steps.preview_types.outcome == 'success' &&
          steps.bootstrap_status.outcome == 'success' &&
          steps.h0_deployment.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Compare retained Preview-generated public types with exact H1
        id: verify_types
        if: env.PREVIEW_OPERATION == 'verify-types' && steps.retained.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_BRANCH_REF: ${{ steps.retained.outputs.supabase_branch_ref }}
        shell: bash
        run: |
          generated="$RUNNER_TEMP/database.types.verify.ts"
          h1_root="$(realpath preview-head)"
          h1_types="preview-head/web/src/lib/database.types.ts"
          if [ -L "$h1_types" ] || [ ! -f "$h1_types" ]; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose why H1 database.types.ts is invalid; it must be a regular non-symlink file."
            exit 1
          fi
          resolved_types="$(realpath "$h1_types")"
          case "$resolved_types" in
            "$h1_root"/*) ;;
            *) echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then contain why H1 database.types.ts resolves outside the inert checkout."; exit 1 ;;
          esac
          if [ "$(stat -c%s "$h1_types")" -gt 2000000 ]; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose why H1 database.types.ts exceeds the 2 MB gate."
            exit 1
          fi
          if ! python src/supabase_preview.py generate-types \
            --project-ref "$PREVIEW_BRANCH_REF" \
            --output "$generated" \
            --max-wait-seconds 120; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose the bounded retained-Preview type-generation failure."
            exit 1
          fi
          if [ -L "$generated" ] || [ ! -f "$generated" ] || [ "$(stat -c%s "$generated")" -gt 2000000 ]; then
            echo "::error::ACTION: Do not retry or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, verify exact Preview cleanup, then diagnose the missing, linked, or oversized generated H1 types artifact."
            exit 1
          fi
          cmp -s "$generated" "$h1_types" || {
            echo "::error::ACTION: Do not deploy or create another Preview. Give this run URL to a coding assistant with: In Richmond Commons, reconcile H1 database.types.ts with retained Preview typegen after verifying exact Preview cleanup."
            exit 1
          }

      - name: Remove retained Preview after any verify failure
        id: verify_cleanup
        if: >-
          always() && env.PREVIEW_OPERATION == 'verify-types' &&
          steps.pr.outputs.head_ref != '' && steps.verify_types.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Bind verify-types result to exact H1
        id: verify_status
        if: always() && env.PREVIEW_OPERATION == 'verify-types' && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          STATUS_CONTEXT: ${{ env.SCHEMA_TYPE_STATUS_CONTEXT }}
          INPUT_OUTCOME: ${{ steps.verify_input.outcome }}
          RETAINED_OUTCOME: ${{ steps.retained.outcome }}
          TYPE_OUTCOME: ${{ steps.verify_types.outcome }}
          CLEANUP_OUTCOME: ${{ steps.verify_cleanup.outcome }}
        with:
          script: |
            const passed = process.env.INPUT_OUTCOME === 'success' &&
              process.env.RETAINED_OUTCOME === 'success' &&
              process.env.TYPE_OUTCOME === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: passed
                ? 'Exact H1 type-only update matches retained H0 Preview schema'
                : (process.env.CLEANUP_OUTCOME === 'success'
                    ? 'Retained Preview type verification failed and was cleaned'
                    : 'Retained Preview type verification failed; cleanup needs attention'),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Remove retained Preview if successful H1 status binding fails
        if: >-
          always() && env.PREVIEW_OPERATION == 'verify-types' &&
          steps.retained.outputs.supabase_branch_ref != '' &&
          steps.verify_types.outcome == 'success' &&
          steps.verify_status.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Rebind and request trusted exact H1 Vercel Preview deployment
        id: h1_deployment
        if: >-
          env.PREVIEW_OPERATION == 'verify-types' &&
          steps.verify_types.outcome == 'success' &&
          steps.verify_status.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
          SOURCE_HEAD_SHA: ${{ steps.pr.outputs.source_head_sha }}
          APPROVED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          GIT_OWNER: ${{ github.repository_owner }}
          GIT_REPO: ${{ github.event.repository.name }}
        run: >-
          python src/supabase_preview.py authorize-deployment
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
          --source-head-sha "$SOURCE_HEAD_SHA"
          --approved-head-sha "$APPROVED_HEAD_SHA"
          --git-owner "$GIT_OWNER"
          --git-repo "$GIT_REPO"
          --verified-type-only-rebind
          --max-age-seconds 7200

      - name: Remove H1 Preview after trusted deployment request failure
        if: >-
          always() && env.PREVIEW_OPERATION == 'verify-types' &&
          steps.retained.outputs.supabase_branch_ref != '' &&
          steps.verify_types.outcome == 'success' &&
          steps.verify_status.outcome == 'success' &&
          steps.h1_deployment.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"

      - name: Clean Preview branch and exact Vercel targets
        if: env.PREVIEW_OPERATION == 'cleanup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_GIT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: >-
          python src/supabase_preview.py cleanup
          --parent-ref "$SUPABASE_PARENT_PROJECT_REF"
          --pr-number "$PREVIEW_PR_NUMBER"
          --git-branch "$PREVIEW_GIT_BRANCH"
