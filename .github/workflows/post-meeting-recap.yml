name: Post-Meeting Recap

# Runs daily. Queries the DB for yesterday's meeting â€” only runs
# the pipeline when a regular council meeting actually happened.
# Costs nothing on non-meeting days (one REST call, exits in <1s).
#
# KCRT uploads YouTube transcripts within hours of the meeting.
# Running at 7am Pacific (next morning) gives enough buffer.

on:
  # Cron restored 2026-07 (P0.4) with budget rails threaded (P0.0):
  # lock/cap hits exit 0 as graceful skips (post_meeting_recap.py main
  # handler), so a locked run stays green while the missing recap is
  # surfaced by liveness expectations instead of a red workflow.
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      meeting_date:
        description: 'Override: specific meeting date (YYYY-MM-DD)'
        required: false
        type: string
      video_id:
        description: 'Override: specific YouTube video ID (skips discovery â€” use when KCRT live-stream title lacks a parseable date)'
        required: false
        type: string
      force:
        description: 'Regenerate existing recaps'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # â”€â”€ Gate: did a meeting happen yesterday? â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  check-meeting:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      meeting_date: ${{ steps.check.outputs.meeting_date }}
      has_meeting: ${{ steps.check.outputs.has_meeting }}

    steps:
      - name: Check for yesterday's meeting
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_MEETING_DATE: ${{ github.event.inputs.meeting_date || '' }}
        run: |
          set -euo pipefail
          # Manual override bypasses the gate
          OVERRIDE="$INPUT_MEETING_DATE"
          if [ -n "$OVERRIDE" ]; then
            if ! [[ "$OVERRIDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
               [ "$(date -u -d "$OVERRIDE" +%F 2>/dev/null || true)" != "$OVERRIDE" ]; then
              echo "::error::meeting_date must be a real date in YYYY-MM-DD form"
              exit 1
            fi
            echo "meeting_date=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "has_meeting=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: $OVERRIDE"
            exit 0
          fi

          # Query Supabase REST API for yesterday's regular meeting
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "Checking for meeting on $YESTERDAY..."

          RESPONSE=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/meetings?meeting_date=eq.${YESTERDAY}&meeting_type=eq.regular&city_fips=eq.0660620&select=meeting_date" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          if echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); exit(0 if data else 1)" 2>/dev/null; then
            echo "meeting_date=$YESTERDAY" >> "$GITHUB_OUTPUT"
            echo "has_meeting=true" >> "$GITHUB_OUTPUT"
            echo "Meeting found: $YESTERDAY"
          else
            echo "has_meeting=false" >> "$GITHUB_OUTPUT"
            echo "No meeting on $YESTERDAY â€” done"
          fi

  # â”€â”€ Pipeline: transcript fetch + recap generation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  recap:
    needs: check-meeting
    if: github.ref == 'refs/heads/main' && needs.check-meeting.outputs.has_meeting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt yt-dlp

      # YouTube's "n parameter" anti-bot challenge requires a JavaScript
      # runtime to solve. yt-dlp auto-detects Deno when present and uses
      # it to compute the signature. Without this, even authenticated
      # subtitle fetches fail with "n challenge solving failed."
      - name: Install Deno (yt-dlp JS runtime for n-challenge)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write YouTube cookies (auth bypasses GitHub Actions IP rate limits)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            mkdir -p "$RUNNER_TEMP/yt"
            printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/yt/cookies.txt"
            chmod 600 "$RUNNER_TEMP/yt/cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/yt/cookies.txt" >> "$GITHUB_ENV"
            echo "Wrote cookies file ($(wc -l < "$RUNNER_TEMP/yt/cookies.txt") lines)"
          else
            echo "YOUTUBE_COOKIES secret not set; transcript fetch will be anonymous (likely to fail on GitHub runners)"
          fi

      - name: Run post-meeting recap pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          RECAP_MEETING_DATE: ${{ needs.check-meeting.outputs.meeting_date }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
          INPUT_VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          # YOUTUBE_COOKIES_FILE is set by the previous step via GITHUB_ENV
        run: |
          set -euo pipefail
          cd src

          if ! [[ "$RECAP_MEETING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::resolved meeting date is invalid"
            exit 1
          fi
          ARGS=(--meeting-date "$RECAP_MEETING_DATE")
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          elif [ "$INPUT_FORCE" != "false" ]; then
            echo "::error::force must be true or false"
            exit 1
          fi
          if [ -n "$INPUT_VIDEO_ID" ]; then
            if ! [[ "$INPUT_VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
              echo "::error::video_id must be an 11-character YouTube ID"
              exit 1
            fi
            ARGS+=(--video-id "$INPUT_VIDEO_ID")
          fi

          echo "=== Post-meeting recap for $RECAP_MEETING_DATE ==="

          # Full pipeline: transcript fetch (needs cookies or proxy) + speaker counts + recaps
          python post_meeting_recap.py "${ARGS[@]}"

          echo "=== Done ==="

      - name: Cleanup cookies file
        if: always()
        run: rm -f "$RUNNER_TEMP/yt/cookies.txt" 2>/dev/null || true
