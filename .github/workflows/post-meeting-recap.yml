name: Post-Meeting Recap

# Runs daily. Queries the DB for yesterday's meeting â€” only runs
# the pipeline when a regular council meeting actually happened.
# Costs nothing on non-meeting days (one REST call, exits in <1s).
#
# KCRT/YouTube is attempted first. If its recording or captions are not
# available, the pipeline falls back to the City's official Granicus
# transcript. A meeting-day run fails (and triggers the actionable failure
# wrapper) if neither source leaves a transcript recap in the database.

on:
  # Cron restored 2026-07 (P0.4) with budget rails threaded (P0.0):
  # lock/cap hits exit 0 as graceful skips (post_meeting_recap.py main
  # handler), so a locked run stays green while the missing recap is
  # surfaced by liveness expectations instead of a red workflow.
  schedule:
    - cron: '17 15 * * *'
  # Typed manual requests execute the trusted default-branch workflow and may
  # target only one date/video. Forced regeneration is intentionally absent.
  repository_dispatch:
    types: [operator-post-meeting-recap]

permissions:
  contents: read

jobs:
  # â”€â”€ Gate: did a meeting happen yesterday? â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  check-meeting:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'operator-post-meeting-recap' &&
        github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      meeting_date: ${{ steps.check.outputs.meeting_date }}
      has_meeting: ${{ steps.check.outputs.has_meeting }}

    steps:
      - name: Validate the bounded recap request before secrets
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e '
            type == "object" and
            ((keys - ["meeting_date", "video_id"]) | length == 0) and
            (.meeting_date == null or (.meeting_date | type == "string")) and
            (.video_id == null or (.video_id | type == "string"))
          ' <<<"$CLIENT_PAYLOAD" > /dev/null; then
            echo "::error::ACTION: Do not retry or force a recap. Give this run URL to a coding assistant and ask it to send only one optional meeting_date and one optional video_id in a new operator-post-meeting-recap event."
            exit 1
          fi

          if jq -e 'has("meeting_date") and .meeting_date != null' \
              <<<"$CLIENT_PAYLOAD" > /dev/null; then
            MEETING_DATE=$(jq -r '.meeting_date' <<<"$CLIENT_PAYLOAD")
            if ! [[ "$MEETING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
               [ "$(date -u -d "$MEETING_DATE" +%F 2>/dev/null || true)" != "$MEETING_DATE" ]; then
              echo "::error::ACTION: Do not retry this recap. Send a real meeting_date in YYYY-MM-DD form, or omit meeting_date from the typed event."
              exit 1
            fi
          fi

          if jq -e 'has("video_id") and .video_id != null' \
              <<<"$CLIENT_PAYLOAD" > /dev/null; then
            VIDEO_ID=$(jq -r '.video_id' <<<"$CLIENT_PAYLOAD")
            if ! [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
              echo "::error::ACTION: Do not retry this recap. Send only the 11-character YouTube video ID, without a URL, or omit video_id from the typed event."
              exit 1
            fi
          fi

      - name: Check for yesterday's meeting
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_MEETING_DATE: ${{ github.event.client_payload.meeting_date || '' }}
        run: |
          set -euo pipefail
          # A validated typed override bypasses the yesterday gate.
          OVERRIDE="$INPUT_MEETING_DATE"
          if [ -n "$OVERRIDE" ]; then
            if ! [[ "$OVERRIDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
               [ "$(date -u -d "$OVERRIDE" +%F 2>/dev/null || true)" != "$OVERRIDE" ]; then
              echo "::error::ACTION: Do not retry this recap. Send a real meeting_date in YYYY-MM-DD form, or omit it to check yesterday."
              exit 1
            fi
            echo "meeting_date=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "has_meeting=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: $OVERRIDE"
            exit 0
          fi

          # Query Supabase REST API for yesterday's regular meeting
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "Checking for meeting on $YESTERDAY..."

          RESPONSE=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/meetings?meeting_date=eq.${YESTERDAY}&meeting_type=eq.regular&city_fips=eq.0660620&select=meeting_date" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          if echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); exit(0 if data else 1)" 2>/dev/null; then
            echo "meeting_date=$YESTERDAY" >> "$GITHUB_OUTPUT"
            echo "has_meeting=true" >> "$GITHUB_OUTPUT"
            echo "Meeting found: $YESTERDAY"
          else
            echo "has_meeting=false" >> "$GITHUB_OUTPUT"
            echo "No meeting on $YESTERDAY â€” done"
          fi

  # â”€â”€ Pipeline: transcript fetch + recap generation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  recap:
    needs: check-meeting
    if: github.ref == 'refs/heads/main' && needs.check-meeting.outputs.has_meeting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt yt-dlp

      # YouTube's "n parameter" anti-bot challenge requires a JavaScript
      # runtime to solve. yt-dlp auto-detects Deno when present and uses
      # it to compute the signature. Without this, even authenticated
      # subtitle fetches fail with "n challenge solving failed."
      - name: Install Deno (yt-dlp JS runtime for n-challenge)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write YouTube cookies (auth bypasses GitHub Actions IP rate limits)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            mkdir -p "$RUNNER_TEMP/yt"
            printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/yt/cookies.txt"
            chmod 600 "$RUNNER_TEMP/yt/cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/yt/cookies.txt" >> "$GITHUB_ENV"
            echo "Wrote cookies file ($(wc -l < "$RUNNER_TEMP/yt/cookies.txt") lines)"
          else
            echo "YOUTUBE_COOKIES secret not set; transcript fetch will be anonymous (likely to fail on GitHub runners)"
          fi

      - name: Run post-meeting recap pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          RECAP_MEETING_DATE: ${{ needs.check-meeting.outputs.meeting_date }}
          INPUT_VIDEO_ID: ${{ github.event.client_payload.video_id || '' }}
          # YOUTUBE_COOKIES_FILE is set by the previous step via GITHUB_ENV
        run: |
          set -euo pipefail
          cd src

          if ! [[ "$RECAP_MEETING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::ACTION: Do not retry or edit production data. Give this run URL to a coding assistant and ask it to diagnose the invalid resolved meeting date."
            exit 1
          fi
          ARGS=(--meeting-date "$RECAP_MEETING_DATE")
          if [ -n "$INPUT_VIDEO_ID" ]; then
            if ! [[ "$INPUT_VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
              echo "::error::ACTION: Do not retry this recap. Send only the 11-character YouTube video ID, without a URL, or omit video_id for discovery."
              exit 1
            fi
            ARGS+=(--video-id "$INPUT_VIDEO_ID")
          fi

          echo "=== Post-meeting recap for $RECAP_MEETING_DATE ==="

          # Full pipeline: KCRT/YouTube first, official Granicus fallback,
          # speaker counts, and recaps. The command exits nonzero if the final
          # transcript recap is still absent, so green cannot mean a no-op.
          python post_meeting_recap.py "${ARGS[@]}"

          echo "=== Done ==="

      - name: Cleanup cookies file
        if: always()
        run: rm -f "$RUNNER_TEMP/yt/cookies.txt" 2>/dev/null || true
