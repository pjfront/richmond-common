name: Data Quality Checks

on:
  # Crons restored 2026-07 (P0.4) with budget rails threaded (P0.0).
  schedule:
    - cron: '0 7 * * *'    # daily quality checks
    - cron: '0 12 * * 5'   # Friday deep pass
  workflow_dispatch:
    inputs:
      city_fips:
        description: 'City FIPS code (default: Richmond CA)'
        required: false
        default: '0660620'
        type: string
      create_decisions:
        description: 'Create decision queue entries for issues found'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality-checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RICHMOND_API_MONTHLY_CAP_USD: ${{ vars.RICHMOND_API_MONTHLY_CAP_USD || '5.00' }}
      RICHMOND_API_BUDGET_LOCK: ${{ vars.RICHMOND_API_BUDGET_LOCK || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data quality checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_CITY_FIPS: ${{ github.event.inputs.city_fips || '0660620' }}
          INPUT_CREATE_DECISIONS: ${{ github.event.inputs.create_decisions || 'false' }}
        run: |
          set -euo pipefail
          cd src
          if [ "$INPUT_CITY_FIPS" != "0660620" ]; then
            echo "::error::Richmond Commons only accepts city_fips=0660620"
            exit 1
          fi
          ARGS=(--city-fips "$INPUT_CITY_FIPS" --check --known-issues confidence_tier_desync)
          if [ "$INPUT_CREATE_DECISIONS" = "true" ]; then
            ARGS+=(--create-decisions)
          elif [ "$INPUT_CREATE_DECISIONS" != "false" ]; then
            echo "::error::create_decisions must be true or false"
            exit 1
          fi
          python data_quality_checks.py "${ARGS[@]}"

      - name: Upload quality report
        if: always()
        run: |
          set -euo pipefail
          cd src
          FIPS="$INPUT_CITY_FIPS"
          if [ "$FIPS" != "0660620" ]; then
            echo "::error::Richmond Commons only accepts city_fips=0660620"
            exit 1
          fi
          python data_quality_checks.py \
            --city-fips "$FIPS" \
            --format json > /tmp/quality-report.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_CITY_FIPS: ${{ github.event.inputs.city_fips || '0660620' }}

      - name: Self-assessment
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          cd src
          # Weekly Friday run uses 7-day lookback for trend detection
          if [ "$EVENT_SCHEDULE" = "0 12 * * 5" ]; then
            DAYS=7
          else
            DAYS=1
          fi
          python self_assessment.py --days $DAYS --create-decisions

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-report-${{ github.run_id }}
          path: /tmp/quality-report.json
          retention-days: 30
