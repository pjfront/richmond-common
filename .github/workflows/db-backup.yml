name: DB Backup

# Weekly encrypted logical backup of the live Supabase Postgres.
#
# WHY THIS EXISTS (2026-07-05): the encrypted logical copy remains useful
# defense in depth alongside Supabase Pro backups. The database contains years
# of scraped meetings, contributions, comments, and paid-for enrichments.
#
# WHY ENCRYPTED: this repo is public, and Actions artifacts on public
# repos are downloadable by anyone. The dump contains email_subscribers
# (PII). Every artifact is AES-256 encrypted with the DB_BACKUP_PASSPHRASE
# secret (mirrored in the operator's local .env) before upload.
#
# RESTORE:
#   gh run download <run-id> -n db-backup-<date>
#   openssl enc -d -aes-256-cbc -pbkdf2 -in richmond.dump.enc \
#     -out richmond.dump -pass env:DB_BACKUP_PASSPHRASE
#   pg_restore --clean --if-exists -d "$DATABASE_URL" richmond.dump
#
# Retention: 4 rolling weekly artifacts (28-day retention, weekly cron).

on:
  schedule:
    - cron: '0 9 * * 0'   # Sundays 09:00 UTC
  repository_dispatch:
    types: [operator-db-backup]

permissions:
  contents: read

jobs:
  backup:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'operator-db-backup' &&
        github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate the empty backup request before secrets
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object" and length == 0' \
              <<<"$CLIENT_PAYLOAD" > /dev/null; then
            echo "::error::ACTION: Do not retry this backup. Give this run URL to a coding assistant and ask it to remove every unexpected operator-db-backup payload field before sending a new typed event."
            exit 1
          fi

      - name: Install postgres client (v17 — must match server major version)
        run: |
          # ubuntu-latest ships postgresql-client 16; the Supabase server
          # is Postgres 17 and pg_dump aborts on major-version mismatch.
          # PG17 packages come from the PGDG repo, which must be added
          # explicitly (run 28744407494 proved it is NOT preconfigured).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Ubuntu's /usr/bin/pg_dump wrapper kept resolving to the
          # preinstalled v16 (run 28744467441) — use the versioned
          # binary path directly and never trust the wrapper.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database (custom format, compressed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            --format=custom --compress=9 --no-owner --no-privileges \
            --file=richmond.dump "$DATABASE_URL"
          ls -lh richmond.dump

      - name: Encrypt dump
        env:
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_BACKUP_PASSPHRASE" ]; then
            echo "::error::ACTION: Do not retry or upload any dump. Ask a coding assistant to verify DB_BACKUP_PASSPHRASE in repository Actions settings without displaying it."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in richmond.dump -out richmond.dump.enc \
            -pass env:DB_BACKUP_PASSPHRASE
          rm richmond.dump
          ls -lh richmond.dump.enc

      - name: Verify round-trip decryption
        env:
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in richmond.dump.enc -out /tmp/verify.dump \
            -pass env:DB_BACKUP_PASSPHRASE
          /usr/lib/postgresql/17/bin/pg_restore --list /tmp/verify.dump > /tmp/toc.txt
          TABLES=$(grep -c "TABLE DATA" /tmp/toc.txt || true)
          echo "Backup contains $TABLES table-data sections"
          if [ "$TABLES" -lt 30 ]; then
            echo "::error::ACTION: Do not use or restore this backup. Give this run URL to a coding assistant and ask it to diagnose why only $TABLES table-data sections were captured."
            exit 1
          fi
          rm /tmp/verify.dump

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: richmond.dump.enc
          retention-days: 28
          if-no-files-found: error
