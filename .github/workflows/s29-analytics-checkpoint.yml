name: S29 analytics checkpoint

run-name: S29 analytics checkpoint — ${{ github.event.action || github.event_name }}

on:
  repository_dispatch:
    types: [operator-s29-analytics-checkpoint]

permissions:
  contents: read

concurrency:
  group: s29-analytics-checkpoint
  cancel-in-progress: false

jobs:
  capture-and-email:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'operator-s29-analytics-checkpoint' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the single checkpoint before secrets
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if ! jq -e '
            type == "object" and
            (keys == ["checkpoint"]) and
            (.checkpoint == "B7" or .checkpoint == "B14" or
             .checkpoint == "T7" or .checkpoint == "T14")
          ' <<<"$CLIENT_PAYLOAD" > /dev/null; then
            echo "::error::ACTION: Do not retry this checkpoint. Send exactly one checkpoint value—B7, B14, T7, or T14—or give this run URL to a coding assistant."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Capture aggregate-only packet
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          CHECKPOINT: ${{ github.event.client_payload.checkpoint }}
        run: python src/s29_vercel_analytics.py --checkpoint "$CHECKPOINT"

      - name: Email private packet once
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          CHECKPOINT: ${{ github.event.client_payload.checkpoint }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${OPERATOR_EMAIL:-}" ]; then
            echo "::error::ACTION: Do not retry this checkpoint. Ask a coding assistant to verify RESEND_API_KEY and OPERATOR_EMAIL in repository Actions settings without displaying either value."
            exit 1
          fi
          PACKET="src/data/analytics_checkpoints/s29-$(printf '%s' "$CHECKPOINT" | tr '[:upper:]' '[:lower:]').json"
          if [ ! -f "$PACKET" ]; then
            echo "::error::ACTION: Do not retry this checkpoint. Give this run URL to a coding assistant and ask it to diagnose why the bounded aggregate packet was not created."
            exit 1
          fi
          REQUEST_FILE="$(mktemp)"
          RESPONSE_FILE="$(mktemp)"
          BASE64_FILE="$(mktemp)"
          trap 'rm -f "$REQUEST_FILE" "$RESPONSE_FILE" "$BASE64_FILE"' EXIT
          base64 -w 0 "$PACKET" > "$BASE64_FILE"
          case "$CHECKPOINT" in
            B7|T7)
              PRIMARY_ACTION="Open Codex or ChatGPT, paste the message below, attach the JSON file, and ask it to verify this checkpoint. Do not rerun unless the attachment is missing from both your inbox and the Resend log."
              ;;
            B14)
              PRIMARY_ACTION="Open Codex or ChatGPT, paste the message below, and attach the JSON file. Ask it to join the required private Supabase/manual fields and prepare the complete baseline-freeze packet. Do not freeze the baseline from this attachment alone."
              ;;
            T14)
              PRIMARY_ACTION="Open Codex or ChatGPT, paste the message below, and attach the JSON file. Ask it to prepare the final treatment and donation go/no-go packet plus a separate July recap decision. Do not launch a donation ask or repair the July recaps until you approve that packet."
              ;;
            *)
              echo "::error::ACTION: Do not retry this checkpoint. Give this run URL to a coding assistant and ask it to restore the B7/B14/T7/T14 allowlist."
              exit 1
              ;;
          esac
          if [ "$CHECKPOINT" = "T14" ]; then
            JULY_RECAP_STATUS="Decision due in this checkpoint: choose whether to keep the exact July 7, July 21, and July 28 recap cohort blank or authorize a new, separately bounded, source-reviewed repair. This reminder does not authorize repair or publication."
          else
            JULY_RECAP_STATUS="No action before T14. Keep the exact July 7, July 21, and July 28 recap cohort blank."
          fi
          NOTICE=$(cat <<EOF
          ACTION: $PRIMARY_ACTION

          JULY RECAP STATUS
          $JULY_RECAP_STATUS

          COPY/PASTE MESSAGE FOR YOUR CODING ASSISTANT
          ============================================

          You are reviewing Richmond Commons (https://richmondcommons.org), a civic transparency website for Richmond, California. Its repository is https://github.com/pjfront/richmond-common. Review the attached S29 $CHECKPOINT aggregate-only analytics packet against docs/plans/2026-08-15-s29-analytics-baseline-release-runbook.md. The Vercel attachment alone is not a complete B14/T14 freeze packet: identify and safely join every required private Supabase/manual field before declaring it complete. At T14, return the evidence-based treatment result and a separate donation go/no-go recommendation; do not launch anything. Also ask the operator to decide whether the exact July 7, July 21, and July 28 recap cohort should remain blank or receive a new, separately bounded, source-reviewed repair; the checkpoint itself does not authorize repair or publication. Before T14, the July recap cohort requires no operator action and must remain blank. Preserve Supabase Pro, DeepSeek-first with only the two benchmarked Luna exceptions, AGPL, D2=0.50, migration 136 live, and migration 134 as a HARD NO-GO. Do not change production data, start an unbounded sync, expand S26/S28, publish, or increase cost. Explain the result in plain language and end with one clear ACTION: line stating exactly what the operator must do, or ACTION: None.
          EOF
          )
          jq -n \
            --arg from "Richmond Commons Alerts <updates@richmondcommons.org>" \
            --arg to "$OPERATOR_EMAIL" \
            --arg subject "[Richmond Commons] ACTION — review S29 $CHECKPOINT checkpoint" \
            --arg text "$NOTICE" \
            --rawfile content "$BASE64_FILE" \
            --arg filename "s29-$CHECKPOINT-aggregate.json" \
            '{from:$from,to:[$to],subject:$subject,text:$text,attachments:[{content:$content,filename:$filename}]}' \
            > "$REQUEST_FILE"
          curl --fail -sS --connect-timeout 10 --max-time 30 \
            https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "@$REQUEST_FILE" --output "$RESPONSE_FILE"
          jq -e '.id | type == "string" and length > 0' "$RESPONSE_FILE" > /dev/null
          echo "Resend accepted the private S29 aggregate packet; verify inbox delivery."
