# Alerting suppression list (P1.1a).
#
# Read by src/alerting.py. A suppressed expectation still runs and still
# shows in the digest body (marked [suppressed]) — suppression only keeps it
# out of the "NEEDS ATTENTION" alert block and the GitHub-issue trail, so a
# known failure doesn't cry wolf every morning.
#
# RULES (the June 2026 freeze was open-ended silence — never rebuild it):
#   - `expires` is REQUIRED. An entry without one is treated as expired.
#   - When a suppression expires and the expectation is STILL failing, the
#     alerting escalates it ("suppression expired") — renew consciously with
#     a new expiry + reason, or fix the underlying item.
#   - Remove entries when the expectation goes green (P2.4 drives this list
#     to zero).
#
# Seeded 2026-07-05 from the live known-failing set.

