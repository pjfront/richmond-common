# Operator Review Queue
#
# Every <OperatorGate> in web/src/ must have an entry here. The
# tests/test_operator_review_queue.py test enforces this — adding a new
# <OperatorGate> without registering it fails CI, and deleting an
# <OperatorGate> without removing the entry also fails (so the registry
# stays honest).
#
# Two categories:
#
#   - permanent: operator-only by design (operator workflow tooling,
#     operational dashboards, internal methodology). These never
#     graduate to public. Listed here so the registry is complete, not
#     because they need review.
#
#   - pending_graduation: gated because the underlying data or framing
#     hasn't been validated for public consumption. These should EITHER
#     graduate to public after the operator reviews the listed
#     `what_to_validate` checklist, OR be re-categorized to permanent if
#     review reveals they should stay operator-only. The queue should
#     shrink over time as items resolve. SessionStart brief surfaces the
#     oldest entries so they can't be forgotten.
#
# When wrapping a new <OperatorGate>:
#   1. Add an entry here in the same commit.
#   2. If pending_graduation, write a concrete `what_to_validate`
#      checklist (3-5 lines, what to click/check) so future-you (or
#      another session) knows what "ready to graduate" actually means.
#   3. Set gated_at to today's date.
#
# When graduating to public:
#   1. Remove the OperatorGate wrap from the file.
#   2. Delete the entry here in the same commit.
#   3. The test will fail if you forget either step.

gates:

