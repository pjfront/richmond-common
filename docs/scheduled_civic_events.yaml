recurring_events:
  - id: form-700-annual-review
    rule:
      frequency: annual
      month: 4
      day: 1
    lead_days: 30
    owner: ai
    response_mode: llm
    source_url: https://www.richmondca.gov/1439/Form-700---Statement-of-Economic-Interes
    action: >
      Copy the LLM handoff below into Codex or ChatGPT. Ask it to verify the
      current year's annual Form 700 deadline at the official Richmond source,
      then run a bounded read-only Form 700 freshness check for Richmond,
      California. Treat April 1 as a review reminder, not a filing conclusion;
      do not correct production data or publish a missing-filing claim.

  - id: form-460-january-semiannual-review
    rule:
      frequency: annual
      month: 1
      day: 31
      overrides:
        "2026": 2026-02-02
        "2027": 2027-02-01
    lead_days: 30
    owner: ai
    response_mode: llm
    source_url: https://www.richmondca.gov/1440/Campaign-Reports
    action: >
      Copy the LLM handoff below into Codex or ChatGPT. Ask it to verify the
      current January semiannual Form 460 deadline at Richmond's official
      campaign-reports source, then run a bounded read-only NetFile
      filing-freshness check. The calendar uses January 31 nominally and only
      the listed verified overrides; do not invent holiday logic, run an
      unbounded sync, correct production data, or publish a missing-filing claim.

  - id: form-460-july-semiannual-review
    rule:
