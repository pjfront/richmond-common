# Civic + infrastructure calendar as data (consumed by P1.1a alerting).
#
# Read by src/alerting.py every daily run. An entry sends bounded reminders at
# its lead day and selected 14/7/3/1/0-day milestones, then at selected overdue
# milestones. The alerting layer also checks that the calendar reaches at least
# 90 days into the future.
#
# One-off fields:
#   id            — stable lowercase slug (dedup key for issues/emails)
#   due_date      — YYYY-MM-DD
#   window_start  — optional YYYY-MM-DD start for a bounded monitoring window
#   completed_on  — optional YYYY-MM-DD; retained for audit history only
#
# Recurring fields:
#   rule.frequency — only "annual" is supported (this is intentionally not RRULE)
#   rule.month/day — nominal annual reminder date
#   rule.overrides — optional YYYY: YYYY-MM-DD map for verified annual exceptions
#
# Shared active-item fields (validated fail-closed by src/alerting.py):
#   lead_days     — first reminder this many days before the date
#   owner         — operator | ai
#   response_mode — direct | decision | llm
#   source_url    — HTTPS source used to verify the date
#   action        — exact operator action; technical items use a copy-ready handoff
#
# Recurrence expansion is finite: occurrences at most 30 days overdue and dates
# through the next two calendar years are considered (four per series maximum).
# Occurrence IDs are stable as <id>--<year>.
# Dates remain nominal unless an explicit, source-verified override is present;
# the code does not guess weekend or holiday adjustments.

