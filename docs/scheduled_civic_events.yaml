# Civic + infrastructure calendar as data (P1.2 seed, consumed by P1.1a alerting).
#
# Read by src/alerting.py every daily run. An entry sends bounded reminders at
# its lead day and selected 14/7/3/1/0-day milestones, then at selected overdue
# milestones rather than every day. The alerting layer also runs a weekly or
# monthly horizon meta-check: if the farthest future due_date is
# < 90 days away, that itself is an alert — an empty calendar must not look
# like nothing is due.
#
# Fields:
#   id        — stable slug (dedup key for issues/emails)
#   due_date  — YYYY-MM-DD
#   lead_days — first reminder this many days before due_date
#   owner     — operator | ai
#   response_mode — direct | decision | llm; controls the action/help format
#   action    — exactly what to do, with the command/URL inline
#   completed_on — optional YYYY-MM-DD; retained for audit history but no
#                  longer active for alerting or calendar-horizon checks
#
# This is the P1.2 *seed*, not the full item: recurring rules (Form 460/700
# windows), remaining infra expiries (API_SECRET, YOUTUBE_COOKIES,
# SUPABASE_ACCESS_TOKEN, Resend DNS, registrar/payment-card), and the
# behavioral PAT check are still open under P1.2.

events:
  - id: aug1-cap-revert
    due_date: 2026-08-01
    lead_days: 3
    owner: operator
    completed_on: 2026-08-08
    action: >
      Completed: RICHMOND_API_MONTHLY_CAP_USD is 5.00 in
      pjfront/richmond-common (verified 2026-08-08). Plan P0.1/OD-13;
      July ran at $20.

  - id: oct1-donation-gate-b
    due_date: 2026-10-01
    lead_days: 21
    owner: operator
    response_mode: direct
    completed_on: 2026-08-23
    action: >
      Do not launch the donation ask on October 1. Keep it held through the
      actual S29 T14 checkpoint; the T14 email will request a separate
      evidence-based go/no-go decision.

  - id: nov-2026-election-prep
    due_date: 2026-10-20
    lead_days: 14
    owner: ai
    response_mode: llm
    action: >
      Copy the LLM handoff in the alert into Codex or ChatGPT and ask it to
      run the bounded November election-readiness check. Approve no public
      claim until it cites the official source it verified.

  - id: dispatch-token-rotation
    due_date: 2027-03-20
    lead_days: 30
    owner: operator
    response_mode: llm
    action: >
      Copy the LLM handoff in the alert into Codex or ChatGPT and ask it to
      verify whether DISPATCH_TOKEN is still used before rotating anything.
      If it is used, request click-by-click GitHub token-rotation instructions.
