# D1 Provenance Manifest
#
# CLAUDE.md design principle D1 states: every API response that serves the UI
# includes source_url, extracted_at, source_tier, and confidence_score. These
# are non-nullable at the schema level.
#
# Reality, audited 2026-05-11: ~11 of 103 migrations declare any subset of
# these columns; almost never NOT NULL. The principle is performative.
#
# This manifest closes the gap going forward. Every table that web/src/lib/
# queries.ts reads from must appear here with one of three statuses:
#
#   compliant     — all four columns declared NOT NULL. Verified by
#                   tests/test_d1_provenance.py.
#   grandfathered — pre-existing table without full quartet. Recorded here
#                   so the gap is visible. Backfill is Phase 4.x work; do
#                   not block on it. New tables MAY NOT be added as
#                   grandfathered — they must ship compliant or exempt.
#   exempt        — the table is structurally not D1 data (aggregate views,
#                   user-input tables like community_comments, junction
#                   tables, materialized views, RPC outputs). Reason must
#                   be documented.
#
# Enforcement (tests/test_d1_provenance.py):
#   1. The set of tables referenced from web/src/lib/queries.ts must equal
#      the set in this manifest. New table in queries.ts → add it here or
#      the test fails. This is the gate that catches "we just shipped a new
#      public table without thinking about provenance."
#   2. compliant tables must actually have all four columns NOT NULL in
#      the latest migration that defines them. Drift fails the test.
#   3. grandfathered tables are reported as known debt; the test does not
#      enforce against them. The list shrinks over time as backfills land.
#
# Updating this file is AI-delegable. Promoting a grandfathered table to
# compliant is AI-delegable once the backfill migration ships. Adding a
# new entry is required when adding a public-facing table.

tables:
