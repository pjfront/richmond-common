    "PAC independent expenditures":
      query: getPACIndependentExpenditures
      column: "independent_expenditures rows where committee_name matches this PAC (support/oppose, candidate, payee, amount, date)"
      sources: [calaccess]
      note: "Exact case-insensitive name match. Drops the earlier fuzzy-prefix pass (4f51f33) that double-counted IE rows across sister committees sharing a prefix."

  # ── /orgs redirect — I164 (2026-07-08) ────────────────────────

  "/orgs":
