    api_routes: ["/api/operator/sync-health"]

  "/operator/settings":
    description: "Operator UI — configure AI scoring parameters (publication tiers, evidence weights, thresholds)"
    queries: []
    api_routes: ["/api/operator/settings"]


# ══════════════════════════════════════════════════════════════
# SCHEDULES — Cloud workflows and their triggers
# ══════════════════════════════════════════════════════════════

schedules:
  cloud-pipeline.yml:
    description: "Full meeting pipeline: scrape → scan → comment → generate"
    triggers:
      - type: cron
        schedule: "0 6 * * 1"  # Monday 6am UTC (Sunday 10pm Pacific)
        description: "Weekly pre-meeting pipeline"
      - type: cron
        schedule: "0 8 1 1,4,7,10 *"  # Quarterly
        description: "Quarterly retrospective scan"
      - type: repository_dispatch
        description: "n8n webhook trigger"
      - type: workflow_dispatch
        description: "Manual trigger"
    sources_triggered: [escribemeetings]
    enrichments_triggered: [conflict_scanning, comment_generation,
                            summary_generation, vote_explainer_generation]

  data-sync.yml:
    description: "Scheduled data source syncs (4-tier cadence)"
    triggers:
      - type: cron
        schedule: "0 7 * * *"  # Daily 7am UTC
        description: "Daily: nextrequest (CPRA compliance), escribemeetings, escribemeetings_minutes, minutes_extraction (with --enrich cascade)"
      - type: cron
        schedule: "0 8 * * 1"  # Monday 8am UTC
        description: "Weekly: archive_center, minutes_extraction, escribemeetings, escribemeetings_minutes, netfile, socrata_expenditures, socrata_payroll"
      - type: cron
        schedule: "0 9 15 * *"  # 15th of month 9am UTC
        description: "Monthly: calaccess, socrata_permits, socrata_licenses, socrata_code_cases, socrata_service_requests, socrata_projects"
      - type: cron
        schedule: "0 10 1 1,4,7,10 *"  # Quarterly 10am UTC
        description: "Quarterly: form700, form803_behested, lobbyist_registrations, propublica"
      - type: repository_dispatch
        description: "n8n webhook trigger"
      - type: workflow_dispatch
        description: "Manual single-source sync (all 17 sources)"
    sources_triggered: [netfile, calaccess, escribemeetings, escribemeetings_minutes,
                        nextrequest, archive_center, minutes_extraction, form700,
                        form803_behested, lobbyist_registrations, propublica,
                        socrata_payroll, socrata_expenditures, socrata_permits,
                        socrata_licenses, socrata_code_cases,
                        socrata_service_requests, socrata_projects]

  change-detector.yml:
    description: "Near-live source change detection (15-min polling)"
    triggers:
      - type: cron
        schedule: "3,18,33,48 * * * *"  # Every 15 minutes
        description: "Poll external sources for changes"
      - type: workflow_dispatch
        description: "Manual trigger (supports --source and --dry-run)"
    sources_triggered: [escribemeetings, netfile, socrata_expenditures, socrata_payroll,
                        socrata_permits, socrata_licenses, socrata_code_cases,
                        socrata_service_requests, socrata_projects,
                        nextrequest, calaccess]
    enrichments_triggered: [topic_tagging, summary_generation, conflict_scanning,
                            meeting_summary_generation, orientation_generation,
                            recap_generation, vote_explainer_generation, theme_extraction,
                            embedding_generation, proceeding_classification]
    notes: "Dispatches to data-sync.yml with enrich=true when changes detected. Stdlib-only Python, no pip install."

  data-quality.yml:
    description: "Data quality checks"
    triggers:
      - type: cron
        schedule: "0 7 * * *"  # Daily 7am UTC
        description: "Daily quality check"
      - type: cron
        schedule: "0 12 * * 5"  # Friday noon UTC
        description: "Weekly deep quality check"
      - type: workflow_dispatch
        description: "Manual trigger"
    sources_triggered: []
    enrichments_triggered: []

  self-assessment.yml:
    description: "System health and self-assessment"
    triggers:
      - type: cron
        schedule: "0 7 * * *"  # Daily 7am UTC
        description: "Daily health check"
      - type: cron
        schedule: "0 12 * * 5"  # Friday noon UTC
        description: "Weekly deep assessment"
      - type: workflow_dispatch
        description: "Manual trigger"
    sources_triggered: []
    enrichments_triggered: []

  test.yml:
    description: "Pytest CI on pull requests"
    triggers:
      - type: pull_request
        description: "Runs on PR to main"
    sources_triggered: []
    enrichments_triggered: []


# ══════════════════════════════════════════════════════════════
# N8N WORKFLOWS — External orchestration schedules
# ══════════════════════════════════════════════════════════════

n8n_workflows:
  weekly_sync:
    schedule: "Sunday 10pm Pacific"
    dispatches: data-sync.yml
    sources: [netfile, calaccess, escribemeetings, escribemeetings_minutes]

  monthly_calaccess:
    schedule: "1st Monday of month"
    dispatches: data-sync.yml
    sources: [calaccess]

  pre_meeting_pipeline:
    schedule: "Monday 6am UTC"
    dispatches: cloud-pipeline.yml
    sources: [escribemeetings]

  post_sync_retrospective:
    schedule: "After weekly_sync completes"
    dispatches: cloud-pipeline.yml
    mode: retrospective


# ══════════════════════════════════════════════════════════════
# RPCS — Supabase server-side SQL functions
# ══════════════════════════════════════════════════════════════

rpcs:
  get_meeting_counts:
    migration: "038"
    reads_from: [meetings, agenda_items, motions, votes]
    returns: "{meeting_id, agenda_item_count, vote_count, categories[]}"
    used_by_queries: [getMeetingsWithCounts, getCommissionMeetings]

  get_category_stats:
    migration: "085"
    reads_from: [agenda_items, motions, votes]
    returns: "{category, item_count, vote_count, split_vote_count, unanimous_vote_count, avg_controversy_score, total_public_comments, percentage_of_agenda}"
    used_by_queries: [getCategoryStats]
    notes: "Controversy weights: 85% comments, 10% vote split, 5% motions. Uses agenda_items.public_comment_count (fixed in 085)"

  get_controversial_items:
    migration: "085"
    reads_from: [agenda_items, motions, votes]
    returns: "{agenda_item_id, meeting_id, meeting_date, item_number, title, category, controversy_score, vote_tally, result, public_comment_count, motion_count}"
    used_by_queries: [getControversialItems]
    notes: "Sort: comment count DESC, vote split DESC, motions DESC. Uses agenda_items.public_comment_count (fixed in 085)"

  get_contested_votes:
    migration: "038"
    reads_from: [votes, motions, agenda_items, meetings]
    returns: "{motion_id, official_id, official_name, vote_choice, category}"
    used_by_queries: [getCoalitionData]
    notes: "Migration 103 added optional p_official_ids UUID[]. When provided, votes are pre-filtered to those officials in SQL and contestedness re-evaluated within the subset, keeping the response under PostgREST's 10K-row cap."

  get_divergent_motions_detail:
    migration: "096"
    reads_from: [votes, motions, agenda_items, meetings]
    returns: "{motion_id, motion_text, motion_result, vote_tally, meeting_id, meeting_date, agenda_item_id, agenda_item_title, agenda_item_number, category, topic_label, is_procedural, official_id, official_name, vote_choice} — per-(motion, official) rows for every contested motion. Frontend groups by motion_id."
    used_by_queries: [getDivergentMotions]
    notes: "Migration 103 added optional p_official_ids UUID[]. When provided, votes are pre-filtered to those officials in SQL and contestedness re-evaluated within the subset, keeping the response under PostgREST's 10K-row cap."

  get_meeting_coverage_stats:
    migration: "038"
    reads_from: [meetings, agenda_items, motions, votes, meeting_attendance]
    returns: "meeting coverage aggregation"
    used_by_queries: []
    used_by_api_routes: ["/api/data-quality"]

  search_site:
    migration: "039"
    reads_from: [meetings, agenda_items, officials]
    returns: "full-text search results"
    used_by_queries: [searchSite, searchHybrid]

  search_hybrid:
    migration: "077"
    reads_from: [meetings, agenda_items, officials, motions]
    returns: "hybrid FTS + vector search results via RRF"
    used_by_queries: [searchHybrid]

  find_similar_items:
    migration: "077"
    reads_from: [agenda_items, meetings, motions]
    returns: "cosine similarity nearest neighbors for agenda items"
    used_by_queries: [findSimilarItems]

  get_meeting_flag_counts:
    migration: "053"
    reads_from: [conflict_flags, agenda_items, meetings]
    returns: "{meeting_id, flags_total, flags_published, items_scanned}"
    used_by_queries: [getMeetingFlagCounts]
    notes: "Server-side aggregation to avoid 17K+ JSONB rows hitting anon's 3s timeout. Filters government-entity vendor/employer matches. See src/migrations/053_flag_count_rpc.sql."


# ══════════════════════════════════════════════════════════════
# API ROUTES — Next.js routes that bypass queries.ts
# ══════════════════════════════════════════════════════════════

api_routes:
  "/api/health":
    file: "web/src/app/api/health/route.ts"
    method: GET
    tables_read: [cities, officials, meetings, agenda_items, motions, votes,
                  contributions, documents, conflict_flags, scan_runs,
                  data_sync_log, user_feedback, nextrequest_requests,
                  nextrequest_documents, commissions, commission_members]
    description: "Migration health check — probes table existence"
    used_by_pages: ["/data-quality"]

  "/api/data-freshness":
    file: "web/src/app/api/data-freshness/route.ts"
    method: GET
    tables_read: [data_sync_log]
    description: "Per-source sync freshness"
    used_by_pages: ["/data-quality"]

  "/api/data-quality":
    file: "web/src/app/api/data-quality/route.ts"
    method: GET
    tables_read: [data_sync_log, meetings, agenda_items, motions, votes, meeting_attendance]
    rpcs_called: [get_meeting_coverage_stats]
    description: "Data quality metrics and meeting coverage stats"
    used_by_pages: ["/data-quality"]

  "/api/flag-details":
    file: "web/src/app/api/flag-details/route.ts"
    method: GET
    tables_read: [conflict_flags, meetings, agenda_items, officials, motions, votes]
    description: "Expanded conflict flag detail with vote context"
    used_by_pages: ["/reports/[meetingId]"]

  "/api/feedback":
    file: "web/src/app/api/feedback/route.ts"
    method: POST
    tables_written: [user_feedback]
    description: "Citizen feedback submission (rate-limited)"
    used_by_pages: ["*"]

  "/api/search":
    file: "web/src/app/api/search/route.ts"
    method: GET
    rpcs_called: [search_hybrid, search_site]  # Hybrid when OPENAI_API_KEY set, FTS fallback
    tables_written: [search_queries]  # Analytics logging (fire-and-forget)
    description: "Hybrid FTS + semantic search with RRF ranking"
    used_by_pages: ["/search"]

  "/api/public-records":
    file: "web/src/app/api/public-records/route.ts"
    method: GET
    description: "CPRA compliance stats (delegates to queries.ts)"
    used_by_pages: ["/public-records"]

  "/api/operator/decisions":
    file: "web/src/app/api/operator/decisions/route.ts"
    method: GET
    tables_read: [pending_decisions]
    description: "Operator decision queue (operator-only)"
    used_by_pages: ["/operator/decisions"]

  "/api/operator/sync-health":
    file: "web/src/app/api/operator/sync-health/route.ts"
    method: GET
    tables_read: [data_sync_log]
    description: "Pipeline sync health per source (operator-only)"
    used_by_pages: ["/operator/sync-health"]

  "/api/subscribe":
    file: "web/src/app/api/subscribe/route.ts"
    method: "POST, GET"
    tables_written: [email_subscribers]
    tables_read: [email_subscribers]
    description: "Email subscription (POST) and one-click unsubscribe (GET)"
    used_by_pages: ["/subscribe", "/meetings/[id]", "/elections"]

  "/api/subscribe/preferences":
    file: "web/src/app/api/subscribe/preferences/route.ts"
    method: "GET, PATCH"
    tables_written: [email_preferences]
    tables_read: [email_subscribers, email_preferences, election_candidates]
    description: "Load (GET) and save (PATCH) subscriber topic/district/candidate preferences"
    used_by_pages: ["/subscribe", "/subscribe/manage"]

  "/api/email/send-recap":
    file: "web/src/app/api/email/send-recap/route.ts"
    method: "POST"
    tables_read: [meetings, email_subscribers]
    description: "Send meeting recap email to all active subscribers (API_SECRET auth)"
    auth: API_SECRET

  "/api/email/send-orientation":
    file: "web/src/app/api/email/send-orientation/route.ts"
    method: "POST"
    tables_read: [meetings, email_subscribers]
    tables_written: [meetings]  # Updates orientation_emailed_at
    description: "Send pre-meeting orientation preview to all active subscribers. Idempotent — body {} discovers all upcoming regular meetings with a generated preview that haven't been emailed yet; body {meeting_id} targets one. Called by data-sync.yml after escribemeetings enrichment."
    auth: API_SECRET

  "/api/email/send-digest":
    file: "web/src/app/api/email/send-digest/route.ts"
    method: "POST"
    tables_read: [meetings, email_subscribers]
    description: "Send weekly digest of recent meetings to all active subscribers (API_SECRET auth)"
    auth: API_SECRET

  "/api/operator/send-recap":
    file: "web/src/app/api/operator/send-recap/route.ts"
    method: "GET, POST"
    tables_read: [meetings, email_subscribers]
    tables_written: [meetings]  # Updates recap_emailed_at
    description: "Operator UI: GET returns recap preview + subscriber count, POST sends recap email to all active subscribers"
    auth: operator_cookie

  "/api/operator/settings":
    file: "web/src/app/api/operator/settings/route.ts"
    method: "GET, PUT"
    tables_read: [operator_config]
    tables_written: [operator_config]
    description: "Read/write per-city AI scoring parameters (publication tiers, evidence weights, thresholds). Validates evidence weights sum to 1.0 and tier thresholds are descending."
    auth: operator_cookie
    used_by_pages: ["/operator/settings"]

  "/api/community-comments":
    file: "web/src/app/api/community-comments/route.ts"
    method: POST
    tables_read: [agenda_items, community_comments]
    tables_written: [community_comments]
    description: "Submit a community comment on an agenda item (rate-limited 10/IP/hr, 30/session, IP-hash, HttpOnly session cookie)"
    used_by_pages: ["/meetings/[id]/items/[itemNumber]"]

  "/api/geocode":
    file: "web/src/app/api/geocode/route.ts"
    method: GET
    description: "Census Bureau Geocoder pass-through (server-side proxy because Census API has no CORS). Address forwards straight through to Census; not logged or stored."
    used_by_pages: ["/elections/find-my-district"]
    notes: "External pass-through — does not read or write any database table"

  "/api/revalidate":
    file: "web/src/app/api/revalidate/route.ts"
    method: POST
    description: "On-demand ISR revalidation; busts Next.js cache for specified paths or all known paths. Protected by REVALIDATION_SECRET env var."
    used_by_pages: ["*"]
    notes: "External-only — does not read or write any database table"


# ══════════════════════════════════════════════════════════════
# FIELD MAP — End-to-end: visible field → source pipeline
#
# Format: page → field label → query/API → table.column → source
# Use `pipeline_map.py trace field:<field_name>` to trace any field.
#
# This is the section that answers: "This field shows 0 — what do
# I need to rerun?" Trace backward from the field to the source.
# ══════════════════════════════════════════════════════════════

field_map:

  # ── Home Page (/) ───────────────────────────────────────────

  "/":
    "meeting date":
      query: getMeetingsWithCounts
      column: meetings.meeting_date
      sources: [escribemeetings, minutes_extraction]

    "meeting type":
      query: getMeetingsWithCounts
      column: meetings.meeting_type
      sources: [escribemeetings, minutes_extraction]

    "agenda item count":
      query: getMeetingsWithCounts
      rpc: get_meeting_counts
      column: "COUNT(agenda_items.meeting_id)"
      sources: [escribemeetings, minutes_extraction]

    "vote count":
      query: getMeetingsWithCounts
