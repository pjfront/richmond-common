# ══════════════════════════════════════════════════════════════
# ENRICHMENTS — Processing stages that transform data
# ══════════════════════════════════════════════════════════════

enrichments:
  minutes_extraction:
    module: batch_extract.py
    description: "AI extraction of structured meeting data from raw PDFs"
    reads_from: [documents]
    writes_to: [extraction_runs, meetings, agenda_items, motions, votes,
                meeting_attendance, closed_session_items, public_comments,
                friendly_amendments]
    uses_api: "Claude Sonnet"
    cost_per_unit: "$0.06/meeting"

  # form700_extraction: standalone script, not in SYNC_SOURCES (uses form700 source sync key)
  # contributor_classification: standalone script, not in SYNC_SOURCES

  topic_tagging:
    module: topic_tagger.py
    description: "Keyword-based topic assignment for agenda items (14 Richmond local issues)"
    reads_from: [agenda_items, topics]
    writes_to: [item_topics]

  conflict_scanning:
    module: conflict_scanner.py
    description: "Multi-signal conflict-of-interest detection"
    reads_from: [meetings, meeting_attendance, agenda_items, contributions,
                 economic_interests, city_expenditures, independent_expenditures,
                 city_permits, city_licenses]
    writes_to: [conflict_flags, scan_runs]
    signal_detectors:
      - campaign_contribution
      - form700_property
      - form700_income
      - donor_vendor_expenditure
      - temporal_correlation

  # comment_generation: standalone script, not in SYNC_SOURCES
  # community_voice_extraction: standalone script, not in SYNC_SOURCES
  # written_comment_extraction: standalone script, not in SYNC_SOURCES (uses written_comments source sync key)

  theme_extraction:
    module: theme_extractor.py
    description: "Cluster public comments by substantive theme with narrative summaries (S21 Phase B)"
    reads_from: [public_comments, agenda_items]
    writes_to: [comment_themes, comment_theme_assignments, item_theme_narratives]
    uses_api: "Claude Sonnet"
    prompt: "prompts/theme_extraction_system.txt"
    status: active

  summary_generation:
    module: generate_summaries.py
    description: "Plain-language agenda item summaries and headlines"
    reads_from: [agenda_items, item_topics]  # item_topics: backfill_topic_labels seeds topic_label from curated topics before LLM
    writes_to: [agenda_items]  # Updates plain_language_summary + summary_headline + topic_label columns
    uses_api: "Claude Sonnet"
    batch_runner: batch_summarize.py  # R1 bulk regeneration via Batch API

  meeting_summary_generation:
    module: generate_meeting_summaries.py
    description: "Meeting-level 3-5 bullet narrative summaries"
    reads_from: [meetings, agenda_items, motions, votes]
    writes_to: [meetings]  # Updates meeting_summary column
    uses_api: "Claude Sonnet"

  orientation_generation:
    module: generate_orientation_previews.py
    description: "Pre-meeting orientation narrative (3-5 paragraphs, forward-looking)"
    reads_from: [meetings, agenda_items]
    writes_to: [meetings]  # Updates orientation_preview column
    uses_api: "Claude Sonnet"
    notes: "No vote gate — generates from agenda data alone, unlike meeting_summary_generation. Includes historical topic recurrence context. Once generated, /api/email/send-orientation broadcasts the preview to active subscribers automatically (idempotent via meetings.orientation_emailed_at)."

  recap_generation:
    module: generate_meeting_recaps.py
    description: "Post-meeting narrative recap (4-6 paragraphs, decisions + votes + public voice)"
    reads_from: [meetings, agenda_items, motions, votes, public_comments, item_theme_narratives, comment_themes]
    writes_to: [meetings]  # Updates meeting_recap column
    uses_api: "Claude Sonnet"
    notes: "Vote gate required (same as meeting_summary_generation). Includes split-vote callouts, theme narratives, consent calendar, continued items."

  filing_period_briefing_generation:
    module: filing_period_briefing.py
    description: "Per-filing-period structured campaign-finance briefing (F1 totals, F2 geography, F3 industry/PAC, F4 self/related-party; F5–F9 land in follow-on commits). Mirrors recap_generation in shape; the natural cadence event is filing close, not meeting end."
    reads_from: [contributions, donors, committees, election_candidates, elections]
    writes_to: [filing_period_briefings]
    notes: "Reads source-closest contribution rows (no derivative aggregates). Sections are tier-graded per signal-significance-spec — F5/F9 default to Tier C (operator-only) until reviewed; framing-sensitive per docs/research/financial-disclosure-framing.md."
    status: skeleton  # F1–F4 implemented; F5–F9 stubs

  donor_employer_merge:
    module: data_sync.py  # implemented as sync_donor_employer_merge wrapping merge_donor_employers
    description: "Collapse same-name donor rows whose employer strings are near-equivalent (NULL/N/A/None/Not employed/retired/...). Auto-runs after netfile sync via --enrich so fresh contributions don't accumulate employer-key fragmentation. Three rules: all-empty, empty+specific, substring-of (>= 4 chars or word-subset)."
    reads_from: [donors, contributions, entity_links]
    writes_to: [donors, contributions, entity_links]
    notes: "Idempotent — re-running on a clean DB is a no-op. Conservative on purpose: same-name-different-specific-employers (e.g. two John Smiths at Chevron and SEIU) are NOT merged. Long-term fix for those is B.46 entity_id JOIN."

  donor_dedup:
    module: data_sync.py  # implemented as sync_donor_dedup wrapping dedup_contributions
    description: "Drop cross-filing duplicate contributions. Catches the 'same gift filed twice' pattern: California Form 497 is filed by both donor (Part 2) and recipient (Part 1), producing two near-date contribution rows that slip past the standard ON CONFLICT key. Auto-runs AFTER donor_employer_merge so cross-filing pairs match by collapsed donor_id."
    reads_from: [contributions, donors]
    writes_to: [contributions]
    notes: "±14-day window. Keeper is the EARLIER-dated row (closer to actual transaction date — donor's Form 497 Part 2 is filed when money was sent; recipient's Part 1 when it cleared). See dedup_contributions._choose_keeper for the full rationale."

  paper_filing_reconciliation:
    module: load_paper_filings.py  # implemented as sync_paper_filing_reconciliation wrapping reconcile_paper_filings_to_forms
    description: "Synthesize one 'Unitemized contributions' row per Form 460 filing whose form_summary indicates a gap between the candidate's reported cover-page total and our extracted itemized rows. Makes DB cycle-to-date totals match Form 460 cover Line 5 — the canonical ground truth (the candidate's own legal certification of what they raised). Runs AFTER donor_dedup so the DB period totals reflect post-cleanup state."
    reads_from: [contributions, donors, committees]
    writes_to: [contributions]
    notes: "Idempotent — drops all entity_code='UNI' rows for the city before inserting new ones. Uses Form 460 cover-page summary extracted by netfile_paper_extractor.parse_form460_summary_with_vision and persisted in src/data/paper_filings/*.json under filings[].form_summary. If DB period total exceeds form total, no synthesis (logs a warning — possible OCR over-extraction)."

  transcript_vote_extraction:
    module: extract_transcript_votes.py
    description: "Preliminary motions+votes extracted from raw auto-caption transcripts (closes the 4-6 week minutes lag)"
    reads_from: [meetings, agenda_items, officials]
    writes_to: [motions, votes]  # Inserts source='transcript' rows; superseded when minutes arrive
    uses_api: "Claude Sonnet"
    notes: |
      Reads raw auto-captioned transcripts from data/transcripts/{date}_clean.txt
      when available (preferred), falling back to meetings.transcript_recap
      otherwise. Entry 50 (2026-04-26): the recap-only flow missed substantive
      votes — the 3/17 Flock 4-3 vote was extracted only after switching to raw.

      Cost: ~$0.20-0.30/meeting on raw transcripts (~88K input tokens for a
      typical 4hr meeting); ~$0.05 on recap fallback. Temperature=0 for
      deterministic extraction.

      Long-transcript safety net: if a raw-transcript pass returns 0 motions
      AND a recap is available, the script automatically retries against the
      recap. Observed 4/07 failure: 354K-char raw transcript reliably
      returned no motions despite a clear unanimous roll call; the smaller
      curated recap surfaced all three substantive votes.

      Skips meetings where source='minutes' motions already exist (ground
      truth wins). When minutes_extraction later inserts source='minutes'
      rows, it deletes the existing source='transcript' rows for the same
      agenda_item first (see db.py::save_meeting_data). Frontend surfaces
      an amber "Tentative — auto-captioned recording" badge for
      source='transcript' motions (VoteRollCall.tsx).

  comment_summary_generation:
    module: generate_comment_summaries.py
    description: "2-3 sentence AI synthesis of public testimony per agenda item"
    reads_from: [agenda_items, public_comments, item_theme_narratives, comment_themes, meetings]
    writes_to: [agenda_items]  # Updates comment_summary column
    uses_api: "Claude Sonnet"
    notes: "Prefers item_theme_narratives when available (cheaper). Falls back to raw comment metadata."

  vote_explainer_generation:
    module: generate_vote_explainers.py
    description: "Plain-language vote/motion explainers"
    reads_from: [motions]
    writes_to: [motions]  # Updates vote_explainer column
    uses_api: "Claude Sonnet"

  embedding_generation:
    module: embedding_generator.py
    description: "OpenAI text-embedding-3-small vectors for semantic search (Layer 3)"
    reads_from: [agenda_items, meetings, officials, motions]
    writes_to: [agenda_items, meetings, officials, motions]  # Updates embedding columns
    uses_api: "OpenAI Embeddings"
    batch_runner: batch_embed.py

  proceeding_classification:
    module: batch_classify_proceeding.py
    description: "LLM classification of agenda item proceeding types"
    reads_from: [agenda_items]
    writes_to: [agenda_items]  # Updates proceeding_type column
    uses_api: "Claude Sonnet"
    batch_runner: batch_classify_proceeding.py

  # bio_generation: standalone script (council_profiles.py), not in SYNC_SOURCES
  # commission_seeding: standalone script (seed_commissions.py), not in SYNC_SOURCES
  # cloud_pipeline: orchestrator script, not in SYNC_SOURCES (dispatches other sources)
  # community_comments_submission: web POST endpoint (web/src/app/api/community-comments/route.ts),
  #   not in SYNC_SOURCES — referenced as the writer for community_comments table


