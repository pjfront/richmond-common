  "/reports":
    description: "Financial contribution reports list — meetings with conflict flags"
    queries: [getMeetingsWithFlags, getConflictFlags]

  "/reports/[meetingId]":
    description: "Financial contribution report — conflict flags by meeting"
    queries: [getMeetingsWithFlags, getConflictFlagsDetailed, getMeetingForReport,
              getConflictFlags]

  "/influence":
    description: "Influence map — official index with financial connection summaries and confidence breakdown"
    queries: [getAllFinancialConnectionSummaries]

  "/influence/item/[id]":
    description: "Influence map — agenda item center with contribution narratives, votes, behested payments, related decisions"
