# ══════════════════════════════════════════════════════════════
# EXPECTATIONS — Liveness checks: what should be true RIGHT NOW?
# ══════════════════════════════════════════════════════════════
#
# Static lineage (sources/tables/queries above) answers "where could
# data go?" — it cannot answer "did the latest record actually flow
# through?" Expectations close that gap.
#
# Each expectation is a SQL query that returns ROWS WHERE THE
# EXPECTATION FAILS. Empty result = passing. Non-empty = failure
# (each row identifies one specific failure case).
#
# Run: `python pipeline_map.py liveness`
# Run + create decision_queue entries: `python pipeline_map.py liveness --create-decisions`
#
# Severity maps to decision_queue:
#   high   — user-facing data materially missing or wrong
#   medium — pipeline degradation, partially working
#   low    — stale data within tolerance, monitoring signal
#   info   — diagnostic only
#
# When adding a new source or enrichment, add at least one expectation
# covering its primary output. Enforced by tests/test_pipeline_manifest.py.

expectations:

  # ── Meetings & recaps ──────────────────────────────────────

  - id: past_meetings_have_transcript_recap_within_5_days
    owner: recap_generation
    severity: high
    description: "Regular council meetings older than 5 days should have a transcript recap (or fall back to meeting_recap)."
    rationale: "Transcript-based recap publishes within 24-72hrs of meeting end. If still NULL after 5 days, the YouTube/Granicus fetch path has failed."
    check: |
      SELECT id::text AS entity_id,
             meeting_date::text AS meeting_date,
             'no transcript_recap (' || (CURRENT_DATE - meeting_date) || ' days post-meeting)' AS detail
      FROM meetings
      WHERE city_fips = '0660620'
        AND meeting_type = 'regular'
        AND meeting_date < CURRENT_DATE - INTERVAL '5 days'
        AND meeting_date >= CURRENT_DATE - INTERVAL '60 days'
        AND transcript_recap IS NULL
        AND meeting_recap IS NULL
      ORDER BY meeting_date DESC

  - id: past_meetings_have_minutes_within_45_days
    owner: escribemeetings_minutes
    severity: medium
    description: "Regular council meetings older than 45 days should have a minutes_url."
    rationale: "Official minutes typically publish 4-6 weeks post-meeting. Missing minutes_url means either the city hasn't posted minutes yet (city-side delay) or our scraper isn't finding them (our bug). When this fires, manually check the Archive Center: if minutes are posted there but minutes_url is NULL, the discovery scraper has drifted."
    check: |
      SELECT id::text AS entity_id,
             meeting_date::text AS meeting_date,
             'no minutes_url (' || (CURRENT_DATE - meeting_date) || ' days post-meeting)' AS detail
      FROM meetings
      WHERE city_fips = '0660620'
        AND meeting_type = 'regular'
        AND meeting_date < CURRENT_DATE - INTERVAL '45 days'
        AND meeting_date >= CURRENT_DATE - INTERVAL '180 days'
        AND minutes_url IS NULL
      ORDER BY meeting_date DESC

  - id: generated_artifacts_have_provenance
    owner: recap_generation
    severity: medium
    description: "Every generated text artifact (recap, summary, bio) should have a sibling provenance row."
    rationale: "Migration 095 introduced *_provenance JSONB columns so the rendered source attribution can never desync from the actual generator inputs (Entry 50/51 audit). If an artifact lacks provenance, the frontend either renders no attribution (silent) or falls back to a legacy default — both bypass the new architectural guarantee. After backfill_artifact_provenance.py runs, this expectation should stay at zero rows."
    check: |
      SELECT 'meeting_recap' AS entity_id,
             m.id::text AS meeting_id,
             'meeting_recap exists but provenance NULL' AS detail
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.meeting_recap IS NOT NULL
        AND m.meeting_recap_provenance IS NULL
      UNION ALL
      SELECT 'meeting_summary', m.id::text, 'meeting_summary exists but provenance NULL'
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.meeting_summary IS NOT NULL
        AND m.meeting_summary_provenance IS NULL
      UNION ALL
      SELECT 'transcript_recap', m.id::text, 'transcript_recap exists but provenance NULL'
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.transcript_recap IS NOT NULL
        AND m.transcript_recap_provenance IS NULL
      UNION ALL
      SELECT 'orientation_preview', m.id::text, 'orientation_preview exists but provenance NULL'
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.orientation_preview IS NOT NULL
        AND m.orientation_preview_provenance IS NULL
      UNION ALL
      SELECT 'bio_summary', o.id::text, 'bio_summary exists but provenance NULL'
      FROM officials o
      WHERE o.city_fips = '0660620'
        AND o.bio_summary IS NOT NULL
        AND o.bio_summary_provenance IS NULL

  - id: meetings_with_motions_have_recap
    owner: recap_generation
    severity: high
    description: "Regular meetings with minutes-extracted motions (vote gate satisfied) should have a meeting_recap."
    rationale: "recap_generation runs downstream of minutes_extraction via the DAG. If a meeting has minutes-derived motions but no recap, the auto-cascade silently failed — distinct from 'minutes never published.' This is the real recap_generation health signal. Filtered to source='minutes' so transcript-sourced preliminary motions (S24.23) don't false-positive — meeting_recap is generated from minutes, not transcripts."
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'has ' || COUNT(mo.id) || ' minutes-sourced motions but no meeting_recap (' ||
               (CURRENT_DATE - m.meeting_date) || ' days post-meeting)' AS detail
      FROM meetings m
      JOIN agenda_items ai ON ai.meeting_id = m.id
      JOIN motions mo ON mo.agenda_item_id = ai.id
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date < CURRENT_DATE - INTERVAL '7 days'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '180 days'
        AND m.meeting_recap IS NULL
        AND mo.source = 'minutes'
      GROUP BY m.id, m.meeting_date
      ORDER BY m.meeting_date DESC

  - id: upcoming_meetings_have_orientation_preview
    owner: orientation_generation
    severity: medium
    description: "The next upcoming regular meeting should have an orientation preview at least 24 hours before it starts."
    rationale: "Orientation previews are pre-meeting summaries. Missing one means subscribers won't get an agenda preview email."
    check: |
      SELECT id::text AS entity_id,
             meeting_date::text AS meeting_date,
             'no orientation_preview, meeting in ' || (meeting_date - CURRENT_DATE) || ' days' AS detail
      FROM meetings
      WHERE city_fips = '0660620'
        AND meeting_type = 'regular'
        AND meeting_date >= CURRENT_DATE
        AND meeting_date <= CURRENT_DATE + INTERVAL '7 days'
        AND orientation_preview IS NULL
      ORDER BY meeting_date

  - id: regular_meeting_cadence_not_broken
    owner: escribemeetings
    severity: high
    description: "Most recent regular council meeting should be no older than 35 days (typical cadence is biweekly)."
    rationale: "If the most recent meeting is >35 days old, the eSCRIBE scraper may have stopped discovering meetings."
    check: |
      SELECT 'no_meetings' AS entity_id,
             COALESCE(MAX(meeting_date)::text, 'never') AS meeting_date,
             'no regular meeting in last 35 days (most recent: ' ||
               COALESCE(MAX(meeting_date)::text, 'never') || ')' AS detail
      FROM meetings
      WHERE city_fips = '0660620' AND meeting_type = 'regular'
      HAVING MAX(meeting_date) IS NULL
          OR MAX(meeting_date) < CURRENT_DATE - INTERVAL '35 days'

  - id: past_meetings_have_agenda_items
    owner: escribemeetings
    severity: medium
    description: "Past regular meetings should have at least 1 agenda_item."
    rationale: "Empty agenda usually means scraper or extractor failed for this meeting."
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'meeting has 0 agenda_items' AS detail
      FROM meetings m
      LEFT JOIN agenda_items ai ON ai.meeting_id = m.id
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date < CURRENT_DATE
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '120 days'
      GROUP BY m.id, m.meeting_date
      HAVING COUNT(ai.id) = 0
      ORDER BY m.meeting_date DESC

  - id: past_meetings_have_written_comments_within_7_days
    owner: written_comments
    severity: medium
    description: "Regular meetings older than 7 days should have at least one written public comment."
    rationale: "Richmond's City Clerk posts written-comment PDFs to Archive Center within 1-3 days of each council meeting, and every regular meeting in recent history has had at least one. If a >7-day-old meeting has zero written_comments rows, either (a) the daily archive_center sync didn't pick up the PDF, or (b) the written_comments extractor failed to parse it. Surfaced after S24.24 — pre-S24.24 the gap was ~5 days from posting until extraction (city posted mid-week, our weekly sync ran Mondays). Daily sync should keep this passing."
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             '0 written_comments rows (' || (CURRENT_DATE - m.meeting_date) || ' days post-meeting)' AS detail
      FROM meetings m
      LEFT JOIN public_comments pc
        ON pc.meeting_id = m.id
        AND pc.city_fips = m.city_fips
        AND pc.comment_type = 'written'
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date < CURRENT_DATE - INTERVAL '7 days'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '60 days'
      GROUP BY m.id, m.meeting_date
      HAVING COUNT(pc.id) = 0
      ORDER BY m.meeting_date DESC

  # ── Topic tagging & summaries ──────────────────────────────

  - id: past_items_have_topic_labels
    owner: topic_tagging
    severity: low
    description: "Agenda items from past meetings (>7 days old) should have a topic_label."
    rationale: "topic_tagging is a downstream enrichment. Missing labels means topic timeline / Most Discussed pages have gaps."
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             COUNT(ai.id) || ' items missing topic_label' AS detail
      FROM meetings m
      JOIN agenda_items ai ON ai.meeting_id = m.id
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date < CURRENT_DATE - INTERVAL '7 days'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '60 days'
        AND (ai.topic_label IS NULL OR ai.topic_label = '')
      GROUP BY m.id, m.meeting_date
      HAVING COUNT(ai.id) > 5
      ORDER BY m.meeting_date DESC

  # ── Campaign finance ───────────────────────────────────────

  - id: netfile_recently_synced
    owner: netfile
    severity: medium
    description: "NetFile data_sync_log should have a successful sync from the last 8 days."
    rationale: "NetFile syncs weekly; >8 days means at least one scheduled run was missed. data_sync_log.status enum is 'completed'/'running'/'failed' (NOT 'success' — that's a stale expectation written against an imagined enum)."
    check: |
      SELECT 'netfile_stale' AS entity_id,
             COALESCE(MAX(completed_at)::text, 'never') AS meeting_date,
             'last NetFile sync: ' || COALESCE(MAX(completed_at)::text, 'never') AS detail
      FROM data_sync_log
      WHERE source = 'netfile' AND status = 'completed'
      HAVING MAX(completed_at) IS NULL
          OR MAX(completed_at) < NOW() - INTERVAL '8 days'

  - id: recent_contributions_have_dates
    owner: netfile
    severity: high
    description: "Contributions ingested in the last 30 days should have a non-NULL contribution_date."
    rationale: "NULL contribution_date means the field-mapping in the loader is broken — frontend filters by date will silently drop these records."
    check: |
      SELECT 'null_dates' AS entity_id,
             CURRENT_DATE::text AS meeting_date,
             COUNT(*) || ' recently-loaded contributions have NULL contribution_date' AS detail
      FROM contributions
      WHERE city_fips = '0660620'
        AND created_at >= NOW() - INTERVAL '30 days'
        AND contribution_date IS NULL
      HAVING COUNT(*) > 0

  - id: no_cross_filing_duplicate_contribs
    owner: donor_dedup
    severity: high
    description: "No (donor_id, committee_id, amount) cluster should have 2+ contributions within a 14-day window from different filings."
    rationale: "California Form 497 is filed twice for the same gift (donor's Part 2 + recipient's Part 1). Without dedup, totals are inflated. Auto-running sync_donor_dedup as a netfile-cascade enrichment should keep this empty. If this fails, the enrichment isn't running or isn't running often enough — check that --enrich is being passed and that the manifest DAG includes donor_dedup downstream of contributions."
    check: |
      SELECT (a.donor_id::text || '|' || a.committee_id::text || '|' || a.amount::text) AS entity_id,
             MIN(LEAST(a.contribution_date, b.contribution_date))::text AS meeting_date,
             'cross-filing dup: ' || COUNT(*) || ' near-date pair(s) for the same (donor, committee, amount); run sync_donor_dedup' AS detail
        FROM contributions a
        JOIN contributions b
          ON a.donor_id    = b.donor_id
         AND a.amount      = b.amount
         AND a.committee_id IS NOT DISTINCT FROM b.committee_id
         AND a.id         <  b.id
         AND a.filing_id  IS DISTINCT FROM b.filing_id
         AND ABS((b.contribution_date - a.contribution_date)) <= 14
       WHERE a.city_fips = '0660620'
       GROUP BY a.donor_id, a.committee_id, a.amount
       HAVING COUNT(*) > 0

  - id: paper_filings_reconcile_to_form_460
    owner: paper_filing_reconciliation
    severity: high
    description: "Synthetic Unitemized reconciliation rows should not be suspiciously large. A gap > $50,000 indicates massive under-extraction (Vision OCR missed most of the form's contributions) or a form_summary parse error."
    rationale: "Form 460 cover Line 5 is the candidate's own legal certification of total monetary contributions received. The paper_filing_reconciliation enrichment synthesizes Unitemized contributions rows to bridge the gap between extracted itemized rows and the form total. If a gap row is huge, something is structurally wrong with the extraction — either the form_summary parser misread the cover total, or the itemized extractor missed most of Schedule A."
    check: |
      SELECT (c.committee_id::text || '|' || c.filing_id) AS entity_id,
             c.contribution_date::text                     AS meeting_date,
             'reconciliation gap looks too large: $' ||
              ROUND(c.amount::numeric, 2)::text ||
              ' on filing ' || c.filing_id ||
              ' (committee ' || c.committee_id::text || ')' AS detail
        FROM contributions c
       WHERE c.city_fips = '0660620'
         AND c.entity_code = 'UNI'
         AND c.amount > 50000

  - id: no_employer_key_donor_fragmentation
    owner: donor_employer_merge
    severity: medium
    description: "No (city_fips, normalized_name) cluster should have 2+ donor rows whose employers are all empty-equivalent (NULL/N/A/None/Not employed/retired/...)."
    rationale: "When all rows in a same-name cluster have empty-equivalent employers, they should have been collapsed by sync_donor_employer_merge into a single row. If this fires, the enrichment isn't running. Conservative: only flags the pure all-empty pattern (Rule 1) since Rule 2 and Rule 3 are harder to express in pure SQL."
    check: |
      SELECT normalized_name AS entity_id,
             CURRENT_DATE::text AS meeting_date,
             COUNT(*) || ' donor rows for ' || MAX(name) || ' all with empty-equivalent employers; run sync_donor_employer_merge' AS detail
        FROM donors
       WHERE city_fips = '0660620'
         AND (
              employer IS NULL
              OR LOWER(TRIM(employer)) IN ('', 'n/a', 'na', 'none', 'null',
                                            'not employed', 'not employeed',
                                            'not empoloyed', 'unemployed',
                                            'no employer', 'self', 'self employed',
                                            'self-employed', 'selfemployed', 'retired')
         )
       GROUP BY normalized_name
       HAVING COUNT(*) > 1

  - id: candidates_have_committee_linked
    owner: netfile
    severity: medium
    description: "Active candidates in current/upcoming elections should have a committee_id linked."
    rationale: "Candidate without committee_id has no contribution data on their profile page."
    check: |
      SELECT ec.id::text AS entity_id,
             COALESCE(e.election_date::text, 'unknown') AS meeting_date,
             'candidate ' || COALESCE(ec.candidate_name, '?') || ' for ' ||
               COALESCE(ec.office_sought, '?') || ' has no committee_id linked' AS detail
      FROM election_candidates ec
      JOIN elections e ON e.id = ec.election_id
      WHERE ec.city_fips = '0660620'
        AND ec.status IN ('filed', 'qualified')
        AND e.election_date >= CURRENT_DATE - INTERVAL '30 days'
        AND ec.committee_id IS NULL

  - id: no_duplicate_candidacies_per_election
    owner: candidate_discovery
    severity: medium
    description: "Each official should have at most one candidacy record per election."
    rationale: "Surfaced via Leisa's 2026-04-25 feedback on Claudia Jimenez's 2024 cycle: two records for the same 2024-11-05 election (one 'filed' with FPPC ID, one 'elected' with FPPC NULL). The frontend may pick either, causing FPPC link breakage or contradictory metadata. Pattern likely repeats elsewhere — flag all instances so they can be reconciled."
    check: |
      SELECT (official_id::text || '|' || election_id::text) AS entity_id,
             MAX(candidate_name) AS meeting_date,
             COUNT(*) || ' candidacies for ' || MAX(candidate_name) ||
               ' in election ' || MAX(election_id::text) AS detail
      FROM election_candidates
      WHERE city_fips = '0660620'
        AND official_id IS NOT NULL
      GROUP BY official_id, election_id
      HAVING COUNT(*) > 1

  - id: candidacy_committee_cycle_matches
    owner: candidate_discovery
    severity: medium
    description: "A candidacy's committee_id should belong to a committee from the same election cycle (same calendar year)."
    rationale: "S24.18a-3 (2026-04-26) discovered 5 cases where the research seeding linked a candidacy to the wrong-cycle committee — e.g., Doria Robinson's '2022 elected' row pointed at her 2026 reelection committee, so her 2022 council profile would display 2026 contributions. Catches integrity errors that don't show up as duplicates but cause cycle-mismatched data on profile pages. Different election rows within the same calendar year (primary + general) are NOT a mismatch."
    check: |
      SELECT ec.id::text AS entity_id,
             e.election_date::text AS meeting_date,
             'candidacy for ' || COALESCE(ec.candidate_name, '?') || ' (' ||
               EXTRACT(YEAR FROM e.election_date)::int || ') links to committee ' ||
               '"' || c.name || '" (' ||
               EXTRACT(YEAR FROM ce.election_date)::int || ')' AS detail
      FROM election_candidates ec
      JOIN elections e ON e.id = ec.election_id
      JOIN committees c ON c.id = ec.committee_id
      JOIN elections ce ON ce.id = c.election_id
      WHERE ec.city_fips = '0660620'
        AND EXTRACT(YEAR FROM e.election_date) != EXTRACT(YEAR FROM ce.election_date)

  # ── Conflict scanning ──────────────────────────────────────

  - id: conflict_scanner_has_current_flags
    owner: conflict_scanning
    severity: high
    description: "conflict_flags table should contain at least 1 flag with is_current=TRUE."
    rationale: "Empty current-flags table = scanner has not run successfully OR superseded everything. Reports page would show empty."
    check: |
      SELECT 'no_current_flags' AS entity_id,
             CURRENT_DATE::text AS meeting_date,
             'no flags with is_current=TRUE' AS detail
      WHERE NOT EXISTS (
        SELECT 1 FROM conflict_flags
        WHERE city_fips = '0660620' AND is_current = TRUE
      )

  - id: recent_meeting_was_scanned
    owner: conflict_scanning
    severity: medium
    description: "Past regular meetings (>14 days, <90 days old) should have a scan_run."
    rationale: "If a recent meeting hasn't been scanned, conflict reports for that meeting are missing."
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'no scan_run for this meeting' AS detail
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date < CURRENT_DATE - INTERVAL '14 days'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '90 days'
        AND NOT EXISTS (
          SELECT 1 FROM scan_runs sr
          WHERE sr.meeting_id = m.id
        )
      ORDER BY m.meeting_date DESC
      LIMIT 5

  # ── Public comments / Community Voice ──────────────────────

  - id: past_meetings_have_comments_or_summary
    owner: theme_extraction
    severity: low
    description: "Past meetings (>14 days old) should have either public_comments or meeting_summary populated."
    rationale: "Both NULL means transcript pipeline + comment extraction both failed for this meeting."
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'no public_comments and no meeting_summary' AS detail
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date < CURRENT_DATE - INTERVAL '14 days'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '90 days'
        AND m.meeting_summary IS NULL
        AND NOT EXISTS (
          SELECT 1 FROM public_comments pc WHERE pc.meeting_id = m.id
        )
      ORDER BY m.meeting_date DESC
      LIMIT 5

  # ── Public records (CPRA) ──────────────────────────────────

  - id: nextrequest_recently_synced
    owner: nextrequest
    severity: low
    description: "nextrequest_requests should have at least one record updated in the last 14 days."
    rationale: "If no NextRequest data has been updated in two weeks, sync may be broken."
    check: |
      SELECT 'nextrequest_stale' AS entity_id,
             COALESCE(MAX(updated_at)::text, 'never') AS meeting_date,
             'last nextrequest update: ' || COALESCE(MAX(updated_at)::text, 'never') AS detail
      FROM nextrequest_requests
      HAVING MAX(updated_at) IS NULL
          OR MAX(updated_at) < NOW() - INTERVAL '14 days'

  # ── Council members ────────────────────────────────────────

  - id: current_council_members_have_normalized_names
    owner: officials_seed
    severity: medium
    description: "Current council members and mayor should each have a normalized_name (used to derive URL slugs)."
    rationale: "Officials without normalized_name cannot be linked from meeting pages or appear in /council index."
    check: |
      SELECT id::text AS entity_id,
             COALESCE(name, '?') AS meeting_date,
             'official ' || COALESCE(name, '?') || ' (' || COALESCE(role, '?') ||
               ') has no normalized_name' AS detail
      FROM officials
      WHERE city_fips = '0660620'
        AND is_current = TRUE
        AND role IN ('mayor', 'councilmember', 'vice_mayor')
        AND (normalized_name IS NULL OR normalized_name = '')

  # ── Claims-vs-data integrity ───────────────────────────────
  # Catch silent lies: confidently-wrong assertions in generated
  # text that contradict the structured data behind them.
  # Distinct from presence checks above (which catch silent
  # omissions but still pass when content asserts the wrong thing).
  # Added after S24.23b (2026-04-26): meeting_recap claimed
  # "the council did not vote on any action items" while the
  # structured motion record showed a 4-3 pass on Flock Safety.
  # See JOURNAL.md Entry 51.

  - id: meeting_recap_no_vote_claim_contradicts_motions
    owner: recap_generation
    severity: high
    description: "meeting_recap text claims no vote/action was taken, but minutes-sourced motions exist for the meeting."
    rationale: |
      Surfaced after S24.23b (2026-04-26): the 3/17 meeting_recap
      confidently asserted "the council did not vote on any action
      items, including a Flock Safety contract extension" while the
      structured motion record showed the Flock motion passed 4-3.
      Presence checks didn't catch it (recap was present, motions
      were present) — only the recap's CLAIM was false. This
      compares the claim against the data.
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'meeting_recap claims no vote/action despite ' || COUNT(mo.id) ||
               ' minutes-sourced motion(s)' AS detail
      FROM meetings m
      JOIN agenda_items ai ON ai.meeting_id = m.id
      JOIN motions mo ON mo.agenda_item_id = ai.id
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_recap IS NOT NULL
        AND mo.source = 'minutes'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '180 days'
        AND (
          m.meeting_recap ILIKE '%did not vote%'
          OR m.meeting_recap ILIKE '%no votes were taken%'
          OR m.meeting_recap ILIKE '%no action items were voted%'
          OR m.meeting_recap ILIKE '%did not take any action%'
          OR m.meeting_recap ILIKE '%took no action%'
        )
      GROUP BY m.id, m.meeting_date
      ORDER BY m.meeting_date DESC

  - id: transcript_recap_no_vote_claim_contradicts_motions
    owner: recap_generation
    severity: high
    description: "transcript_recap claims no vote/action was taken, but motions (any source) exist for the meeting."
    rationale: |
      Same failure shape as meeting_recap_no_vote_claim_contradicts_motions
      but for the transcript-derived recap. The 3/17 transcript_recap was
      the original artifact that summarized away the Flock vote, before
      meeting_recap inherited the lie. Compares any motion source
      (minutes OR transcript) since transcript_recap is published before
      minutes arrive and should be honest about transcript-extracted
      votes too.
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'transcript_recap claims no vote/action despite ' || COUNT(mo.id) ||
               ' motion(s) (sources: ' || string_agg(DISTINCT mo.source, ', ') || ')' AS detail
      FROM meetings m
      JOIN agenda_items ai ON ai.meeting_id = m.id
      JOIN motions mo ON mo.agenda_item_id = ai.id
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.transcript_recap IS NOT NULL
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '180 days'
        AND (
          m.transcript_recap ILIKE '%did not vote%'
          OR m.transcript_recap ILIKE '%no votes were taken%'
          OR m.transcript_recap ILIKE '%no action items were voted%'
          OR m.transcript_recap ILIKE '%did not take any action%'
          OR m.transcript_recap ILIKE '%took no action%'
        )
      GROUP BY m.id, m.meeting_date
      ORDER BY m.meeting_date DESC

  - id: summary_headline_outcome_matches_motion_result
    owner: summary_generation
    severity: medium
    description: "agenda_items.summary_headline asserts an outcome (approved/passed/adopted, or rejected/failed/denied) that no motion result for that item supports."
    rationale: |
      summary_headline is a one-sentence narrative shown on listing cards.
      If it confidently says "Council approved X" but no passed motion
      exists for that item (or "Council rejected X" but no failed motion),
      the headline misrepresents the outcome on the most-front-facing
      card — exactly the failure shape the recap had on 3/17, just at the
      item level instead of the meeting level.
    check: |
      SELECT ai.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             CASE
               WHEN ai.summary_headline ILIKE '%approved%'
                 OR ai.summary_headline ILIKE '%passed%'
                 OR ai.summary_headline ILIKE '%adopted%'
               THEN 'summary_headline claims approved/passed/adopted but no such motion result exists'
               ELSE 'summary_headline claims rejected/failed/denied but no such motion result exists'
             END AS detail
      FROM agenda_items ai
      JOIN meetings m ON m.id = ai.meeting_id
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND ai.summary_headline IS NOT NULL
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '180 days'
        AND m.meeting_date < CURRENT_DATE
        AND (
          (
            (ai.summary_headline ILIKE '%approved%'
             OR ai.summary_headline ILIKE '%passed%'
             OR ai.summary_headline ILIKE '%adopted%')
            AND NOT EXISTS (
              SELECT 1 FROM motions mo
              WHERE mo.agenda_item_id = ai.id
                AND lower(COALESCE(mo.result, '')) IN ('passed', 'approved', 'adopted')
            )
          )
          OR
          (
            (ai.summary_headline ILIKE '%rejected%'
             OR ai.summary_headline ILIKE '%denied%'
             OR ai.summary_headline ILIKE '%failed%'
             OR ai.summary_headline ILIKE '%defeated%')
            AND NOT EXISTS (
              SELECT 1 FROM motions mo
              WHERE mo.agenda_item_id = ai.id
                AND lower(COALESCE(mo.result, '')) IN ('failed', 'rejected', 'denied', 'defeated', 'lost')
            )
          )
        )
      ORDER BY m.meeting_date DESC
      LIMIT 20

  - id: transcript_recap_mentions_action_item_titles
    owner: recap_generation
    severity: medium
    description: "Past meeting has substantive (non-consent) action items but transcript_recap mentions none of their distinctive title words."
    rationale: |
      S24.23b (2026-04-26): the 3/17 transcript_recap summarized away the
      Flock contract entirely — no mention of "Flock" anywhere. This
      tokenizes non-consent agenda title words, drops procedural noise
      (approve, authorize, etc.), and verifies at least one distinctive
      word from the agenda appears in the recap. Empty match = recap
      likely skipped the entire substantive program. Doesn't catch
      single-item omissions (the 3/17 recap mentioned other items
      besides Flock), but catches the broader failure where transcript_recap
      entirely skips action-item content (e.g. a recap that narrates
      only public comment and forgets votes).
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'transcript_recap mentions none of the non-consent agenda title words' AS detail
      FROM meetings m
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.transcript_recap IS NOT NULL
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '90 days'
        AND m.meeting_date < CURRENT_DATE
        AND EXISTS (
          SELECT 1 FROM agenda_items ai
          WHERE ai.meeting_id = m.id
            AND ai.is_consent_calendar = FALSE
            AND ai.title IS NOT NULL
        )
        AND NOT EXISTS (
          SELECT 1
          FROM (
            SELECT lower(unnest(string_to_array(
              regexp_replace(COALESCE(ai_inner.title, ''), '[^A-Za-z ]', ' ', 'g'),
              ' '
            ))) AS w
            FROM agenda_items ai_inner
            WHERE ai_inner.meeting_id = m.id
              AND ai_inner.is_consent_calendar = FALSE
              AND ai_inner.title IS NOT NULL
          ) words
          WHERE length(words.w) >= 6
            AND words.w NOT IN (
              'approve', 'approval', 'approving',
              'adopting', 'adoption', 'adopted',
              'authorize', 'authorizing', 'authorization',
              'consider', 'consideration',
              'receive', 'receiving',
              'discuss', 'discussion',
              'present', 'presented', 'presentation',
              'directing', 'direction',
              'resolve', 'resolution',
              'execute', 'executing', 'execution',
              'further', 'public', 'meeting', 'meetings',
              'council', 'agenda', 'introduction', 'introduce',
              'amendment', 'amending', 'matters', 'pursuant',
              'related', 'subject', 'attached', 'regarding',
              'between', 'amount', 'including', 'whereas'
            )
            AND m.transcript_recap ILIKE '%' || words.w || '%'
        )
      ORDER BY m.meeting_date DESC
      LIMIT 10

  - id: recap_mentions_only_known_attendees
    owner: recap_generation
    severity: medium
    description: "meeting_recap or transcript_recap mentions a current councilmember by name, but that member has no attendance and no vote recorded for the meeting."
    rationale: |
      Catches name hallucinations: AI-generated recaps occasionally
      reference a councilmember as having spoken or voted at a meeting
      they did not attend. Compares full-name string match in the recap
      against meeting_attendance and votes. Limited to current
      councilmembers (mayor/vice-mayor/councilmember with is_current=TRUE)
      so legitimate historical mentions of former officials don't
      false-positive. False-positive risk: recap referencing a member's
      prior statement on a topic they aren't attending — operator
      should triage rather than auto-suppress.
    check: |
      SELECT m.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'recap mentions ' || cc.name ||
               ' but no attendance/vote recorded for this meeting' AS detail
      FROM meetings m
      CROSS JOIN (
          SELECT id, name FROM officials
          WHERE city_fips = '0660620'
            AND is_current = TRUE
            AND role IN ('mayor', 'councilmember', 'vice_mayor')
            AND name IS NOT NULL
            AND length(name) >= 5
      ) cc
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '90 days'
        AND m.meeting_date < CURRENT_DATE
        AND (
          (m.meeting_recap IS NOT NULL AND m.meeting_recap ILIKE '%' || cc.name || '%')
          OR (m.transcript_recap IS NOT NULL AND m.transcript_recap ILIKE '%' || cc.name || '%')
        )
        AND NOT EXISTS (
          SELECT 1 FROM meeting_attendance ma
          WHERE ma.meeting_id = m.id AND ma.official_id = cc.id
        )
        AND NOT EXISTS (
          SELECT 1 FROM votes v
          JOIN motions mo ON mo.id = v.motion_id
          JOIN agenda_items ai ON ai.id = mo.agenda_item_id
          WHERE ai.meeting_id = m.id AND v.official_id = cc.id
        )
      ORDER BY m.meeting_date DESC
      LIMIT 20

  - id: vote_explainer_dollar_amounts_traceable_to_motion
    owner: vote_explainer_generation
    severity: medium
    description: "motions.vote_explainer cites a specific dollar amount that does not appear in any source column: motion_text, agenda_item title/description/plain_language_summary, or agenda_items.financial_amount."
    rationale: |
      vote_explainer is the AI-generated "what was decided, what does it
      cost, was it contentious" caption. If it surfaces a $X figure that
      isn't in any source column, the figure may be hallucinated. Catches
      the failure mode where AI summarization invents a plausible-sounding
      cost. Granular: each unsourced amount produces one failure row.
      Limited to fully-numeric amounts ($50,000 or $1.5). K/M/B
      abbreviations are skipped to avoid normalization false positives.

      Source columns checked: motion_text, ai.title, ai.description,
      ai.plain_language_summary, ai.financial_amount. The plain-language
      summary often carries dollar context that the structured fields
      omit (Flock contract: description has no figure, summary has
      "$249,600 total cost").

      Tolerance: cited amounts that round to a source amount within
      $1 are accepted (Commercial Titan Wrap: source has $13,095.78,
      explainer cites $13,096; this is benign rounding, not invention).
    check: |
      SELECT mo.id::text AS entity_id,
             m.meeting_date::text AS meeting_date,
             'vote_explainer cites $' || rm.captures[1] ||
               ' not present in any source column' AS detail
      FROM motions mo
      JOIN agenda_items ai ON ai.id = mo.agenda_item_id
      JOIN meetings m ON m.id = ai.meeting_id
      CROSS JOIN regexp_matches(mo.vote_explainer, '\$\s*([0-9](?:[0-9,]*[0-9])?(?:\.[0-9]+)?)', 'g') AS rm(captures)
      WHERE m.city_fips = '0660620'
        AND m.meeting_type = 'regular'
        AND mo.vote_explainer IS NOT NULL
        AND m.meeting_date >= CURRENT_DATE - INTERVAL '180 days'
        AND m.meeting_date < CURRENT_DATE
        AND COALESCE(mo.motion_text, '') NOT ILIKE '%' || rm.captures[1] || '%'
        AND COALESCE(mo.motion_text, '') NOT ILIKE '%' || REPLACE(rm.captures[1], ',', '') || '%'
        AND COALESCE(ai.description, '') NOT ILIKE '%' || rm.captures[1] || '%'
        AND COALESCE(ai.description, '') NOT ILIKE '%' || REPLACE(rm.captures[1], ',', '') || '%'
        AND COALESCE(ai.title, '') NOT ILIKE '%' || rm.captures[1] || '%'
        AND COALESCE(ai.title, '') NOT ILIKE '%' || REPLACE(rm.captures[1], ',', '') || '%'
        AND COALESCE(ai.plain_language_summary, '') NOT ILIKE '%' || rm.captures[1] || '%'
        AND COALESCE(ai.plain_language_summary, '') NOT ILIKE '%' || REPLACE(rm.captures[1], ',', '') || '%'
        AND (ai.financial_amount IS NULL
             OR ai.financial_amount::text != REPLACE(rm.captures[1], ',', ''))
        -- Rounding tolerance: cited amount within $1 of a source amount.
        -- Catches benign rounding ($13,095.78 in source -> $13,096 in
        -- explainer) without admitting larger arithmetic derivations.
        AND NOT EXISTS (
          SELECT 1
          FROM regexp_matches(
            COALESCE(mo.motion_text, '') || ' ' ||
            COALESCE(ai.description, '') || ' ' ||
            COALESCE(ai.title, '') || ' ' ||
            COALESCE(ai.plain_language_summary, ''),
            '\$\s*([0-9](?:[0-9,]*[0-9])?(?:\.[0-9]+)?)',
            'g'
          ) AS source_rm(captures)
          WHERE ABS(
            REPLACE(rm.captures[1], ',', '')::NUMERIC
            - REPLACE(source_rm.captures[1], ',', '')::NUMERIC
          ) < 1.0
        )
      ORDER BY m.meeting_date DESC
      LIMIT 20

