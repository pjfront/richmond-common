  "/reports/[meetingId]":
    "redirect target":
      query: null
      column: "static redirect to /meetings/{meetingId}#conflicts (no DB lookup)"
      sources: []
      note: "Stub page — does not render. permanentRedirect() to the canonical /meetings/[id] URL with #conflicts scroll target."

