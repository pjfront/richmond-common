# Pipeline Lineage Manifest — Richmond Common
#
# Machine-readable map of every data pipeline from external source to frontend field.
# Validated against actual code by `src/pipeline_map.py validate` and CI test.
#
# AI-maintained: Updated in the same commit as any pipeline change.
# Human-maintained: schedule descriptions and cross-boundary relationships.
#
# Structure:
#   sources      → External APIs/portals and their scraper modules
#   tables       → Database tables with upstream writers and downstream readers
#   enrichments  → Processing stages (extraction, scanning, generation)
#   queries      → Frontend query functions and the tables they read
#   rpcs         → Supabase RPC functions (server-side SQL)
#   api_routes   → Next.js API routes (bypass queries.ts)
#   pages        → Frontend routes, queries used, and visible fields
#   schedules    → Cloud workflows, cron triggers, and sources they run
#   field_map    → End-to-end: visible field → query/API → table.column → pipeline source

# ══════════════════════════════════════════════════════════════
# SOURCES — External data → scraper module → database tables
# ══════════════════════════════════════════════════════════════

sources:
  netfile:
    sync_key: netfile
    module: netfile_client.py
    external_api: "https://netfile.com/Connect2/api"
    description: "Local campaign finance — e-filed (Connect2 API) + paper-filed (PDF extraction via public portal)"
    tables_written:
      - contributions
      - donors
      - committees
      - paper_filing_zero_results
    paper_filings:
      discovery: "RSS feed at /public/list/filing/rss/{shortcut}/campaign.xml"
      documents: "/public/image/{filingId} returns PDF"
      data_dir: "src/data/paper_filings/*.json"
      extractor: "netfile_paper_extractor.py (PyMuPDF + DeepSeek tool calling, optional Kimi vision; durable idempotency via contributions + paper_filing_zero_results)"
      loader: "load_paper_filings.py (also called from sync_netfile)"
    layer: 2

  calaccess:
    sync_key: calaccess
    module: calaccess_client.py
    external_api: "https://campaignfinance.cdn.sos.ca.gov/dbwebexport.zip"
    description: "State campaign finance (PACs, IEs, ballot measures)"
    tables_written:
      - contributions
      - donors
      - committees
      - independent_expenditures
    layer: 2

  escribemeetings:
    sync_key: escribemeetings
    module: escribemeetings_scraper.py
    external_api: "https://pub-richmond.escribemeetings.com/"
    description: "Full agenda packets (City Council only)"
    tables_written:
      - documents
      - meetings
      - agenda_items
    layer: [1, 2]

  escribemeetings_minutes:
    sync_key: escribemeetings_minutes
    module: escribemeetings_scraper.py
    external_api: "https://pub-richmond.escribemeetings.com/FileStream.ashx"
    description: "Post-Meeting Minutes discovery via sequential document ID scanning"
    tables_written:
      - meetings  # updates minutes_url column
    layer: 2

  nextrequest:
    sync_key: nextrequest
    module: nextrequest_scraper.py
    external_api: "https://cityofrichmondca.nextrequest.com"
    description: "Public records / CPRA requests"
    tables_written:
      - nextrequest_requests
      - nextrequest_documents
    layer: 2

  archive_center:
    sync_key: archive_center
    module: archive_center_discovery.py
    external_api: "https://www.ci.richmond.ca.us/ArchiveCenter/"
    description: "Council minutes PDFs, resolutions, ordinances (9 AMIDs)"
    tables_written:
      - documents
    layer: 1

  form700:
    sync_key: form700
    module: form700_netfile_api.py
    external_api: "https://netfile.com/api/public/sites/api/ (portal: netfile.com/public/RICH/sei)"
    description: >
      Statement of Economic Interests (Form 700) via the NetFile SEI JSON API
      (structured schedule transactions — no PDF/LLM extraction). The old
      WebForms portal scraped by form700_scraper.py was decommissioned
      upstream ~2026-06; raw per-filing API JSON is preserved in documents.
    tables_written:
      - documents
      - form700_filings
      - economic_interests
    layer: [1, 2]

  minutes_extraction:
    sync_key: minutes_extraction
    module: batch_extract.py
    external_api: null  # Reads from documents table (Layer 1)
    description: "AI extraction of structured data from council minutes PDFs"
    reads_from:
      - documents
    tables_written:
      - extraction_runs
      - meetings
      - agenda_items
      - motions
      - votes
      - meeting_attendance
      - closed_session_items
      - public_comments
      - friendly_amendments
    layer: 2

  socrata_payroll:
    sync_key: socrata_payroll
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "City employee payroll data"
    tables_written:
      - city_employees
      - city_employee_pay
    layer: 2

  socrata_expenditures:
    sync_key: socrata_expenditures
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "City expenditure records (vendor payments)"
    tables_written:
      - city_expenditures
    layer: 2

  socrata_permits:
    sync_key: socrata_permits
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "Building permits"
    tables_written:
      - city_permits
    layer: 2

  socrata_licenses:
    sync_key: socrata_licenses
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "Business licenses"
    tables_written:
      - city_licenses
    layer: 2

  socrata_code_cases:
    sync_key: socrata_code_cases
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "Code enforcement cases"
    tables_written:
      - city_code_cases
    layer: 2

  socrata_service_requests:
    sync_key: socrata_service_requests
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "311 service requests"
    tables_written:
      - city_service_requests
    layer: 2

  socrata_projects:
    sync_key: socrata_projects
    module: socrata_client.py
    external_api: "https://www.transparentrichmond.org"
    description: "Capital projects"
    tables_written:
      - city_projects
    layer: 2

  city_contracts:
    sync_key: city_contracts
    module: pipelines/socrata.py
    external_api: "https://www.transparentrichmond.org"
    description: "Aggregated city vendor contracts for entity resolution (S26.2)"
    tables_written:
      - city_contracts
    layer: 2

  courts:
    sync_key: courts
    module: courts_scraper.py
    external_api: "https://odyportal.cc-courts.org"
    description: "Contra Costa court records (civil cases)"
    tables_written:
      - documents
      - court_records
    layer: [1, 2]

  propublica:
    sync_key: propublica
    module: propublica_client.py
    external_api: "https://projects.propublica.org/nonprofits/api/v2"
    description: "Nonprofit organization data (990 filings)"
    tables_written:
      - organizations
      - entity_links
    layer: 2

  form803_behested:
    sync_key: form803_behested
    module: fppc_form803_client.py
    external_api: "https://fppc.ca.gov/api/behested-payments/search"
    description: "FPPC Form 803 behested payment disclosures"
    tables_written:
      - behested_payments
    layer: 2

  lobbyist_registrations:
    sync_key: lobbyist_registrations
    module: lobbyist_client.py
    external_api: "https://www.ci.richmond.ca.us/DocumentCenter/View/{doc_id}"
    description: "City Clerk lobbyist registration PDFs (Municipal Code 2.54) — downloaded by Document ID, content-hashed, durably cached, and extracted through the configured Kimi vision route"
    tables_written:
      - lobbyist_document_extractions
      - lobbyist_registrations
    layer: 2

  opencorporates:
    sync_key: opencorporates
    module: opencorporates_client.py
    external_api: "https://api.opencorporates.com/v0.4/"
    description: "Business entity resolution (CA SOS data via OpenCorporates aggregator). Company search, officer lookup, entity name matching. Rate limited: 50/day, 200/month."
    tables_written:
      - business_entities
      - business_entity_officers
      - entity_name_matches
      - opencorporates_api_usage
    layer: 2

  elections:
    sync_key: elections
    module: elections_client.py
    external_api: null  # Derived/enrichment — processes existing committee+contribution data
    description: "Election cycle tracking (B.24). Derives candidate records from committee names, links contributions to election cycles."
    reads_from:
      - committees
      - contributions
      - officials
    tables_written:
      - elections
      - election_candidates
    layer: 2

  meeting_summaries:
    sync_key: meeting_summaries
    module: generate_meeting_summaries.py
    external_api: null  # Derived/enrichment — generates summaries from existing meeting data
    description: "AI-generated meeting-level narrative summaries (3-5 bullets). Runs after minutes_extraction."
    reads_from:
      - meetings
      - agenda_items
      - motions
      - votes
    tables_written:
      - meetings  # Updates meeting_summary column
    layer: 2
    uses_api: "Claude Sonnet"

  refresh_stale_minutes:
    sync_key: refresh_stale_minutes
    module: data_sync.py
    external_api: "https://www.ci.richmond.ca.us/ArchiveCenter/"
    description: "Re-downloads Archive Center minutes PDFs that may have been updated in-place (comment-only → full minutes)."
    reads_from:
      - documents
    tables_written:
      - documents  # Inserts new document rows when content changed
    layer: 1

  written_comments:
    sync_key: written_comments
    module: written_comment_extractor.py
    external_api: null  # Derived — parses emails from existing document text + eSCRIBE eComments
    description: "Extract written public comments (emails, eComments) from Archive Center PDFs and eSCRIBE meeting data (S21 Phase E). $0 API cost."
    reads_from:
      - documents
      - meetings
      - agenda_items
    tables_written:
      - public_comments
    layer: 2


# ══════════════════════════════════════════════════════════════
# TABLES — Database tables with upstream/downstream references
# ══════════════════════════════════════════════════════════════

tables:
  # ── Layer 1: Document Lake ──────────────────────────────────

  documents:
    layer: 1
    description: "Raw documents with JSONB metadata (source of truth, immutable)"
    written_by:
      sources: [archive_center, escribemeetings, form700, courts]
      enrichments: []
    read_by:
      enrichments: [minutes_extraction, form700_extraction]
      queries: []

  extraction_runs:
    layer: 1
    description: "AI extraction results linked to source documents"
    written_by:
      sources: [minutes_extraction]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  # ── Layer 2: Structured Core — Meetings ─────────────────────

  meetings:
    layer: 2
    description: "Normalized meeting records"
    written_by:
      sources: [escribemeetings, minutes_extraction]
      enrichments: [orientation_generation]
    read_by:
      enrichments: [conflict_scanning, orientation_generation, transcript_vote_extraction]
      queries: [getMeetings, getMeetingsWithCounts, getMeeting, getMeetingStats,
                getMeetingsWithFlags, getMeetingForReport, getCoalitionData,
                getCrossMeetingPatterns, getCommissionMeetings]

  agenda_items_embeddings:
    layer: 3
    description: "Sidecar holding agenda_items.embedding (migration 111). Keeps the 1536-dim vector off Layer 2 SELECTs."
    written_by:
      enrichments: [embedding_generation]
    read_by:
      rpcs: [search_hybrid, find_similar_items]

  meetings_embeddings:
    layer: 3
    description: "Sidecar holding meetings.embedding (migration 111)."
    written_by:
      enrichments: [embedding_generation]
    read_by:
      rpcs: [search_hybrid]

  officials_embeddings:
    layer: 3
    description: "Sidecar holding officials.embedding (migration 111)."
    written_by:
      enrichments: [embedding_generation]
    read_by:
      rpcs: [search_hybrid]

  motions_embeddings:
    layer: 3
    description: "Sidecar holding motions.embedding (migration 111)."
    written_by:
      enrichments: [embedding_generation]
    read_by:
      rpcs: [search_hybrid]

  agenda_items:
    layer: 2
    description: "Individual items on meeting agendas"
    written_by:
      sources: [escribemeetings, minutes_extraction]
      enrichments: [summary_generation]
    read_by:
      enrichments: [conflict_scanning, orientation_generation, summary_generation]
      queries: [getMeeting, getMeetingStats, getMeetingForReport,
                getCategoryStats, getControversialItems]

  motions:
    layer: 2
    description: "Motions made on agenda items with vote tallies (source: minutes or transcript)"
    written_by:
      sources: [minutes_extraction]
      enrichments: [vote_explainer_generation, transcript_vote_extraction]
    read_by:
      enrichments: [vote_explainer_generation]
      queries: [getMeeting, getFinancialConnectionsForOfficial,
                getAllFinancialConnectionSummaries, getCrossMeetingPatterns]

  votes:
    layer: 2
    description: "Individual roll-call votes on motions (source: minutes or transcript)"
    written_by:
      sources: [minutes_extraction]
      enrichments: [transcript_vote_extraction]
    read_by:
      enrichments: []
      queries: [getMeeting, getOfficialVotingRecord, getMeetingStats,
                getOfficialWithStats, getOfficialCategoryBreakdown,
                getCoalitionData, getCrossMeetingPatterns]

  meeting_attendance:
    layer: 2
    description: "Per-meeting attendance records for officials"
    written_by:
      sources: [minutes_extraction]
      enrichments: []
    read_by:
      enrichments: []
      queries: [getMeeting, getAttendance, getOfficialWithStats]

  closed_session_items:
    layer: 2
    description: "Closed/executive session agenda items"
    written_by:
      sources: [minutes_extraction]
      enrichments: []
    read_by:
      enrichments: []
      queries: [getMeeting]

  public_comments:
    layer: 2
    description: "Public comment records from meetings (minutes extraction + community voice transcript extraction + written comment extraction)"
    written_by:
      sources: [minutes_extraction]
      enrichments: [comment_generation, community_voice_extraction, written_comment_extraction]
    read_by:
      enrichments: [theme_extraction]
      queries: []

  community_comments:
    layer: 2
    description: "Resident-submitted discussion comments on agenda items (B.62)"
    written_by:
      sources: []
      enrichments: [community_comments_submission]
    read_by:
      enrichments: []
      # No frontend query reads this table directly — the API route
      # /api/community-comments serves both write and read traffic
      # (POST submission + GET fetch from the agenda-item detail page).
      # Removed getCommunityComments 2026-05-20 (stale entry caught by
      # the gate when it landed in CI for the first time).
      queries: []
    api_routes: ["/api/community-comments"]

  comment_themes:
    layer: 2
    description: "Substantive topic themes from public comments (S21 Community Voice)"
    written_by:
      sources: []
      enrichments: [theme_extraction]
    read_by:
      enrichments: []
      queries: []

  comment_theme_assignments:
    layer: 2
    description: "Many-to-many: public comment ↔ theme (S21 Community Voice)"
    written_by:
      sources: []
      enrichments: [theme_extraction]
    read_by:
      enrichments: []
      queries: []

  item_theme_narratives:
    layer: 2
    description: "Per-item AI narrative summaries of theme clusters (S21 Community Voice)"
    written_by:
      sources: []
      enrichments: [theme_extraction]
    read_by:
      enrichments: []
      queries: []

  friendly_amendments:
    layer: 2
    description: "Amendments proposed to motions"
    written_by:
      sources: [minutes_extraction]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  # ── Layer 2: Structured Core — Officials ────────────────────

  officials:
    layer: 2
    description: "Elected officials and appointed members"
    written_by:
      sources: []
      enrichments: [bio_generation, commission_seeding]
    read_by:
      enrichments: [conflict_scanning, bio_generation]
      queries: [getOfficials, getOfficialBySlug, getOfficialWithStats,
                getCoalitionData, getCrossMeetingPatterns,
                getAllFinancialConnectionSummaries]

  # ── Layer 2: Structured Core — Finance ──────────────────────

  contributions:
    layer: 2
    description: "Campaign contributions (NetFile local + CAL-ACCESS state). contributor_type classification (corporate/union/individual/pac_ie/other) via contributor_classifier.py"
    written_by:
      sources: [netfile, calaccess]
      enrichments: [contributor_classification, donor_employer_merge, donor_dedup, paper_filing_reconciliation]
    read_by:
      enrichments: [conflict_scanning, filing_period_briefing_generation, donor_employer_merge, donor_dedup, paper_filing_reconciliation]
      queries: [getOfficialContributions, getMeetingStats, getFinancialConnectionsForOfficial,
                getAllFinancialConnectionSummaries, getCrossMeetingPatterns]

  donors:
    layer: 2
    description: "Normalized donor records with aggregated stats"
    written_by:
      sources: [netfile, calaccess]
      enrichments: [donor_classification, donor_employer_merge]
    read_by:
      enrichments: [conflict_scanning, filing_period_briefing_generation, donor_employer_merge, donor_dedup, donor_classification]
      queries: [getOfficialContributions, getOrgList, getOrgBySlug]

  committees:
    layer: 2
    description: "Political committees linked to candidates"
    written_by:
      sources: [netfile, calaccess]
      enrichments: []
    read_by:
      enrichments: [filing_period_briefing_generation]
      queries: [getOfficialContributions, getCrossMeetingPatterns]

  independent_expenditures:
    layer: 2
    description: "Independent expenditure records (CAL-ACCESS)"
    written_by:
      sources: [calaccess]
      enrichments: []
    read_by:
      enrichments: [conflict_scanning]
      queries: [getPACIndependentExpenditures]

  elections:
    layer: 2
    description: "Election cycles with dates, types, jurisdictions (B.24)"
    written_by:
      sources: [elections]
      enrichments: []
    read_by:
      enrichments: []
      queries: [getElections, getElectionWithCandidates]

  election_candidates:
    layer: 2
    description: "Candidate registrations per election, linked to officials and committees (B.24)"
    written_by:
      sources: [elections]
      enrichments: []
    read_by:
      enrichments: [filing_period_briefing_generation]
      queries: [getElectionWithCandidates, getElectionFundraisingSummary]

  filing_period_briefings:
    layer: 2
    description: "Structured campaign-finance briefings — one row per (city, election, filing period). Sections F1..F9 are tier-graded per signal-significance-spec; renderer slices for per-candidate vs cross-candidate views (Stream 2 of 2026-04-28 plan)"
    written_by:
      sources: []
      enrichments: [filing_period_briefing_generation]
    read_by:
      enrichments: []
      queries: [getFilingPeriodBriefing]

  form700_filings:
    layer: 2
    description: "Form 700 filing metadata (annual/assuming/leaving)"
    written_by:
      sources: [form700]
      enrichments: []
    read_by:
      enrichments: [conflict_scanning]
      queries: [getForm700Filings]

  economic_interests:
    layer: 2
    description: "Individual economic interest entries from Form 700"
    written_by:
      sources: [form700]
      enrichments: []
    read_by:
      enrichments: [conflict_scanning]
      queries: [getEconomicInterests]

  # ── Layer 2: Structured Core — Conflict Detection ───────────

  conflict_flags:
    layer: 2
    description: "Detected conflict-of-interest flags with confidence scores"
    written_by:
      sources: []
      enrichments: [conflict_scanning]
    read_by:
      enrichments: [comment_generation]
      queries: [getConflictFlags, getMeetingsWithFlags, getConflictFlagsDetailed,
                getFinancialConnectionsForOfficial, getAllFinancialConnectionSummaries,
                getMeetingStats]

  scan_runs:
    layer: 2
    description: "Scan execution metadata (mode, timing, flag counts)"
    written_by:
      sources: []
      enrichments: [conflict_scanning]
    read_by:
      enrichments: []
      queries: []

  # ── Layer 2: Structured Core — Public Records ───────────────

  nextrequest_requests:
    layer: 2
    description: "CPRA/public records requests"
    written_by:
      sources: [nextrequest]
      enrichments: []
    read_by:
      enrichments: []
      queries: [getPublicRecordsStats, getDepartmentCompliance, getRecentRequests]

  nextrequest_documents:
    layer: 2
    description: "Documents attached to public records requests"
    written_by:
      sources: [nextrequest]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  # ── Layer 2: Structured Core — Topics ──────────────────────

  topics:
    layer: 2
    description: "Dynamic civic topics (seeded from local issues, enriched by LLM)"
    written_by:
      sources: []
      enrichments: [topic_tagging]
    read_by:
      enrichments: [topic_tagging]
      queries: []

  item_topics:
    layer: 2
    description: "Junction: agenda items ↔ topics (many-to-many)"
    written_by:
      sources: []
      enrichments: [topic_tagging]
    read_by:
      enrichments: []
      queries: []

  # ── Layer 2: Structured Core — Commissions ──────────────────

  commissions:
    layer: 2
    description: "Commission/board metadata"
    written_by:
      sources: []
      enrichments: [commission_seeding]
    read_by:
      enrichments: []
      queries: [getCommissions, getCommission]

  commission_members:
    layer: 2
    description: "Commission member rosters with terms"
    written_by:
      sources: []
      enrichments: [commission_seeding]
    read_by:
      enrichments: []
      queries: [getCommissions, getCommission]

  bodies:
    layer: 2
    description: "Canonical body names (council, commissions, boards)"
    written_by:
      sources: []
      enrichments: [commission_seeding]
    read_by:
      enrichments: [orientation_generation]
      queries: [getCommissionMeetings]

  neighborhood_councils:
    layer: 2
    description: "Neighborhood council/HOA registry with meeting info and GeoJSON mapping"
    written_by:
      sources: []
      enrichments: [neighborhood_council_seeding]
    read_by:
      enrichments: []
      queries: [getNeighborhoodCouncils]

  # ── Layer 2: Structured Core — Socrata Open Data ────────────

  city_employees:
    layer: 2
    description: "City employee records from Socrata payroll"
    written_by:
      sources: [socrata_payroll]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  city_employee_pay:
    layer: 2
    description: "Employee compensation details"
    written_by:
      sources: [socrata_payroll]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  city_expenditures:
    layer: 2
    description: "City vendor payments from Socrata"
    written_by:
      sources: [socrata_expenditures]
      enrichments: []
    read_by:
      enrichments: [conflict_scanning]
      queries: []

  city_permits:
    layer: 2
    description: "Building permits from Socrata"
    written_by:
      sources: [socrata_permits]
      enrichments: []
    read_by:
      enrichments: [conflict_scanning]
      queries: []

  city_licenses:
    layer: 2
    description: "Business licenses from Socrata"
    written_by:
      sources: [socrata_licenses]
      enrichments: []
    read_by:
      enrichments: [conflict_scanning]
      queries: []

  city_code_cases:
    layer: 2
    description: "Code enforcement cases from Socrata"
    written_by:
      sources: [socrata_code_cases]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  city_service_requests:
    layer: 2
    description: "311 service requests from Socrata"
    written_by:
      sources: [socrata_service_requests]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  city_projects:
    layer: 2
    description: "Capital projects from Socrata"
    written_by:
      sources: [socrata_projects]
      enrichments: []
    read_by:
      enrichments: []
      queries: []

  city_contracts:
    layer: 2
    description: "Aggregated city vendor contracts with entity matching (S26.2)"
    written_by:
      sources: [city_contracts]
      enrichments: []
    read_by:
      enrichments: [entity_resolution]
      queries: []

