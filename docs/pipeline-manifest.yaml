# ══════════════════════════════════════════════════════════════
# SCHEDULES — Cloud workflows and their triggers
# ══════════════════════════════════════════════════════════════

schedules:
  cloud-pipeline.yml:
    description: "Full meeting pipeline: scrape → scan → comment → generate"
    triggers:
      - type: cron
        schedule: "0 6 * * 1"  # Monday 6am UTC (Sunday 10pm Pacific)
        description: "Weekly pre-meeting pipeline"
      - type: cron
        schedule: "0 8 1 1,4,7,10 *"  # Quarterly
        description: "Quarterly retrospective scan"
      - type: repository_dispatch
        description: "Repository-owner-only typed trusted-main prospective run for at most one validated meeting date"
    sources_triggered: [escribemeetings]
    enrichments_triggered: [conflict_scanning, comment_generation,
                            summary_generation, vote_explainer_generation]

  data-sync.yml:
    description: "Scheduled data source syncs (4-tier cadence)"
    triggers:
      - type: cron
        schedule: "30 7 * * *"  # Daily 7:30am UTC
        description: "Daily: nextrequest (CPRA compliance), escribemeetings, escribemeetings_minutes, minutes_extraction (with --enrich cascade), archive_center, written_comments"
      - type: cron
        schedule: "0 8 * * 1"  # Monday 8am UTC
        description: "Weekly: archive_center, refresh_stale_minutes, minutes_extraction, written_comments, meeting_summaries, escribemeetings, escribemeetings_minutes, netfile, nextrequest, socrata_expenditures, socrata_payroll, then the bounded-by-source enrichment sweep"
      - type: cron
        schedule: "0 9 15 * *"  # 15th of month 9am UTC
        description: "Monthly: calaccess, socrata_permits, socrata_licenses, socrata_code_cases, socrata_service_requests, socrata_projects"
      - type: cron
        schedule: "0 10 1 1,4,7,10 *"  # Quarterly 10am UTC
        description: "Quarterly: form700, form803_behested, lobbyist_registrations, propublica"
      - type: repository_dispatch
        description: "Typed sync-data event from the in-repo change detector using its run-scoped GITHUB_TOKEN"
      - type: repository_dispatch
        description: "Repository-owner-only operator-sync-data event for bounded-window eSCRIBE or a required 1-100 item minutes slice; no bulk source or enrichment cascade"
    sources_triggered: [netfile, calaccess, escribemeetings, escribemeetings_minutes,
                        nextrequest, archive_center, refresh_stale_minutes,
                        minutes_extraction, written_comments, meeting_summaries, form700,
                        form803_behested, lobbyist_registrations, propublica,
                        socrata_payroll, socrata_expenditures, socrata_permits,
                        socrata_licenses, socrata_code_cases,
                        socrata_service_requests, socrata_projects]

  change-detector.yml:
    description: "Near-live source change detection (15-min polling)"
    triggers:
      - type: cron
        schedule: "3,18,33,48 * * * *"  # Every 15 minutes
        description: "Poll external sources for changes"
      - type: repository_dispatch
        description: "Repository-owner-only trusted-main operator-source-change-check event; read-only and requires dry_run=true, with an optional validated source"
    sources_triggered: [escribemeetings, netfile, socrata_expenditures, socrata_payroll,
                        socrata_permits, socrata_licenses, socrata_code_cases,
                        socrata_service_requests, socrata_projects,
                        nextrequest, calaccess]
    enrichments_triggered: [topic_tagging, summary_generation, conflict_scanning,
                            meeting_summary_generation, orientation_generation,
                            recap_generation, vote_explainer_generation, theme_extraction,
                            embedding_generation, proceeding_classification]
    notes: "Dispatches to data-sync.yml with enrich=true using the run-scoped GITHUB_TOKEN when changes are detected. Stdlib-only Python, no pip install."

  data-quality.yml:
    description: "Data quality checks"
    triggers:
      - type: cron
        schedule: "0 7 * * *"  # Daily 7am UTC
        description: "Daily quality check"
      - type: cron
        schedule: "0 12 * * 5"  # Friday noon UTC
        description: "Weekly deep quality check"
      - type: repository_dispatch
        description: "Repository-owner-only typed trusted-main read-only quality check with an empty payload; runs only the two quality reports, never self-assessment, LLM calls, or decision writes"
    sources_triggered: []
    enrichments_triggered: []

  email-delivery.yml:
    description: "Bounded recovery of due welcome, orientation, recap, and digest deliveries"
    triggers:
      - type: cron
        schedule: "17 */4 * * *"
        description: "Resolve at most 50 total due email deliveries through the dedicated recovery endpoint"
      - type: repository_dispatch
        description: "Typed trusted-main bounded retry"
    sources_triggered: []
    enrichments_triggered: []

  subscriber-weekly-digest.yml:
    description: "Canary gate for the completed-week subscriber digest"
    triggers:
      - type: repository_dispatch
        description: "Typed trusted-main operator canary; cannot broadcast and has no schedule before canary approval"
    sources_triggered: []
    enrichments_triggered: []

  post-meeting-recap.yml:
    description: "Generate the post-meeting transcript recap from KCRT/YouTube with official Granicus fallback"
    triggers:
      - type: cron
        schedule: "17 15 * * *"
        description: "Check yesterday's regular council meeting and require a transcript recap"
      - type: repository_dispatch
        description: "Repository-owner-only typed trusted-main bounded run for one validated meeting date and optional video ID; forced regeneration is unavailable"
    sources_triggered: []
    enrichments_triggered: [recap_generation]
    notes: "Reads data/transcripts/{date}_clean.txt plus its source sidecar. The command exits nonzero when neither recording path leaves meetings.transcript_recap, which routes through operational-failure-alert.yml."

  self-assessment.yml:
    description: "System health and self-assessment"
    triggers:
      - type: cron
        schedule: "0 7 * * *"  # Daily 7am UTC
        description: "Daily health check"
      - type: cron
        schedule: "0 12 * * 5"  # Friday noon UTC
        description: "Weekly deep assessment"
      - type: workflow_dispatch
        description: "Manual trigger"
    sources_triggered: []
    enrichments_triggered: []

  test.yml:
    description: "Pytest CI on pull requests"
    triggers:
      - type: pull_request
        description: "Runs on PR to main"
    sources_triggered: []
    enrichments_triggered: []


# ══════════════════════════════════════════════════════════════
# RPCS — Supabase server-side SQL functions
# ══════════════════════════════════════════════════════════════

rpcs:
  get_meeting_counts:
    migration: "038"
    reads_from: [meetings, agenda_items, motions, votes]
    returns: "{meeting_id, agenda_item_count, vote_count, categories[]}"
    used_by_queries: [getMeetingsWithCounts, getCommissionMeetings]

  get_category_stats:
    migration: "085"
    reads_from: [agenda_items, motions, votes]
    returns: "{category, item_count, vote_count, split_vote_count, unanimous_vote_count, avg_controversy_score, total_public_comments, percentage_of_agenda}"
    used_by_queries: [getCategoryStats]
    notes: "Controversy weights: 85% comments, 10% vote split, 5% motions. Uses agenda_items.public_comment_count (fixed in 085)"

  get_controversial_items:
    migration: "085"
    reads_from: [agenda_items, motions, votes]
    returns: "{agenda_item_id, meeting_id, meeting_date, item_number, title, category, controversy_score, vote_tally, result, public_comment_count, motion_count}"
    used_by_queries: [getControversialItems]
    notes: "Sort: comment count DESC, vote split DESC, motions DESC. Uses agenda_items.public_comment_count (fixed in 085)"

  get_contested_votes:
    migration: "038"
    reads_from: [votes, motions, agenda_items, meetings]
    returns: "{motion_id, official_id, official_name, vote_choice, category}"
    used_by_queries: [getCoalitionData]
    notes: "Migration 103 added optional p_official_ids UUID[]. When provided, votes are pre-filtered to those officials in SQL and contestedness re-evaluated within the subset, keeping the response under PostgREST's 10K-row cap."

  get_divergent_motions_detail:
    migration: "096"
    reads_from: [votes, motions, agenda_items, meetings]
    returns: "{motion_id, motion_text, motion_result, vote_tally, meeting_id, meeting_date, agenda_item_id, agenda_item_title, agenda_item_number, category, topic_label, is_procedural, official_id, official_name, vote_choice} — per-(motion, official) rows for every contested motion. Frontend groups by motion_id."
    used_by_queries: [getDivergentMotions]
    notes: "Migration 103 added optional p_official_ids UUID[]. When provided, votes are pre-filtered to those officials in SQL and contestedness re-evaluated within the subset, keeping the response under PostgREST's 10K-row cap."

  get_meeting_coverage_stats:
    migration: "038"
    reads_from: [meetings, agenda_items, motions, votes, meeting_attendance]
    returns: "meeting coverage aggregation"
    used_by_queries: []
    used_by_api_routes: ["/api/data-quality"]

  list_public_tables:
    migration: "104"
    reads_from: []
    returns: "{table_name TEXT} for every public-schema table"
    used_by_queries: []
    used_by_api_routes: ["/api/health"]
    notes: "Replaces 18 sequential SELECT * LIMIT 0 probes that the health route ran per call. Falls back to per-table probe if RPC missing on a given environment. Added 2026-05-06 to address Supabase I/O quota pause."

  search_site:
    migration: "143"
    reads_from: [meetings, agenda_items, officials, motions]
    returns: "full-text search results"
    used_by_queries: [searchSite, searchHybrid]
    notes: "Migration 143 preserves the public signature while bounding inputs, filtering retired/cancelled records, and materializing a GIN-backed candidate set before ranking."

  search_hybrid:
    migration: "143"
    reads_from: [meetings, agenda_items, officials, motions]
    returns: "hybrid FTS + vector search results via RRF"
    used_by_queries: [searchHybrid]
    notes: "Migration 143 preserves the public signature while bounding inputs and materializing bounded FTS/vector candidates before reciprocal-rank fusion."

  find_similar_items:
    migration: "143"
    reads_from: [agenda_items, meetings, motions]
    returns: "cosine similarity nearest neighbors for agenda items"
    used_by_queries: [findSimilarItems]
    notes: "Migration 143 caps results at 10, excludes retired/cancelled records, and uses the halfvec HNSW expression index for the bounded candidate set."

  get_official_voting_record:
    migration: "144"
    reads_from: [votes, motions, agenda_items, meetings]
    returns: "flat display-ready council voting rows with split-vote marker"
    used_by_queries: [getOfficialVotingRecord]
    notes: "Replaces the nested PostgREST voting payload; filters cancelled meetings and retired agenda sources at the database boundary."

  get_meeting_flag_counts:
    migration: "053"
    reads_from: [conflict_flags, agenda_items, meetings]
    returns: "{meeting_id, flags_total, flags_published, items_scanned}"
    used_by_queries: [getMeetingFlagCounts]
    notes: "Server-side aggregation to avoid 17K+ JSONB rows hitting anon's 3s timeout. Filters government-entity vendor/employer matches. See src/migrations/053_flag_count_rpc.sql."


