  "/meetings/[id]/items/[itemNumber]":
    description: "Agenda item detail — full item with comments, votes, related items"
    queries: [getAgendaItemDetail]

  "/meetings/category/[slug]":
    description: "Category drill-through — all agenda items in a category"
    queries: [getAgendaItemsByCategory]

  "/meetings/most-discussed":
    description: "Most contentious agenda items by controversy score (top public testimony)"
    queries: [getControversialItems]
