  "/elections/[slug]":
    "election by slug":
      query: getElectionBySlug
      column: "elections.* by year+type slug"
      sources: [elections]

    "candidates with fundraising":
      query: getElectionWithCandidates
      column: "elections + election_candidates joined"
      sources: [elections]

    "candidate fundraising detail":
      query: getCandidateFundraisingDetails
      column: "election_candidates + contributions + committees"
      sources: [elections, netfile, calaccess]

    "candidate top donors":
      query: getCandidateTopDonors
      column: "contributions + donors aggregated per candidate (top N by total)"
      sources: [netfile, calaccess]

    "candidate contribution breakdown":
      query: getCandidateContributionBreakdown
      column: "contributions partitioned by amount band and source type"
      sources: [netfile, calaccess]

  # ── Candidate Detail (/elections/[slug]/candidates/[name]) ──

  "/elections/[slug]/candidates/[name]":
    "candidate election context":
      query: getElectionBySlug
      column: "elections.* (date, type, name)"
      sources: [elections]

    "candidate fundraising":
      query: getCandidateFundraisingDetails
      column: "election_candidates + contributions + committees joined"
      sources: [elections, netfile, calaccess]

    "candidate filing-period briefing":
      query: getFilingPeriodBriefing
      column: "filing_period_briefings.sections (F1 totals, F2 geography, F3 industry/PAC, F4 self/related-party)"
      sources: [netfile, calaccess]

    "candidate official voting stats":
      query: getOfficialWithStats
      column: "officials + votes + meeting_attendance aggregated"
      sources: [minutes_extraction]

    "full candidate donors":
      query: getFullCandidateDonors
      column: "contributions + donors partitioned by election cycle"
      sources: [netfile, calaccess]
      note: "Filters out government-entity donors (city/county/state pattern)"

    "most-commented candidate votes":
      query: getMostCommentedVotes
      column: "votes + motions + agenda_items + meetings + comment_themes joined"
      sources: [minutes_extraction, escribemeetings]
      enrichment: theme_extraction

    "majority alignment stats":
      query: computeAlignmentStats
      column: "votes.vote_choice vs majority on each motion"
      sources: [minutes_extraction]
      note: "Computed client-side fallback when bio_factual is null"

  # ── Subscribe Landing (/subscribe) ──────────────────────────

  "/subscribe":
    "subscription form":
      api_route: "/api/subscribe"
      column: email_subscribers.email
      note: "Email signup form — POST writes to email_subscribers; GET handles unsubscribe token"

    "preferences picker":
      api_route: "/api/subscribe/preferences"
      column: email_preferences.*
      note: "Post-subscribe topic/district/candidate picker"

  # ── Manage Subscription (/subscribe/manage) ─────────────────

  "/subscribe/manage":
    "subscriber officials":
      query: getOfficials
      column: officials.name
      sources: []
      enrichment: commission_seeding

    "upcoming election context":
      query: getUpcomingElection
      column: elections.election_date
      sources: [elections]

    "candidate follow options":
      query: getElectionWithCandidates
      column: "elections + election_candidates"
      sources: [elections]

    "preferences read/write":
      api_route: "/api/subscribe/preferences"
      column: email_preferences.*
      note: "User-specific prefs accessed via signed token"

  # ── PAC Index (/pac) — operator-only V1 ─────────────────────

  "/pac":
    "PAC list with cycle bars":
      query: getPACListWithCycleBars
      column: "committees + contributions + donors aggregated per PAC across 5 election cycles"
      sources: [netfile, calaccess]
      note: "Bulk variant of getPACList that includes per-row sparkline data, replaces N+1 calls."

  # ── PAC Profile (/pac/[slug]) — operator-only V1 ────────────

  "/pac/[slug]":
    "PAC profile by slug":
      query: getPACBySlug
      column: "committees.* (name, filer_id) by slug"
      sources: [netfile, calaccess]

    "PAC list (slug resolution)":
      query: getPACList
      column: "committees + contributions aggregates used for slug lookup + sibling navigation"
      sources: [netfile, calaccess]

    "PAC incoming contributions":
      query: getPACContributions
      column: "contributions + donors INTO this committee"
      sources: [netfile, calaccess]

    "PAC outgoing flows":
      query: getPACOutgoing
      column: "contributions + donors + committees where this PAC appears as donor on another committee's filing"
      sources: [netfile, calaccess]
      note: "Variant-name matching across normalized forms; word-reordered names need entity resolution (S26)."

    "PAC flow matrix":
      query: getPACFlowMatrix
      column: "donors x candidates conduit matrix via per-cycle proportional attribution"
      sources: [netfile, calaccess]
      note: "Powers the V2 Explore layer (top 20 donors x top 12 candidates by default); returns null when sparse."

    "PAC per-cycle bars (single PAC)":
      query: getPACCycleBars
      column: "contributions + donors aggregated per election cycle for one PAC (in + out)"
      sources: [netfile, calaccess]
      note: "Single-PAC variant of the cycle-bars data. used_by reflects intent for the V2 temporal layer; not yet imported by any page.tsx as of the manifest's last verification."


# ══════════════════════════════════════════════════════════════
