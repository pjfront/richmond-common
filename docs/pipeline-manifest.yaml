# ══════════════════════════════════════════════════════════════
# ENRICHMENTS — Processing stages that transform data
# ══════════════════════════════════════════════════════════════

enrichments:
  minutes_extraction:
    module: batch_extract.py
    description: "AI extraction of structured meeting data from raw PDFs"
    reads_from: [documents]
    writes_to: [extraction_runs, meetings, agenda_items, motions, votes,
                meeting_attendance, closed_session_items, public_comments,
                friendly_amendments]
    uses_api: "Claude Sonnet"
    cost_per_unit: "$0.06/meeting"

  # form700_extraction: standalone script, not in SYNC_SOURCES (uses form700 source sync key)
  # contributor_classification: standalone script, not in SYNC_SOURCES

  topic_tagging:
    module: topic_tagger.py
    description: "Keyword-based topic assignment for agenda items (14 Richmond local issues)"
    reads_from: [agenda_items, topics]
    writes_to: [item_topics]

  conflict_scanning:
    module: conflict_scanner.py
    description: "Multi-signal conflict-of-interest detection"
    reads_from: [meetings, meeting_attendance, agenda_items, contributions,
                 economic_interests, city_expenditures, independent_expenditures,
                 city_permits, city_licenses]
    writes_to: [conflict_flags, scan_runs]
    depends_on: [paper_filing_reconciliation]
    signal_detectors:
      - campaign_contribution
      - form700_property
      - form700_income
      - donor_vendor_expenditure
      - temporal_correlation

  # comment_generation: standalone script, not in SYNC_SOURCES
  # community_voice_extraction: standalone script, not in SYNC_SOURCES
  # written_comment_extraction: standalone script, not in SYNC_SOURCES (uses written_comments source sync key)

  theme_extraction:
    module: theme_extractor.py
    description: "Cluster public comments by substantive theme with narrative summaries (S21 Phase B)"
    reads_from: [public_comments, agenda_items]
    writes_to: [comment_themes, comment_theme_assignments, item_theme_narratives]
    uses_api: "Claude Sonnet"
    prompt: "prompts/theme_extraction_system.txt"
    status: active

  summary_generation:
    module: generate_summaries.py
    description: "Plain-language agenda item summaries and headlines"
    reads_from: [agenda_items, item_topics]  # item_topics: backfill_topic_labels seeds topic_label from curated topics before LLM
    writes_to: [agenda_items]  # Updates plain_language_summary + summary_headline + topic_label columns
    depends_on: [topic_tagging]
    uses_api: "Claude Sonnet"
    batch_runner: batch_summarize.py  # R1 bulk regeneration via Batch API

  meeting_summary_generation:
    module: generate_meeting_summaries.py
    description: "Meeting-level 3-5 bullet narrative summaries"
    reads_from: [meetings, agenda_items, motions, votes]
    writes_to: [meetings]  # Updates meeting_summary column
    depends_on: [summary_generation, transcript_vote_extraction]
    uses_api: "Claude Sonnet"

  orientation_generation:
    module: generate_orientation_previews.py
    description: "Pre-meeting orientation narrative (3-5 paragraphs, forward-looking)"
    reads_from: [meetings, bodies, agenda_items]
    writes_to: [meetings]  # Updates orientation_preview column
    depends_on: []
    uses_api: "Direct DeepSeek V4 Pro"
    notes: "No vote gate — generates only from bounded, source-closest official agenda item titles and descriptions, not AI-generated item summaries or topic labels. Automatic selectors are limited to noncancelled upcoming regular Richmond City Council meetings in a 14-day window, with at most 10 candidates per run. Once generated, an eligible upcoming regular City Council preview can be delivered to active subscribers by /api/email/send-orientation (idempotent via meetings.orientation_emailed_at)."

  recap_generation:
    module: generate_meeting_recaps.py
    description: "Post-meeting narrative recap (4-6 paragraphs, decisions + votes + public voice)"
    reads_from: [meetings, agenda_items, motions, votes, public_comments, item_theme_narratives, comment_themes]
    writes_to: [meetings]  # Updates meeting_recap column
    depends_on: [summary_generation, theme_extraction, transcript_vote_extraction]
    uses_api: "Direct DeepSeek V4 Pro"
    scheduled_orchestrator: post_meeting_recap.py
    source_closest_file_inputs: ["data/transcripts/{date}_clean.txt", "data/transcripts/{date}_source.json"]
    notes: "Vote gate required (same as meeting_summary_generation). Includes split-vote callouts, theme narratives, consent calendar, continued items. The scheduled orchestrator separately writes transcript_recap from the cleaned recording transcript: KCRT/YouTube first, official Granicus fallback. It carries the actual collector into transcript_recap_source and structured recording provenance, and fails if neither path leaves a recap."

  filing_period_briefing_generation:
    module: filing_period_briefing.py
    description: "Per-filing-period structured campaign-finance briefing (F1 totals, F2 geography, F3 industry/PAC, F4 self/related-party; F5–F9 land in follow-on commits). Mirrors recap_generation in shape; the natural cadence event is filing close, not meeting end."
    reads_from: [contributions, donors, committees, election_candidates, elections]
    writes_to: [filing_period_briefings]
    depends_on: [paper_filing_reconciliation]
    notes: "Reads source-closest contribution rows (no derivative aggregates). Sections are tier-graded per signal-significance-spec — F5/F9 default to Tier C (operator-only) until reviewed; framing-sensitive per docs/research/financial-disclosure-framing.md."
    status: skeleton  # F1–F4 implemented; F5–F9 stubs

  donor_employer_merge:
    module: data_sync.py  # implemented as sync_donor_employer_merge wrapping merge_donor_employers
    description: "Collapse same-name donor rows whose employer strings are near-equivalent (NULL/N/A/None/Not employed/retired/...). Auto-runs after netfile sync via --enrich so fresh contributions don't accumulate employer-key fragmentation. Three rules: all-empty, empty+specific, substring-of (>= 4 chars or word-subset)."
    reads_from: [donors, contributions, entity_links]
    writes_to: [donors, contributions, entity_links]
    notes: "Idempotent — re-running on a clean DB is a no-op. Conservative on purpose: same-name-different-specific-employers (e.g. two John Smiths at Chevron and SEIU) are NOT merged. Long-term fix for those is B.46 entity_id JOIN."

  donor_dedup:
    module: data_sync.py  # implemented as sync_donor_dedup wrapping dedup_contributions
    description: "Drop cross-filing duplicate contributions. Catches the 'same gift filed twice' pattern: California Form 497 is filed by both donor (Part 2) and recipient (Part 1), producing two near-date contribution rows that slip past the standard ON CONFLICT key. Auto-runs AFTER donor_employer_merge so cross-filing pairs match by collapsed donor_id."
    reads_from: [contributions, donors]
    writes_to: [contributions]
    depends_on: [donor_employer_merge]
    notes: "±14-day window. Keeper is the EARLIER-dated row (closer to actual transaction date — donor's Form 497 Part 2 is filed when money was sent; recipient's Part 1 when it cleared). See dedup_contributions._choose_keeper for the full rationale."

  paper_filing_reconciliation:
    module: load_paper_filings.py  # implemented as sync_paper_filing_reconciliation wrapping reconcile_paper_filings_to_forms
    description: "Synthesize one 'Unitemized contributions' row per Form 460 filing whose form_summary indicates a gap between the candidate's reported cover-page total and our extracted itemized rows. Makes DB cycle-to-date totals match Form 460 cover Line 5 — the canonical ground truth (the candidate's own legal certification of what they raised). Runs AFTER donor_dedup so the DB period totals reflect post-cleanup state."
    reads_from: [contributions, donors, committees, form_summary_cache]
    writes_to: [contributions]
    depends_on: [donor_dedup]
    notes: "Idempotent — drops all entity_code='UNI' rows for the city before inserting new ones. Reads form_summary_cache (DB-backed since migration 114; was file-only at src/data/form_summaries.json and silently broke on ephemeral cloud runners after Form 460s aged out of the 15-day RSS window — see D50 in AI-PARKING-LOT for the 2026-05-16 incident). If DB period total exceeds form total, no synthesis (logs a warning — possible OCR over-extraction or cross-filing duplication that donor_dedup missed)."

  donor_classification:
    module: donor_classifier.py
    description: "Classify donor entity type (person/union/corporation/committee/other_org) using name-pattern heuristics from contributor_classifier.py. Writes entity_type and entity_slug to donors table. Idempotent — only touches entity_type IS NULL rows."
    reads_from: [donors]
    writes_to: [donors]
    depends_on: [donor_employer_merge]

  apify_entity_resolution:
    module: apify_entity_resolution.py
    description: "Resolve entity-type donors (corporation/union/committee/other_org) against CA SOS bizfile via Apify parseforge/sos-scraper actor. Idempotent — skips donors already matched in entity_name_matches."
    reads_from: [donors]
    writes_to: [business_entities, entity_name_matches]
    depends_on: [donor_classification]
    cascade_enabled: false  # separately priced; run explicitly with --source after operator review
    uses_api: "Apify parseforge/sos-scraper"
    cost_per_unit: "~$0.008/name (~$8/1000 results)"

  transcript_vote_extraction:
    module: extract_transcript_votes.py
    description: "Preliminary motions+votes extracted from raw auto-caption transcripts (closes the 4-6 week minutes lag)"
    reads_from: [meetings, agenda_items, officials]
    writes_to: [motions, votes]  # Inserts source='transcript' rows; superseded when minutes arrive
    uses_api: "Claude Sonnet"
    notes: |
      Reads raw auto-captioned transcripts from data/transcripts/{date}_clean.txt
      when available (preferred), falling back to meetings.transcript_recap
      otherwise. Entry 50 (2026-04-26): the recap-only flow missed substantive
      votes — the 3/17 Flock 4-3 vote was extracted only after switching to raw.

      Cost: ~$0.20-0.30/meeting on raw transcripts (~88K input tokens for a
      typical 4hr meeting); ~$0.05 on recap fallback. Temperature=0 for
      deterministic extraction.

      Long-transcript safety net: if a raw-transcript pass returns 0 motions
      AND a recap is available, the script automatically retries against the
      recap. Observed 4/07 failure: 354K-char raw transcript reliably
      returned no motions despite a clear unanimous roll call; the smaller
      curated recap surfaced all three substantive votes.

      Idempotent: in the incremental path, skips meetings that already
      have ANY motions (transcript- or minutes-sourced). Until 2026-05-04
      this was filtered only by source='minutes', which meant every
      `--enrich` pass re-extracted the same backlog of post-recap-pre-
      minutes meetings from scratch — paying the full Claude API cost
      to DELETE+re-INSERT the same rows. Use sync_type='full' (CLI:
      --force) to opt back into regeneration after a prompt change.
      When minutes_extraction later inserts source='minutes' rows, it
      deletes the existing source='transcript' rows for the same
      agenda_item first (see db.py::save_meeting_data), restoring
      eligibility for one final pass. Frontend surfaces an amber
      "Tentative — auto-captioned recording" badge for source='transcript'
      motions (VoteRollCall.tsx).

  transcript_windowing:
    module: window_meeting_transcript.py
    description: "Per-agenda-item discussion windows from raw auto-caption transcripts (input for the structured 5-field vote_explainer)"
    reads_from: [meetings, agenda_items]
    writes_to: []  # File artifact: data/transcripts/{date}_windows.json
    uses_api: "Claude Sonnet"
    notes: |
      Single Claude pass over data/transcripts/{date}_clean.txt (the
      source-closest persisted artifact) returns per-item start/end
      [H:MM:SS] timestamp markers. Python deterministically slices the
      source file on those markers and writes
      data/transcripts/{date}_windows.json. The LLM never emits
      transcript content during the windowing step — only marker
      strings — so source-closest discipline is preserved end-to-end.

      Cost: ~$0.20-0.30/meeting, one-time per transcript. Temperature=0
      for deterministic windowing. Validation on 2026-04-28: 7 windows
      at 0.95 confidence, 0 invalid markers.

      Downstream consumer: generate_structured_vote_explainer() reads
      the per-item window from data/transcripts/{date}_windows.json
      when generating the_other_side field. When no window is present,
      the_other_side defaults to null (no fabrication).

  comment_summary_generation:
    module: generate_comment_summaries.py
    description: "2-3 sentence AI synthesis of public testimony per agenda item"
    reads_from: [agenda_items, public_comments, item_theme_narratives, comment_themes, meetings]
    writes_to: [agenda_items]  # Updates comment_summary column
    depends_on: [summary_generation, theme_extraction]
    uses_api: "Claude Sonnet"
    notes: "Prefers item_theme_narratives when available (cheaper). Falls back to raw comment metadata."

  vote_explainer_generation:
    module: generate_vote_explainers.py
    description: "Plain-language vote/motion explainers (text blob; structured 5-field variant in flight, see notes)"
    reads_from: [motions]
    writes_to: [motions]  # Updates vote_explainer column
    depends_on: [summary_generation, transcript_vote_extraction]
    uses_api: "Claude Sonnet"
    notes: |
      Two generators live in vote_explainer.py:

      1. generate_vote_explainer() — the original 3-5 sentence text
         blob, persisted to motions.vote_explainer. Reads agenda item +
         motion + votes + (optional) per-category history. This is the
         current production path.

      2. generate_structured_vote_explainer() — 5-field structured
         JSON (basics / why_it_matters / the_other_side / decisions /
         whats_next). Reads everything (1) reads PLUS the per-item
         transcript window from data/transcripts/{date}_windows.json
         (produced by transcript_windowing) and public comments.
         Schema migration to persist this output as a JSONB column and
         frontend rendering are pending; the orchestrator's --structured
         flag is also pending. Cost ~$0.04/motion.

      Source-closest discipline: the_other_side comes from the
      transcript window or is null. Voting-pattern fabrications
      ("departure from usual pattern") are explicitly forbidden in
      the system prompt — the failure mode being fixed is the
      "97.9% of contract items" hallucination.

  embedding_generation:
    module: embedding_generator.py
    description: "OpenAI text-embedding-3-small vectors for semantic search (Layer 3)"
    reads_from: [agenda_items, meetings, officials, motions]
    writes_to: [agenda_items_embeddings, meetings_embeddings, officials_embeddings, motions_embeddings]  # Sidecar tables, migration 111
    depends_on: [summary_generation, meeting_summary_generation, vote_explainer_generation]
    uses_api: "OpenAI Embeddings"
    batch_runner: batch_embed.py
    notes: "Waits for every field currently composed into an embedding: agenda item summary/topic (via summary_generation), meeting_summary, and motion vote_explainer. proceeding_type is retrieval metadata and is not part of the embedding text, so proceeding_classification is intentionally not an execution dependency."

  proceeding_classification:
    module: batch_classify_proceeding.py
    description: "LLM classification of agenda item proceeding types"
    reads_from: [agenda_items]
    writes_to: [agenda_items]  # Updates proceeding_type column
    uses_api: "Claude Sonnet"
    batch_runner: batch_classify_proceeding.py

  # bio_generation: standalone script (council_profiles.py), not in SYNC_SOURCES
  # commission_seeding: standalone script (seed_commissions.py), not in SYNC_SOURCES
  # cloud_pipeline: orchestrator script, not in SYNC_SOURCES (dispatches other sources)
  # community_comments_submission: web POST endpoint (web/src/app/api/community-comments/route.ts),
  #   not in SYNC_SOURCES — referenced as the writer for community_comments table


# ══════════════════════════════════════════════════════════════
# QUERIES — Frontend query functions → tables they read
# ══════════════════════════════════════════════════════════════

queries:
  # ── Meetings ────────────────────────────────────────────────
  getMeetings:
    file: queries.ts
    tables: [meetings]
    used_by: []  # Internal helper — called by getMeetingsWithCounts, not used directly by pages

  getNextMeeting:
    file: queries.ts
    tables: [meetings]
    used_by: ["/"]  # UpcomingMeetingBanner component

  getMeetingsWithCounts:
    file: queries.ts
    tables: [meetings]  # Uses RPC get_meeting_counts
    used_by: ["/"]

  getMeeting:
    file: queries.ts
    tables: [meetings, bodies, agenda_items, motions, votes, meeting_attendance,
             closed_session_items]
    used_by: ["/meetings/[id]"]

  getAdjacentMeetings:
    file: queries.ts
    tables: [meetings]
    used_by: ["/meetings/[id]"]

  # ── Officials ───────────────────────────────────────────────
  getOfficials:
    file: queries.ts
    tables: [officials]
    used_by: ["/council"]

  getOfficialBySlug:
    file: queries.ts
    tables: [officials]  # Uses slug derived from name
    used_by: ["/council/[slug]"]

  getOfficialVotingRecord:
    file: queries.ts
    tables: [votes, motions, agenda_items, meetings]
    used_by: ["/council/[slug]"]

  getOfficialContributions:
    file: queries.ts
    tables: [committees, contributions, donors]
    used_by: ["/council/[slug]"]

  getPastElectionDates:
    file: queries.ts
    tables: [elections]
    used_by: ["/council/[slug]", "/influence/elections"]

  getEconomicInterests:
    file: queries.ts
    tables: [economic_interests]
    used_by: ["/council/[slug]"]

  getForm700Filings:
    file: queries.ts
    tables: [form700_filings]
    used_by: ["/council/[slug]"]

  getOfficialWithStats:
    file: queries.ts
    tables: [officials, votes, meeting_attendance]
    used_by: ["/council/[slug]"]

  getOfficialCategoryBreakdown:
    file: queries.ts
    tables: [votes]
    used_by: ["/council/[slug]"]

  getMeetingStats:
    file: queries.ts
    tables: [meetings, agenda_items, votes, contributions, conflict_flags]
    used_by: ["/council/analytics"]

  # ── Conflict Analysis ──────────────────────────────────────
  getConflictFlags:
    file: queries.ts
    tables: [conflict_flags]
    # Phase 2.6: /reports/[meetingId] folded into /meetings/[id] as
    # operator-gated <MeetingConflictsSection>; legacy URL 308-redirects.
    used_by: ["/meetings/[id]"]

  getAttendance:
    file: queries.ts
    tables: [meeting_attendance]
    used_by: ["/meetings/[id]"]

  getMeetingsWithFlags:
    file: queries.ts
    tables: [conflict_flags, meetings, agenda_items]
    used_by: ["/reports"]

  getMeetingFlagCounts:
    file: queries.ts
    tables: [conflict_flags]
    used_by: ["/meetings"]

  getAgendaItemsByCategory:
    file: queries.ts
    tables: [agenda_items, meetings]
    used_by: ["/meetings/category/[slug]"]

  getConflictFlagsDetailed:
    file: queries.ts
    tables: [conflict_flags]
    # Phase 2.6: see getConflictFlags note above.
    used_by: ["/meetings/[id]"]

  getMeetingForReport:
    file: queries.ts
    tables: [meetings, agenda_items]
    # Phase 2.6: only the /reports list still calls this; detail folded into /meetings/[id].
    used_by: ["/reports"]

  getFinancialConnectionsForOfficial:
    file: queries.ts
    tables: [conflict_flags, motions]
    used_by: ["/financial-connections"]

  getAllFinancialConnectionSummaries:
    file: queries.ts
    tables: [conflict_flags, motions, officials]
    used_by: ["/financial-connections", "/influence"]

  getOfficialComparativeStats:
    file: queries.ts
    tables: [committees, contributions]
    used_by: ["/council/[slug]"]

  # ── Influence Map ────────────────────────────────────────────
  getAgendaItemBasic:
    file: queries.ts
    tables: [agenda_items, meetings]
    # Phase 2.6: standalone /influence/item/[id] page now redirects to the
    # canonical agenda-item URL. getAgendaItemBasic is used by that redirect
    # stub to resolve the destination (meeting_id + item_number).
    used_by: ["/influence/item/[id]"]

  getAgendaItemDetail:
    file: queries.ts
    tables: [agenda_items, meetings, motions, votes, public_comments,
             conflict_flags, officials, comment_themes,
             comment_theme_assignments, item_theme_narratives]
    used_by: ["/meetings/[id]/items/[itemNumber]"]

  getAgendaItemSlugs:
    file: queries/meetings.ts
    tables: [agenda_items, meetings]
    used_by: []
    note: "Legacy unbounded helper; public sitemap discovery uses getRecentAgendaItemSlugs."

  getRecentAgendaItemSlugs:
    file: queries/sitemap.ts
    tables: [agenda_items, meetings]
    used_by: ["/sitemap.xml"]
    note: "Active items from non-cancelled meetings on or after the injected rolling 24-month UTC cutoff, including scheduled upcoming items; exact-count and response-length guards fail closed at 10,000 rows or on truncation."

  getSitemapMeetings:
    file: queries/sitemap.ts
    tables: [meetings]
    used_by: ["/sitemap.xml"]

  getSitemapOfficials:
    file: queries/sitemap.ts
    tables: [officials]
    used_by: ["/sitemap.xml"]
    note: "Current council roles only."

  getSitemapElections:
    file: queries/sitemap.ts
    tables: [elections]
    used_by: ["/sitemap.xml"]

  getSitemapCommissions:
    file: queries/sitemap.ts
    tables: [commissions]
    used_by: ["/sitemap.xml"]

  getSitemapDonorSlugs:
    file: queries/sitemap.ts
    tables: [donors]
    used_by: ["/sitemap.xml"]
    note: "Only graduated individual profiles at the public $5,000 threshold."

  getSitemapOrganizationSlugs:
    file: queries/sitemap.ts
    tables: [donors]
    used_by: ["/sitemap.xml"]
    note: "Only public union/corporation profiles with tracked giving."

  getItemInfluenceMapData:
    file: queries.ts
    tables: [agenda_items, meetings, conflict_flags, motions, votes,
             officials, committees, contributions, donors,
             behested_payments]
    used_by: ["/influence/item/[id]"]

  # ── Election Cycles (B.24 + S21.5) ──────────────────────────
  getElections:
    file: queries.ts
    tables: [elections]
    used_by: ["/influence/elections"]

  getUpcomingElection:
    file: queries.ts
    tables: [elections]
    used_by: ["/elections/find-my-district", "_layout (Nav next-election link)"]

  electionToSlug:
    file: queries.ts
    tables: []  # Pure helper, no DB access
    used_by: ["_layout (Nav next-election link)", "/elections (redirect)", "/sitemap.xml"]
    note: "Construct URL slug from election record. Inverse of getElectionBySlug."

  getElectionBySlug:
    file: queries.ts
    tables: [elections]
    used_by: ["/elections/[slug]"]

  getElectionWithCandidates:
    file: queries.ts
    tables: [elections, election_candidates]
    used_by: ["/influence/elections/[id]"]

  getElectionFundraisingSummary:
    file: queries.ts
    tables: [election_candidates, contributions]
    used_by: ["/influence/elections/[id]"]

  getCandidateTopDonors:
    file: queries.ts
    tables: [contributions, donors]
    used_by: ["/elections/[slug]"]

  # getCandidateContributionBreakdown removed 2026-05-20: its output
  # (per-bucket × per-source-type matrix) is now built inside
  # getCandidateFundraisingDetails so the candidate page does one
  # round-trip instead of two. See I160 in docs/AI-PARKING-LOT.md.

  getCandidateFundraisingDetails:
    file: queries.ts
    tables: [election_candidates, contributions, committees]
    used_by: ["/elections/[slug]"]

  getFilingPeriodBriefing:
    file: queries.ts
    tables: [filing_period_briefings]
    used_by: ["/elections/[slug]/candidates/[candidateSlug]"]

  getCandidateFundingBreakdown:
    file: queries.ts
    tables: [contributions, donors]
    used_by: ["/elections/[slug]/mayor/funding"]
    returns: "Per-candidate aggregate of controlled-committee contributions bucketed by contributor_type (individual/union/corporate/pac_ie/other), with top entities per bucket. Powers the operator-only funding artifact panel. Bucket totals are AS-OF the latest filing; freshness exposed via last_updated_at."

  getCandidateIESupport:
    file: queries.ts
    tables: [committees, contributions, independent_expenditures, donors]
    used_by: ["/elections/[slug]/mayor/funding"]
    returns: "Independent expenditure committees supporting or opposing a candidate. Reconciles two source streams by committee name: (1) committees whose name matches 'supporting [candidate]' (catches IEs before any expenditures filed, e.g. POA-funded Safe Richmond Neighborhoods $30K seed), and (2) independent_expenditures rows where candidate_name matches (catches EBWF-style IEs whose committee name doesn't reference the candidate). Each supporter reports both ie_funds_raised (Schedule A into the IE) and ie_funds_spent (expenditures on the candidate's behalf), so the funding panel can distinguish 'in the bank' from 'already deployed' money."

  getOfficialElectionHistory:
    file: queries.ts
    tables: [election_candidates, elections]
    used_by: ["/council/[slug]"]

  getCurrentCandidacies:
    file: queries.ts
    tables: [election_candidates, elections]
    used_by: ["/council"]

  getBulkFundraisingStats:
    file: queries.ts
    tables: [committees, contributions, elections]
    used_by: ["/council"]

  # ── Public Records ──────────────────────────────────────────
  getPublicRecordsStats:
    file: queries.ts
    tables: [nextrequest_requests]
    used_by: ["/public-records"]

  getDepartmentCompliance:
    file: queries.ts
    tables: [nextrequest_requests]
    used_by: ["/public-records"]

  getRecentRequests:
    file: queries.ts
    tables: [nextrequest_requests]
    used_by: ["/public-records"]

  getAllPublicRecords:
    file: queries.ts
    tables: [nextrequest_requests]
    used_by: ["/public-records"]

  # ── Community Comments ──────────────────────────────────────
  # getCommunityComments removed 2026-05-20: the agenda-item detail
  # page fetches community comments through the /api/community-comments
  # GET endpoint, not a direct Supabase query function. The route still
  # appears under the community_comments table's api_routes.

  # ── Commissions ─────────────────────────────────────────────
  getCommissions:
    file: queries.ts
    tables: [commissions, commission_members]
    used_by: ["/commissions"]

  getCommission:
    file: queries.ts
    tables: [commissions, commission_members]
    used_by: ["/commissions/[id]"]

  getCommissionStaleness:
    file: queries.ts
    tables: [v_commission_staleness]
    used_by: ["/commissions"]

  getCommissionMeetings:
    file: queries.ts
    tables: [bodies, meetings]
    used_by: ["/commissions/[id]"]

  # ── Neighborhood Councils ──────────────────────────────────
  getNeighborhoodCouncils:
    file: queries.ts
    tables: [neighborhood_councils]
    used_by: ["/elections/find-my-district"]

  # ── Voting Patterns (Phase 2.6: consolidated under /council/analytics) ─
  getCategoryStats:
    file: queries.ts
    tables: [agenda_items]
    used_by: ["/council/analytics"]

  getControversialItems:
    file: queries.ts
    tables: [agenda_items]
    used_by: ["/council/analytics", "/meetings/most-discussed"]

  getTopicCounts:
    file: queries.ts
    tables: [agenda_items, meetings]
    used_by: []  # Retained for potential reuse; /topics now uses getPromotedTopics
    returns: "Topic label counts with latest meeting date"

  getTopicItems:
    file: queries.ts
    tables: [agenda_items, meetings]
    used_by: ["/topics/[slug]"]
    returns: "Agenda items for a specific topic_label, newest first"

  getPromotedTopics:
    file: queries.ts
    tables: [agenda_items, meetings]
    used_by: ["/topics", "/topics/[slug]"]
    returns: "Topics with item_count >= TOPIC_PROMOTION_THRESHOLD across all meetings (organic, recurrence-based taxonomy)"

  getPromotedTopicLabels:
    file: queries.ts
    tables: [agenda_items, meetings]
    used_by: ["/meetings/[id]"]
    returns: "JSON-serializable label list — promoted topics passed to client components for sidebar chip filtering"

  topicLabelToSlug:
    file: queries.ts
    tables: []  # Pure string transform
    used_by: ["/topics", "/topics/[slug]"]

  getMostDiscussedItems:
    file: queries.ts
    tables: [agenda_items, meetings]
    used_by: ["/"]
    returns: "Top agenda items by public_comment_count within recent N days"

  getCoalitionData:
    file: queries.ts
    tables: [officials, meetings, votes]
    used_by: ["/council/analytics"]

  getDivergentMotions:
    file: queries.ts
    tables: [officials, meetings, motions, votes, agenda_items]
    used_by: ["/council/analytics"]
    returns: "{motions: DivergentMotion[], officials} — per-motion vote breakdowns for the public 'where members split' table. Filters to current council members; falls back to 'absent' for members not voting on a motion."

  getCrossMeetingPatterns:
    file: queries.ts
    tables: [officials, committees, contributions, meetings, votes]
    used_by: ["/council/analytics"]

  # ── Candidate Detail Page (S24) ─────────────────────────────
  computeAlignmentStats:
    file: queries.ts
    tables: [votes]
    used_by: ["/elections/[slug]/candidates/[candidateSlug]"]
    returns: "{majority_alignment_rate, sole_dissent_count} — fallback when bio_factual is null"

  getMostCommentedVotes:
    file: queries.ts
    tables: [votes, motions, agenda_items, meetings, item_theme_narratives, comment_themes]
    used_by: ["/elections/[slug]/candidates/[candidateSlug]"]
    returns: "Top N agenda items where this official voted, ranked by public_comment_count, with full roll call and theme narratives"

  getFullCandidateDonors:
    file: queries.ts
    tables: [contributions, donors]
    used_by: ["/elections/[slug]/candidates/[candidateSlug]"]
    returns: "{cycleDonors, priorDonors, cycleLabel} — cycle-partitioned donor list, government-entity filtered"

  # ── PAC Profiles (S24 Phase 4, operator-only V1) ────────────
  pacToSlug:
    file: queries.ts
    tables: []  # Pure string transform — slugify name + filer_id
    used_by: ["/pac", "/pac/[slug]"]

  getPACList:
    file: queries.ts
    tables: [committees, contributions]
    used_by: ["/pac", "/pac/[slug]"]
    returns: "PAC committees (official_id IS NULL) with aggregate stats — total raised, donor count, date span. Sorted by total_raised."

  getPACBySlug:
    file: queries.ts
    tables: [committees, contributions]  # delegates to getPACList
    used_by: ["/pac/[slug]"]

  getPACContributions:
    file: queries.ts
    tables: [contributions, donors]
    used_by: ["/pac/[slug]"]
    returns: "Donor-level contributions INTO this committee, ordered most-recent first."

  getPACOutgoing:
    file: queries.ts
    tables: [donors, contributions, committees]
    used_by: ["/pac/[slug]"]
    returns: "Cross-filing flows: where this PAC's name appears as a donor on another committee's filing. V1.2: matches against several normalized-name variants (full, before-comma, with/without PAC suffix) to catch real-world short-form variations. IAFF-style word-reordered names need entity resolution (S26)."

  getPACCycleBars:
    file: queries.ts
    tables: [contributions, donors]
    used_by: ["/pac/[slug] (V2 temporal layer)"]
    returns: "Per-election-cycle aggregates of money in (committee_id-based) and out (variant-name-matched). Bucketing rule: even years belong to that cycle, odd years roll forward to the next even year. Pre-V2 query, not yet wired to a page."

  getPACListWithCycleBars:
    file: queries.ts
    tables: [committees, contributions, donors]
    used_by: ["/pac (V2 index)"]
    returns: "Bulk version of getPACList with 5-cycle history per PAC + current_cycle_in/out aggregates. Replaces N+1 calls to getPACCycleBars at the index page. Powers the per-row sparkline."

  getPACFlowMatrix:
    file: queries.ts
    tables: [contributions, donors, committees]
    used_by: ["/pac/[slug] (V2 Explore layer)"]
    returns: "Donors x candidates conduit matrix for a single PAC. Cells are computed via per-cycle proportional attribution: each donor's share of PAC intake in a cycle is applied to each outgoing flow to a candidate that cycle, summed across cycles. Returns null when sparse (fewer than 2 donors or 2 candidates with attributed flow). Top 20 donors x top 12 candidates by default."

  getPACIndependentExpenditures:
    file: queries.ts
    tables: [independent_expenditures]
    used_by: ["/pac/[slug]"]
    returns: "Independent expenditures filed by this PAC (support/oppose by candidate, payee, amount, date, expenditure code). Matched to the PAC by exact case-insensitive name match against independent_expenditures.committee_name. Earlier fuzzy-prefix variant was dropped (commit 4f51f33) because it conflated PACs sharing a prefix (e.g. East Bay Working Families variants); operator should still vet for name-collision noise before public graduation."

  # ── Organization Profiles (S28.3) ────────────────────────────

  getOrgList:
    file: queries/orgs.ts
    tables: [donors, contributions]
    used_by: ["/unions", "/corporations", "/orgs/[slug]"]
    returns: "Union and corporation donors grouped by entity_slug, with aggregate contribution stats. entity_type IN ('union', 'corporation')."

  getOrgBySlug:
    file: queries/orgs.ts
    tables: [donors, contributions]  # delegates to getOrgList
    used_by: ["/orgs/[slug]"]

  getOrgOutgoing:
    file: queries/orgs.ts
    tables: [contributions, committees]
    used_by: ["/orgs/[slug]"]
    returns: "Contributions FROM this org (as donor) TO committees, with recipient committee and candidate context."

  getOrgCycleBars:
    file: queries/orgs.ts
    tables: [contributions]
    used_by: ["/orgs/[slug] (temporal layer)"]
    returns: "Per-election-cycle aggregates of contributions FROM this org."

  getOrgIndependentExpenditures:
    file: queries/orgs.ts
    tables: [independent_expenditures]
    used_by: ["/orgs/[slug]"]
    returns: "Independent expenditures filed by this org, matched by case-insensitive name against independent_expenditures.committee_name."

  # ── Individual Donors ─────────────────────────────────────────
  getDonorList:
    file: queries/donors.ts
    tables: [donors, contributions]
    used_by: ["/donors"]
    returns: "All individual donors above $5K aggregate threshold with date-range bounds."

  getDonorBySlug:
    file: queries/donors.ts
    tables: [donors, contributions, committees]
    used_by: ["/donors/[slug]"]
    returns: "Single donor profile by entity_slug with full contribution details."

  getDonorOutgoing:
    file: queries/donors.ts
    tables: [contributions, committees]
    used_by: ["/donors/[slug]"]
    returns: "Contributions FROM this individual donor TO committees, with recipient context."

  getDonorCycleBars:
    file: queries/donors.ts
    tables: [contributions]
    used_by: ["/donors/[slug] (temporal layer)"]
    returns: "Per-election-cycle aggregates of contributions FROM this individual donor."

  # ── Search ──────────────────────────────────────────────────
  searchSite:
    file: queries.ts
    tables: [meetings, agenda_items, officials, motions]  # Full-text search
    used_by: ["/search"]

  searchHybrid:
    file: queries.ts
    tables: [meetings, agenda_items, officials, motions]  # FTS + vector similarity (RRF)
    used_by: ["/search"]

  findSimilarItems:
    file: queries.ts
    tables: [agenda_items, meetings, motions]  # Vector cosine similarity
    used_by: ["/meetings/[id]/items/[itemNumber]"]

  # ── Utility (not async, no direct table access) ─────────────
  buildOfficialConnectionSummary:
    file: queries.ts
    tables: []  # Transforms data from other queries
    used_by: ["/financial-connections"]

  officialToSlug:
    file: queries.ts
    tables: []  # Pure string transform
    used_by: ["/council"]

  parseVoteTally:
    file: queries.ts
    tables: []  # Pure string parser
    used_by: ["/meetings/[id]"]


# ══════════════════════════════════════════════════════════════
# PAGES — Frontend routes → queries used
# ══════════════════════════════════════════════════════════════

pages:
  "/sitemap.xml":
    description: "Daily, bounded inventory of canonical public routes; operator/noindex, candidate, retired mayor-funding, management, API, and heavy PAC detail routes are excluded"
    queries: [getSitemapMeetings, getRecentAgendaItemSlugs,
              getSitemapOfficials, getSitemapElections,
              getSitemapCommissions, getSitemapDonorSlugs,
              getSitemapOrganizationSlugs,
              electionToSlug]

  "/":
    description: "Home — upcoming meetings with summary counts"
    queries: [getMeetingsWithCounts]

  "/meetings":
    description: "Meeting discovery — month-grouped list, mini-calendar, calendar grid toggle"
    queries: [getMeetingsWithCounts, getMeetingFlagCounts]

  "/meetings/[id]":
    description: "Meeting detail — agenda items, votes, attendance"
    queries: [getMeeting, getAttendance, parseVoteTally, getPromotedTopicLabels]

  "/meetings/[id]/items/[itemNumber]":
    description: "Agenda item detail — full item with comments, votes, related items"
    queries: [getAgendaItemDetail]

  "/meetings/category/[slug]":
    description: "Category drill-through — all agenda items in a category"
    queries: [getAgendaItemsByCategory]

  "/meetings/most-discussed":
    description: "Most contentious agenda items by controversy score (top public testimony)"
    queries: [getControversialItems]
    publication_tier: graduated

  "/topics":
    description: "Topic index — recurring topics promoted by >=3 items city-wide (organic, no curation)"
    queries: [getPromotedTopics]

  "/topics/[slug]":
    description: "Topic timeline — chronological agenda items for a promoted topic"
    queries: [getPromotedTopics, getTopicItems]
    publication_tier: graduated

  "/council":
    description: "Council member grid"
    queries: [getOfficials, officialToSlug]

  "/council/[slug]":
    description: "Council member profile — bio, voting record, donors, interests"
    queries: [getOfficialBySlug, getOfficialVotingRecord, getOfficialContributions,
              getEconomicInterests, getOfficialWithStats, getOfficialCategoryBreakdown,
              getOfficialComparativeStats]

  "/council/analytics":
    description: "Phase 2.6 consolidation of three formerly-separate routes — /council/voting-patterns (default tab, public), /council/stats (?tab=stats, operator), /council/patterns (?tab=patterns, operator). Old URLs 308-redirect via next.config.ts. Tabs are real <Link>s for indexability per-tab; force-dynamic to absorb anon statement_timeout under build prerenders."
    queries: [getCoalitionData, getDivergentMotions, getCategoryStats,
              getControversialItems, getCrossMeetingPatterns]

  "/reports":
    description: "Operator-only index of meetings with conflict flags. Detail pages (formerly /reports/[meetingId]) are folded into /meetings/[id] as an operator-gated MeetingConflictsSection; the old detail URL 308-redirects to /meetings/[id]#conflicts (Phase 2.6)."
    queries: [getMeetingsWithFlags, getConflictFlags]

  "/reports/[meetingId]":
    description: "Phase 2.6 redirect stub. The per-meeting financial-contribution report was folded into /meetings/[id] as an operator-gated MeetingConflictsSection; this route 308-redirects to /meetings/[id]#conflicts. No DB lookup — destination is constructed from the meetingId param."
    queries: []

  "/influence":
    description: "Influence map — official index with financial connection summaries and confidence breakdown"
    queries: [getAllFinancialConnectionSummaries]

  "/influence/item/[id]":
    description: "Phase 2.6 redirect stub. Standalone influence map for an agenda item was folded into the canonical /meetings/[id]/items/[itemNumber] page as operator-gated <InfluenceMapItemSection>. This route does a DB lookup via getAgendaItemBasic and 308-redirects to the canonical URL."
    queries: [getAgendaItemBasic]

  "/influence/elections":
    description: "Election cycles index — upcoming and past elections with candidate counts (B.24, Graduated)"
    queries: [getElections]

  "/influence/elections/[id]":
    description: "Election detail — candidates, fundraising narratives, campaign finance overview (B.24, Graduated)"
    queries: [getElectionWithCandidates, getElectionFundraisingSummary]

  "/elections":
    description: "Elections index — upcoming and past Richmond elections with candidate counts"
    queries: [getElections]
    api_routes: ["/api/subscribe"]

  "/elections/districts":
    description: "District map — council districts with current officials and neighborhood council overlay"
    queries: [getOfficials, getNeighborhoodCouncils]

  "/elections/[slug]":
    description: "Election detail — voter guide with candidate fundraising, top donors, contribution breakdown"
    queries: [getElectionBySlug, getCandidateFundraisingDetails, getElectionWithCandidates]

  "/elections/[slug]/candidates/[candidateSlug]":
    description: "Candidate detail — voting alignment, top donors, most-discussed votes (S24)"
    queries: [getElectionBySlug, getCandidateFundraisingDetails, getOfficialWithStats,
              getFullCandidateDonors, getMostCommentedVotes, computeAlignmentStats,
              officialToSlug]

  "/elections/[slug]/mayor/funding":
    description: "Operator-only Mayor's-race funding artifact. Per-candidate panels showing where each campaign's money comes from (individual / labor union / for-profit / other PAC), plus the independent expenditure committees spending on each candidate's behalf. Updates hourly via ISR as NetFile syncs land. Lives at /elections/[slug]/mayor/funding instead of /operator/* to keep the URL adjacent to the public candidate pages it complements; OperatorGate is the access control. See docs/plans for context and the validation analysis it surfaces."
    queries: [getElectionBySlug, getElectionWithCandidates, getCandidateFundingBreakdown, getCandidateIESupport]
    publication_tier: operator

  "/elections/methodology":
    description: "Public methodology page — plain-language guide to contribution bucket boundaries with primary-source citations (FPPC $100, SB 1439 $250, Form 497 $1000, Richmond MC $2500)"
    queries: []
    publication_tier: public

  "/elections/find-my-district":
    description: "District lookup — find your council district, neighborhood council, and upcoming election candidates with fundraising"
    queries: [getOfficials, getUpcomingElection, getElectionFundraisingSummary, getNeighborhoodCouncils]
    api_routes: ["/api/geocode"]

  "/pac":
    description: "Political committees index — every Richmond PAC, ballot-measure committee, and IE committee (operator-only V1, S24 Phase 4)"
    queries: [getPACList]
    publication_tier: operator

  "/pac/[slug]":
    description: "Political committee profile — donors INTO the committee + cross-filing flows OUT to other committees. IE detail omitted in V1 due to CAL-ACCESS amendment dupes (D45). Operator-only until sponsor disclosure prose has been hand-vetted."
    queries: [getPACBySlug, getPACList, getPACContributions, getPACOutgoing, pacToSlug]
    publication_tier: operator

  "/orgs":
    description: "Redirect to /unions (I164: split into separate union/corporation routes, 2026-07-08)"
    queries: []
    publication_tier: public

  "/unions":
    description: "Union organization index — labor organizations that contribute to Richmond campaigns (I164, split from /orgs 2026-07-08)"
    queries: [getOrgList]
    publication_tier: public

  "/corporations":
    description: "Corporation index — companies and business associations that contribute to Richmond campaigns (I164, split from /orgs 2026-07-08)"
    queries: [getOrgList]
    publication_tier: public

  "/orgs/[slug]":
    description: "Organization profile — giving history, cycle bars, and independent expenditures for a single union or corporation (S28.3, Graduated → Public 2026-07-08)"
    queries: [getOrgBySlug, getOrgList, getOrgOutgoing, getOrgCycleBars, getOrgIndependentExpenditures]
    publication_tier: public

  "/donors":
    description: "Individual donor index — all donors above $5K aggregate (S28.6)"
    queries: [getDonorList]
    publication_tier: public

  "/donors/[slug]":
    description: "Individual donor profile — contribution history, cycle bars, and recipient context (S28.6)"
    queries: [getDonorBySlug, getDonorList, getDonorOutgoing, getDonorCycleBars]
    publication_tier: public

  "/influence/methodology":
    description: "Influence analysis methodology and disclaimer page"
    queries: []

  "/financial-connections":
    description: "Council-donor network and financial connections"
    queries: [getFinancialConnectionsForOfficial, getAllFinancialConnectionSummaries,
