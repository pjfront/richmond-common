    notes: "External-only — does not read or write any database table"


# ══════════════════════════════════════════════════════════════
# FIELD MAP — End-to-end: visible field → source pipeline
#
# Format: page → field label → query/API → table.column → source
# Use `pipeline_map.py trace field:<field_name>` to trace any field.
#
# This is the section that answers: "This field shows 0 — what do
# I need to rerun?" Trace backward from the field to the source.
# ══════════════════════════════════════════════════════════════

field_map:

  # ── Public sitemap (/sitemap.xml) ────────────────────────────

  "/sitemap.xml":
    "meeting detail URLs":
      query: getSitemapMeetings
      column: meetings.id
      sources: [escribemeetings, minutes_extraction]
      note: "Meeting dates are event dates, not content-modification timestamps, so meeting URLs deliberately omit lastModified."

    "rolling agenda-item URLs":
      query: getRecentAgendaItemSlugs
      column: "agenda_items.meeting_id + agenda_items.item_number + meetings.meeting_date"
      sources: [escribemeetings, minutes_extraction]
      note: "Active item URLs from the approved rolling 24-month lower cutoff onward, including scheduled upcoming meetings; exact count/length guards reject truncation."

    "current council profile URLs":
      query: getSitemapOfficials
      column: officials.name
      sources: []
      enrichment: commission_seeding

    "election detail URL records":
      query: getSitemapElections
      column: "elections.election_date + elections.election_type + elections.updated_at"
      sources: [elections]

    "election URL slug":
      query: electionToSlug
      column: "derived from elections.election_date + elections.election_type"
      sources: []
      note: "Pure URL-slug helper, no DB read of its own."

    "commission detail URLs":
      query: getSitemapCommissions
      column: "commissions.id + commissions.last_website_scrape + commissions.created_at"
      sources: []
      enrichment: commission_seeding

    "individual donor profile URLs":
      query: getSitemapDonorSlugs
      column: "donors.entity_slug + donors.created_at"
      sources: [netfile, calaccess]
      enrichment: contributor_classification
      note: "Only graduated person profiles at the public $5,000 threshold."

    "union and corporation profile URLs":
      query: getSitemapOrganizationSlugs
      column: "donors.entity_slug + donors.created_at"
      sources: [netfile, calaccess]
      enrichment: contributor_classification
      note: "Only public union/corporation profiles with tracked giving."

  # ── Home Page (/) ───────────────────────────────────────────

  "/":
    "meeting date":
      query: getMeetingsWithCounts
      column: meetings.meeting_date
      sources: [escribemeetings, minutes_extraction]

    "meeting type":
      query: getMeetingsWithCounts
      column: meetings.meeting_type
      sources: [escribemeetings, minutes_extraction]

    "agenda item count":
      query: getMeetingsWithCounts
      rpc: get_meeting_counts
