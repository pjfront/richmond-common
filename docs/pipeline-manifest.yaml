    tables: [contributions, donors]
    used_by: ["/pac/[slug] (V2 temporal layer)"]
    returns: "Per-election-cycle aggregates of money in (committee_id-based) and out (variant-name-matched). Bucketing rule: even years belong to that cycle, odd years roll forward to the next even year. Pre-V2 query, not yet wired to a page."

  getPACListWithCycleBars:
    file: queries.ts
    tables: [committees, contributions, donors]
    used_by: ["/pac (V2 index)"]
    returns: "Bulk version of getPACList with 5-cycle history per PAC + current_cycle_in/out aggregates. Replaces N+1 calls to getPACCycleBars at the index page. Powers the per-row sparkline."

  getPACFlowMatrix:
    file: queries.ts
    tables: [contributions, donors, committees]
    used_by: ["/pac/[slug] (V2 Explore layer)"]
    returns: "Donors x candidates conduit matrix for a single PAC. Cells are computed via per-cycle proportional attribution: each donor's share of PAC intake in a cycle is applied to each outgoing flow to a candidate that cycle, summed across cycles. Returns null when sparse (fewer than 2 donors or 2 candidates with attributed flow). Top 20 donors x top 12 candidates by default."

  # ── Search ──────────────────────────────────────────────────
  searchSite:
    file: queries.ts
    tables: [meetings, agenda_items, officials]  # Full-text search
    used_by: ["/search"]

  searchHybrid:
    file: queries.ts
    tables: [meetings, agenda_items, officials, motions]  # FTS + vector similarity (RRF)
    used_by: ["/search"]

  findSimilarItems:
    file: queries.ts
    tables: [agenda_items, meetings, motions]  # Vector cosine similarity
    used_by: ["/meetings/[id]/items/[itemNumber]"]

  # ── Utility (not async, no direct table access) ─────────────
  buildOfficialConnectionSummary:
    file: queries.ts
    tables: []  # Transforms data from other queries
    used_by: ["/financial-connections"]

  officialToSlug:
    file: queries.ts
    tables: []  # Pure string transform
    used_by: ["/council"]

  parseVoteTally:
    file: queries.ts
    tables: []  # Pure string parser
    used_by: ["/meetings/[id]"]


